<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械核心 — Boss 战 BGM 试听</title>
<style>
  :root {
    --bg: #0a0e16; --cyan: #35e0ff; --magenta: #ff3d81; --amber: #ffb347;
    --dim: #4a5873; --text: #cfe8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(53,224,255,0.10), transparent 42%),
      radial-gradient(circle at 85% 80%, rgba(255,61,129,0.10), transparent 42%),
      linear-gradient(rgba(74,88,115,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,88,115,0.10) 1px, transparent 1px);
    background-size: auto, auto, 42px 42px, 42px 42px;
  }
  h1 {
    margin: 0 0 4px; font-size: 26px; letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 12px var(--cyan), 0 0 32px rgba(53,224,255,0.45);
  }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; letter-spacing: 1px; }
  .panel {
    width: min(760px, 96vw); border: 1px solid rgba(53,224,255,0.35);
    border-radius: 10px; background: rgba(13,19,32,0.85);
    box-shadow: 0 0 24px rgba(53,224,255,0.12), inset 0 0 40px rgba(0,0,0,0.5);
    padding: 20px;
  }
  canvas#spec {
    width: 100%; height: 170px; display: block; border: 1px solid rgba(53,224,255,0.25);
    border-radius: 6px; background: rgba(4,8,14,0.9); margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 14px; }
  button {
    font: inherit; cursor: pointer; color: var(--text);
    background: rgba(53,224,255,0.08); border: 1px solid rgba(53,224,255,0.5);
    border-radius: 6px; padding: 10px 18px; letter-spacing: 1px;
    transition: all 0.15s ease;
  }
  button:hover { background: rgba(53,224,255,0.22); box-shadow: 0 0 14px rgba(53,224,255,0.35); }
  button:active { transform: translateY(1px); }
  button.primary { border-color: var(--amber); color: var(--amber); background: rgba(255,179,71,0.08); }
  button.primary:hover { background: rgba(255,179,71,0.2); box-shadow: 0 0 14px rgba(255,179,71,0.35); }
  button.stop { border-color: var(--magenta); color: var(--magenta); background: rgba(255,61,129,0.08); }
  button.stop:hover { background: rgba(255,61,129,0.2); box-shadow: 0 0 14px rgba(255,61,129,0.35); }
  button.phase { min-width: 96px; }
  button.phase.active {
    border-color: var(--magenta); color: #fff; background: rgba(255,61,129,0.28);
    box-shadow: 0 0 16px rgba(255,61,129,0.5);
  }
  .status { text-align: center; font-size: 13px; color: var(--dim); margin-top: 6px; min-height: 18px; }
  .status b { color: var(--cyan); font-weight: normal; }
  .legend {
    margin-top: 14px; font-size: 12px; color: var(--dim); line-height: 1.9;
    border-top: 1px dashed rgba(74,88,115,0.5); padding-top: 12px;
  }
  .legend span { color: var(--text); }
  a#dl { display: none; }
</style>
</head>
<body>
  <h1>机 械 核 心</h1>
  <div class="sub">《枪械工艺》BOSS 战 BGM · 暗黑合成波 / 工业电子 · 150 BPM · A 小调</div>
  <div class="panel">
    <canvas id="spec" width="720" height="170"></canvas>
    <div class="row">
      <button id="play" class="primary">▶ 播放</button>
      <button id="stop" class="stop">■ 停止</button>
      <button id="victory">✦ 胜利音</button>
      <button id="export">⬇ 导出 WAV</button>
    </div>
    <div class="row">
      <button class="phase" data-phase="1">阶段 1 弹幕</button>
      <button class="phase" data-phase="2">阶段 2 召唤</button>
      <button class="phase" data-phase="3">阶段 3 狂暴</button>
    </div>
    <div class="status" id="status">点击 ▶ 播放（需允许浏览器声音）</div>
    <div class="legend">
      <span>阶段 1</span>：鼓组 + 16 分贝斯脉冲 + 小调 Riff　|　<span>阶段 2</span>：+ 琶音 / 和弦 Stab　|　<span>阶段 3</span>：+ 失谐主旋律 / 上挑音 / 双踩镲
      <br>WAV 导出：引子 → 阶段1 循环 ×1 → 阶段3 循环 ×1 → 胜利收束（约 59 秒）
    </div>
  </div>
  <a id="dl"></a>

  <script src="boss-music.js"></script>
  <script>
    (function () {
      'use strict';
      const canvas = document.getElementById('spec');
      const g2d = canvas.getContext('2d');
      const statusEl = document.getElementById('status');
      const phaseBtns = Array.from(document.querySelectorAll('button.phase'));
      const CYAN = '#35e0ff', MAGENTA = '#ff3d81', AMBER = '#ffb347';

      let ctx = null, analyser = null, freq = null, music = null, raf = 0;

      function ensureCtx() {
        if (ctx) return true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { setStatus('浏览器不支持 Web Audio'); return false; }
        ctx = new AC();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.82;
        analyser.connect(ctx.destination);
        freq = new Uint8Array(analyser.frequencyBinCount);
        music = createBossMusic(ctx, { output: analyser, masterGain: 0.26 });
        return true;
      }

      function setStatus(t) { statusEl.innerHTML = t; }
      function renderStatus() {
        if (!music) return;
        const st = { intro: '引子警报', loop: '主循环', stopped: '已停止', idle: '待命' }[music.getState()] || music.getState();
        setStatus('状态：<b>' + st + '</b>　·　音乐阶段：<b>阶段 ' + music.getPhase() + '</b>　·　循环 16 小节 / 25.6s');
        phaseBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.phase) === music.getPhase()));
      }

      document.getElementById('play').addEventListener('click', () => {
        if (!ensureCtx()) return;
        if (ctx.state === 'suspended') ctx.resume();
        music.start();
      });
      document.getElementById('stop').addEventListener('click', () => {
        if (music) music.stop();
      });
      document.getElementById('victory').addEventListener('click', () => {
        if (music) music.victory();
      });
      phaseBtns.forEach(b => b.addEventListener('click', () => {
        if (!ensureCtx()) return;
        music.setPhase(Number(b.dataset.phase));
      }));

      // ---------- 频谱可视化 ----------
      function draw() {
        raf = requestAnimationFrame(draw);
        if (music) music.update();
        renderStatus();
        const W = canvas.width, H = canvas.height;
        g2d.fillStyle = 'rgba(4,8,14,0.92)';
        g2d.fillRect(0, 0, W, H);
        if (!analyser) return;
        analyser.getByteFrequencyData(freq);
        const bars = 72, bw = W / bars;
        for (let i = 0; i < bars; i++) {
          const v = freq[Math.floor(i * freq.length / bars)] / 255;
          const h = Math.max(2, v * H * 0.92);
          const t = i / bars;
          const col = t < 0.45 ? CYAN : t < 0.75 ? MAGENTA : AMBER;
          g2d.globalAlpha = 0.32 + 0.68 * v;
          g2d.fillStyle = col;
          g2d.fillRect(i * bw + 1, H - h, bw - 2, h);
          g2d.globalAlpha = 1;
        }
      }

      // ---------- WAV 导出（离渲染，同一引擎） ----------
      function audioBufferToWav(buffer) {
        const numCh = buffer.numberOfChannels;
        const sr = buffer.sampleRate;
        const len = buffer.length;
        const bytesPerSample = 2, blockAlign = numCh * bytesPerSample;
        const dataSize = len * blockAlign;
        const ab = new ArrayBuffer(44 + dataSize);
        const dv = new DataView(ab);
        const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
        wstr(0, 'RIFF'); dv.setUint32(4, 36 + dataSize, true); wstr(8, 'WAVE');
        wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
        dv.setUint16(22, numCh, true); dv.setUint32(24, sr, true);
        dv.setUint32(28, sr * blockAlign, true); dv.setUint16(32, blockAlign, true);
        dv.setUint16(34, 16, true);
        wstr(36, 'data'); dv.setUint32(40, dataSize, true);
        const chans = [];
        for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
        let off = 44;
        for (let i = 0; i < len; i++) {
          for (let c = 0; c < numCh; c++) {
            const s = Math.max(-1, Math.min(1, chans[c][i]));
            dv.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
            off += 2;
          }
        }
        return ab;
      }

      document.getElementById('export').addEventListener('click', async () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { setStatus('浏览器不支持 OfflineAudioContext'); return; }
        setStatus('正在离渲染并编码 WAV（约 60 秒音乐，请稍候）…');
        const sr = 44100;
        const total = Math.ceil(sr * (BGM_DATA.introDur + BGM_DATA.loopDur * 2 + 3));
        const off = new OfflineAudioContext(2, total, sr);
        const m = createBossMusic(off, { masterGain: 0.3 });
        m.start();
        const l0 = m.loopStart();
        m.renderBlock(l0, l0 + BGM_DATA.loopDur);                 // 阶段1
        m.setPhase(3, l0 + BGM_DATA.loopDur);                     // 转阶段上挑
        m.renderBlock(l0 + BGM_DATA.loopDur, l0 + BGM_DATA.loopDur * 2); // 阶段3
        m.victory(l0 + BGM_DATA.loopDur * 2);
        const buf = await off.startRendering();
        const wav = audioBufferToWav(buf);
        const blob = new Blob([wav], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = document.getElementById('dl');
        a.href = url;
        a.download = 'gun-craft-boss-bgm.wav';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        setStatus('已导出 gun-craft-boss-bgm.wav（' + Math.round(buf.duration) + ' 秒）');
      });

      draw();
    })();
  </script>
</body>
</html>

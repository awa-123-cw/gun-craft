<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枪械工艺 GUNSMITH</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e16;
    font-family: "Consolas", "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script id="game-script">
'use strict';

// ===== utils =====
const utils = (() => {
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function swapRemove(arr, i) {
    arr[i] = arr[arr.length - 1];
    arr.pop();
  }
  return { clamp, lerp, rand, randInt, distance, rectsOverlap, mulberry32, swapRemove };
})();

// ===== world =====
const Game = (() => {
  const VERSION = '0.3.0';
  const STEP = 1 / 120;
  const ROOM_W = 1500;
  const ROOM_H = 1100;

  // ===== PARTS（最小集，Task 5 扩充）=====
  const PARTS = {
    body: {
      pistol_body: { id: 'pistol_body', slot: 'body', name: '标准枪身', rarity: 0, color: '#35e0ff',
        base: { fireRate: 8, damage: 14, magSize: 12, reloadTime: 1.0, spread: 0.05 } }
    },
    ammo: {
      standard_ammo: { id: 'standard_ammo', slot: 'ammo', name: '标准弹药', rarity: 0, color: '#ffd166',
        base: { pellet: 1, pierce: 0 } }
    },
    mod: {
      none_mod: { id: 'none_mod', slot: 'mod', name: '空配件槽', rarity: 0, color: '#888888', base: {} }
    }
  };

  // ===== ENEMY_KINDS =====
  const ENEMY_KINDS = {
    chaser: {
      name: '冲锋者', color: '#ff4d5e', coreColor: '#7a0d1e',
      hp: 34, radius: 18, speed: 70, dmg: 18,
      behavior: 'chase_telegraph_dash', dashSpeed: 460, telegraphT: 0.45, cooldown: 1.6
    },
    shooter: {
      name: '射手', color: '#ff9f43', coreColor: '#7a3b00',
      hp: 22, radius: 16, speed: 60, dmg: 10,
      behavior: 'keep_distance_shoot', range: 330, fireInterval: 2.0, bulletSpeed: 210
    }
  };

  function buildGun(bodyId, ammoId, modId) {
    const b = PARTS.body[bodyId];
    const a = PARTS.ammo[ammoId];
    const m = PARTS.mod[modId];
    const stats = {
      fireRate: b.base.fireRate,
      damage: b.base.damage,
      magSize: b.base.magSize,
      reloadTime: b.base.reloadTime,
      spread: b.base.spread,
      pellet: (a && a.base.pellet) || 1,
      pierce: (a && a.base.pierce) || 0,
      bulletSpeed: 750,
      behaviors: []
    };
    return {
      slots: { body: bodyId, ammo: ammoId, mod: modId },
      stats,
      mag: stats.magSize,
      reloading: false,
      reloadT: 0,
      cooldown: 0
    };
  }

  // ===== audio（WebAudio 合成）=====
  const audio = (() => {
    let actx = null;
    function ac() {
      if (!actx && typeof AudioContext !== 'undefined') {
        try { actx = new AudioContext(); } catch (e) { actx = null; }
      }
      return actx;
    }
    function tone(f0, f1, dur, type, vol, delay) {
      const a = ac();
      if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(1, f0), t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(t0);
      o.stop(t0 + dur);
    }
    function noise(dur, vol, cutoff) {
      const a = ac();
      if (!a) return;
      const sr = a.sampleRate || 44100;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = a.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource();
      src.buffer = buf;
      const g = a.createGain();
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      let node = src;
      if (cutoff && a.createFilter) {
        const f = a.createFilter();
        f.frequency.setValueAtTime(cutoff, a.currentTime);
        src.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(a.destination);
      src.start();
    }
    function play(name) {
      const a = ac();
      if (!a) return;
      if (a.state === 'suspended') { try { a.resume(); } catch (e) {} }
      switch (name) {
        case 'pistol':
          noise(0.05, 0.45, 3200);
          tone(240 + Math.random() * 20, 70, 0.07, 'square', 0.22);
          break;
        case 'hit':
          noise(0.03, 0.3, 4500);
          tone(500 + Math.random() * 100, 300, 0.04, 'square', 0.12);
          break;
        case 'kill':
          tone(200, 60, 0.18, 'triangle', 0.3);
          noise(0.12, 0.25, 900);
          break;
      }
    }
    return { play };
  })();

  function createGame(canvas) {
    const world = {
      player: {
        x: ROOM_W / 2, y: ROOM_H / 2, vx: 0, vy: 0,
        hp: 100, maxHp: 100, radius: 14, speed: 260,
        aimAngle: 0, invuln: 0, recoil: 0
      },
      guns: [buildGun('pistol_body', 'standard_ammo', 'none_mod'), buildGun('pistol_body', 'standard_ammo', 'none_mod')],
      activeGun: 0,
      enemies: [],
      bullets: [],
      particles: [],
      pickups: [],
      casings: [],
      floaters: [],
      tracers: [],
      impactMarks: [],
      room: { id: 0, type: 'start', x: 0, y: 0, w: ROOM_W, h: ROOM_H, cleared: false, doors: { n: false, e: false, s: false, w: false } },
      map: null,
      coins: 0,
      time: 0,
      stats: { kills: 0, combo: 0, comboT: -9, score: 0 },
      enemySeq: 0
    };
    const state = { screen: 'start', paused: false };
    const camera = { x: world.player.x, y: world.player.y };
    const input = { keys: new Set(), pressedSet: new Set(), mouse: { x: 0, y: 0, down: false }, wheelDelta: 0 };
    const view = { w: canvas.clientWidth || canvas.width || 960, h: canvas.clientHeight || canvas.height || 540 };
    const ctx = canvas.getContext('2d');
    let acc = 0, last = 0, raf = 0;

    function gun() { return world.guns[world.activeGun]; }
    function rebuildGun(i) {
      const g = world.guns[i];
      const ng = buildGun(g.slots.body, g.slots.ammo, g.slots.mod);
      ng.mag = Math.min(g.mag, ng.stats.magSize);
      world.guns[i] = ng;
    }

    // ===== 敌人 =====
    function spawnEnemy(kind, x, y, scale) {
      const k = ENEMY_KINDS[kind];
      const s = scale || 1;
      const hpScale = 1 + (s - 1) * 0.6;
      return {
        id: world.enemySeq++,
        kind, x, y, vx: 0, vy: 0,
        hp: k.hp * hpScale, maxHp: k.hp * hpScale,
        radius: k.radius * s, color: k.color, coreColor: k.coreColor,
        scale: s, speed: k.speed, dmg: k.dmg,
        behavior: k.behavior,
        state: 'idle', stateT: 0, flash: 0,
        kbvx: 0, kbvy: 0, hitCd: 0, dead: false,
        dashAngle: 0, fireT: k.fireInterval || 0
      };
    }

    function spawnEnemyBullet(x, y, angle, speed, damage, color) {
      world.bullets.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage, pierce: 0, friendly: false,
        life: 6, color: color || '#ff9f43', size: 4, kind: 'enemy'
      });
    }

    function updateEnemies(dt) {
      for (let i = world.enemies.length - 1; i >= 0; i--) {
        const e = world.enemies[i];
        e.flash -= dt;
        e.hitCd -= dt;
        e.x += e.kbvx * dt;
        e.y += e.kbvy * dt;
        const kbDamp = Math.exp(-10 * dt);
        e.kbvx *= kbDamp;
        e.kbvy *= kbDamp;
        updateEnemyAI(e, dt);
        e.x = utils.clamp(e.x, e.radius, world.room.w - e.radius);
        e.y = utils.clamp(e.y, e.radius, world.room.h - e.radius);
      }
    }

    function updateEnemyAI(e, dt) {
      const p = world.player;
      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const ux = dx / dist;
      const uy = dy / dist;
      const k = ENEMY_KINDS[e.kind];

      e.stateT -= dt;
      if (e.behavior === 'chase_telegraph_dash') {
        if (e.state === 'idle') {
          e.x += ux * e.speed * dt;
          e.y += uy * e.speed * dt;
          if (dist < 260) { e.state = 'telegraph'; e.stateT = k.telegraphT; }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) { e.state = 'dash'; e.dashAngle = Math.atan2(dy, dx); e.stateT = 0.35; }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * k.dashSpeed * dt;
          e.y += Math.sin(e.dashAngle) * k.dashSpeed * dt;
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.cooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'keep_distance_shoot') {
        if (dist < 220) {
          e.x -= ux * e.speed * dt;
          e.y -= uy * e.speed * dt;
        } else if (dist > k.range) {
          e.x += ux * e.speed * dt;
          e.y += uy * e.speed * dt;
        } else {
          e.x += (-uy) * e.speed * 0.5 * dt;
          e.y += ux * e.speed * 0.5 * dt;
        }
        e.fireT -= dt;
        if (e.fireT <= 0 && dist < k.range + 30) {
          e.fireT = k.fireInterval;
          spawnEnemyBullet(e.x, e.y, Math.atan2(dy, dx), k.bulletSpeed, e.dmg, e.color);
        }
      }
    }

    // ===== fx（粒子/弹壳/曳光，对象池）=====
    const fx = {
      poolLimit: 1500,
      spawn(o) {
        if (world.particles.length >= fx.poolLimit) world.particles.shift();
        world.particles.push(Object.assign({ maxLife: o.life, rot: 0, vr: 0 }, o));
      },
      muzzle(x, y, angle, color) {
        for (let i = 0; i < 5; i++) {
          const a = angle + (Math.random() - 0.5) * 0.9;
          const sp = 130 + Math.random() * 200;
          fx.spawn({
            kind: 'muzzle', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.05 + Math.random() * 0.045,
            color, size: 3 + Math.random() * 4
          });
        }
      },
      casing(x, y, angle) {
        world.casings.push({
          x, y,
          vx: Math.cos(angle + Math.PI / 2) * 130 + utils.rand(-40, 40),
          vy: Math.sin(angle + Math.PI / 2) * 130 - 90,
          rot: Math.random() * Math.PI * 2,
          vr: utils.rand(-12, 12),
          life: 1.4
        });
      },
      smoke(x, y) {
        fx.spawn({
          kind: 'smoke', x: x + utils.rand(-3, 3), y: y + utils.rand(-3, 3),
          vx: utils.rand(-15, 15), vy: utils.rand(-15, 15),
          life: 0.35 + Math.random() * 0.2,
          color: '#8fa6b8', size: 4
        });
      },
      sparks(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 90 + Math.random() * 190;
          fx.spawn({
            kind: 'spark', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.18 + Math.random() * 0.15,
            color, size: 1.5 + Math.random() * 2
          });
        }
      },
      burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 60 + Math.random() * 220;
          fx.spawn({
            kind: 'burst', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.5 + Math.random() * 0.4,
            color, size: 2.5 + Math.random() * 4,
            rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10
          });
        }
      },
      floater(x, y, text, kind) {
        world.floaters.push({
          x: x + utils.rand(-6, 6), y, text,
          kind: kind || 'normal', life: 0.7, maxLife: 0.7
        });
      },
      shake(power) {
        fx.shakePower = Math.min(12, Math.max(fx.shakePower || 0, power));
      },
      hitStop(ms) {
        fx.hitStopMs = Math.max(fx.hitStopMs || 0, ms);
      },
      slowmo(factor, sec) {
        fx.slowmoFactor = factor;
        fx.slowmoT = sec;
      }
    };
    fx.shakePower = 0;
    fx.hitStopMs = 0;
    fx.slowmoFactor = 1;
    fx.slowmoT = 0;

    // ===== 战斗结算 =====
    function damageEnemy(e, dmg, angle) {
      if (!e || e.dead) return { died: false };
      e.hp -= dmg;
      e.flash = 0.08;
      e.kbvx = Math.cos(angle) * 16;
      e.kbvy = Math.sin(angle) * 16;
      fx.sparks(e.x, e.y, e.color, 5);
      fx.floater(e.x, e.y - e.radius - 8, String(dmg), 'normal');
      audio.play('hit');
      if (e.hp <= 0) { killEnemy(e); return { died: true }; }
      return { died: false };
    }

    function killEnemy(e) {
      if (e.dead) return;
      e.dead = true;
      const idx = world.enemies.indexOf(e);
      if (idx >= 0) utils.swapRemove(world.enemies, idx);
      fx.burst(e.x, e.y, e.color, 8);
      fx.hitStop(60);
      audio.play('kill');
      world.stats.kills++;
      updateCombo();
      maybeDrop(e);
      if (e.scale > 1) fx.slowmo(0.3, 0.25);
    }

    function damagePlayer(dmg, angle) {
      const p = world.player;
      if (p.invuln > 0) return;
      p.hp -= dmg;
      p.invuln = 0.4;
      fx.shake(4);
      fx.sparks(p.x, p.y, '#ff4d5e', 6);
      fx.floater(p.x, p.y - 20, '-' + dmg, 'normal');
      audio.play('hit');
      if (p.hp <= 0) {
        p.hp = 0;
        setScreen('dead');
      }
    }

    function maybeDrop(e) {
      // Task 5 实现掉落
    }

    function updateCombo() {
      const now = world.time;
      if (now - world.stats.comboT < 0.5) world.stats.combo++;
      else world.stats.combo = 1;
      world.stats.comboT = now;
    }

    function setScreen(name) { state.screen = name; }

    // ---------- input ----------
    function onKeyDown(e) {
      if (!e.repeat) { input.keys.add(e.code); input.pressedSet.add(e.code); }
    }
    function onKeyUp(e) { input.keys.delete(e.code); }
    function onMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;
    }
    function onMouseDown(e) { if (e.button === 0) input.mouse.down = true; }
    function onMouseUp(e) { if (e.button === 0) input.mouse.down = false; }
    function onWheel(e) { input.wheelDelta += e.deltaY; e.preventDefault(); }
    function onBlur() { input.keys.clear(); input.pressedSet.clear(); input.mouse.down = false; }
    function onResize() {
      const dpr = Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
      view.w = canvas.clientWidth || window.innerWidth || 960;
      view.h = canvas.clientHeight || window.innerHeight || 540;
      canvas.width = Math.round(view.w * dpr);
      canvas.height = Math.round(view.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ---------- update ----------
    function update(dt) {
      if (state.paused || state.screen === 'dead' || state.screen === 'win') return;
      if (fx.hitStopMs > 0) {
        fx.hitStopMs -= dt * 1000;
        return;
      }
      if (fx.slowmoT > 0) {
        fx.slowmoT -= dt;
        dt *= fx.slowmoFactor;
      }
      const p = world.player;
      const mx = input.mouse.x + camera.x - view.w / 2;
      const my = input.mouse.y + camera.y - view.h / 2;
      p.aimAngle = Math.atan2(my - p.y, mx - p.x);

      let dx = 0, dy = 0;
      if (input.keys.has('KeyW')) dy -= 1;
      if (input.keys.has('KeyS')) dy += 1;
      if (input.keys.has('KeyA')) dx -= 1;
      if (input.keys.has('KeyD')) dx += 1;
      if (dx || dy) {
        const l = Math.hypot(dx, dy);
        p.x += (dx / l) * p.speed * dt;
        p.y += (dy / l) * p.speed * dt;
      }
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);

      updateGun(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateParticles(dt);
      updateCasings(dt);
      updateTracers(dt);
      updateFloaters(dt);

      p.invuln -= dt;
      fx.shakePower *= Math.exp(-6 * dt);

      camera.x += (p.x - camera.x) * Math.min(1, 10 * dt);
      camera.y += (p.y - camera.y) * Math.min(1, 10 * dt);
      world.time += dt;
    }

    function fireOnce(g) {
      const p = world.player;
      const muzzleX = p.x + Math.cos(p.aimAngle) * 22;
      const muzzleY = p.y + Math.sin(p.aimAngle) * 22;
      const baseAngle = p.aimAngle + (Math.random() - 0.5) * 2 * g.stats.spread;
      for (let i = 0; i < g.stats.pellet; i++) {
        const a = baseAngle + (i - (g.stats.pellet - 1) / 2) * 0.04;
        world.bullets.push({
          x: muzzleX, y: muzzleY,
          vx: Math.cos(a) * g.stats.bulletSpeed,
          vy: Math.sin(a) * g.stats.bulletSpeed,
          damage: g.stats.damage,
          pierce: g.stats.pierce,
          friendly: true,
          life: 1.2,
          color: '#ffd166',
          size: 3,
          kind: 'standard'
        });
      }
      fx.muzzle(muzzleX, muzzleY, p.aimAngle, '#ffd166');
      fx.casing(p.x, p.y, p.aimAngle);
      fx.smoke(muzzleX, muzzleY);
      world.tracers.push({
        x0: muzzleX, y0: muzzleY,
        x1: muzzleX + Math.cos(p.aimAngle) * 46,
        y1: muzzleY + Math.sin(p.aimAngle) * 46,
        life: 0.09, color: '#ffd166'
      });
      p.recoil = Math.min(1, p.recoil + 0.35);
      audio.play('pistol');
    }

    function updateGun(dt) {
      const p = world.player;
      if (input.wheelDelta !== 0) {
        world.activeGun = (world.activeGun + (input.wheelDelta > 0 ? 1 : -1) + 2) % 2;
        input.wheelDelta = 0;
      }
      if (input.pressedSet.has('Digit1')) world.activeGun = 0;
      if (input.pressedSet.has('Digit2')) world.activeGun = 1;

      const g = gun();
      g.cooldown -= dt;
      if (g.reloading) {
        g.reloadT -= dt;
        if (g.reloadT <= 0) { g.reloading = false; g.mag = g.stats.magSize; }
      }
      if ((input.pressedSet.has('KeyR') || input.keys.has('KeyR')) && !g.reloading && g.mag < g.stats.magSize) {
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
      }
      if (input.mouse.down && !g.reloading && g.mag > 0 && g.cooldown <= 0) {
        g.cooldown = 1 / g.stats.fireRate;
        g.mag--;
        fireOnce(g);
      }
      p.recoil *= Math.pow(0.0001, dt);
    }

    function updateBullets(dt) {
      const r = world.room;
      const p = world.player;
      for (let i = world.bullets.length - 1; i >= 0; i--) {
        const b = world.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < r.x - 40 || b.x > r.w + 40 || b.y < r.y - 40 || b.y > r.h + 40) {
          utils.swapRemove(world.bullets, i);
          continue;
        }
        if (b.friendly) {
          for (let j = 0; j < world.enemies.length; j++) {
            const e = world.enemies[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.size) {
              damageEnemy(e, b.damage, Math.atan2(b.vy, b.vx));
              if (b.pierce > 0) {
                b.pierce--;
              } else {
                utils.swapRemove(world.bullets, i);
              }
              break;
            }
          }
        } else {
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.size) {
            damagePlayer(b.damage, Math.atan2(b.vy, b.vx));
            utils.swapRemove(world.bullets, i);
          }
        }
      }
    }

    function updateParticles(dt) {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const q = world.particles[i];
        q.life -= dt;
        if (q.life <= 0) { utils.swapRemove(world.particles, i); continue; }
        const damp = Math.exp(-3 * dt);
        q.vx *= damp;
        q.vy *= damp;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        if (q.kind === 'smoke') q.size += 30 * dt;
      }
    }

    function updateCasings(dt) {
      const r = world.room;
      for (let i = world.casings.length - 1; i >= 0; i--) {
        const c = world.casings[i];
        c.life -= dt;
        if (c.life <= 0) { utils.swapRemove(world.casings, i); continue; }
        c.vy += 620 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= Math.exp(-2 * dt);
        if (c.y > r.h - 4) {
          c.y = r.h - 4;
          c.vy *= -0.35;
          c.vx *= 0.7;
        }
        c.rot += c.vr * dt;
      }
    }

    function updateTracers(dt) {
      for (let i = world.tracers.length - 1; i >= 0; i--) {
        world.tracers[i].life -= dt;
        if (world.tracers[i].life <= 0) utils.swapRemove(world.tracers, i);
      }
    }

    function updateFloaters(dt) {
      for (let i = world.floaters.length - 1; i >= 0; i--) {
        const f = world.floaters[i];
        f.life -= dt;
        f.y -= 42 * dt;
        if (f.life <= 0) utils.swapRemove(world.floaters, i);
      }
    }

    // ---------- render ----------
    function render(alpha) {
      ctx.clearRect(0, 0, view.w, view.h);
      ctx.fillStyle = '#0a0e16';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.save();
      const shx = (Math.random() * 2 - 1) * fx.shakePower;
      const shy = (Math.random() * 2 - 1) * fx.shakePower;
      ctx.translate(view.w / 2 - camera.x + shx, view.h / 2 - camera.y + shy);
      drawRoom();
      drawScanline();
      drawBullets();
      drawCasings();
      drawParticles();
      drawTracers();
      drawEnemies();
      drawFloaters();
      drawPlayer();
      ctx.restore();
      drawHUD();
    }

    function drawRoom() {
      const r = world.room;
      ctx.fillStyle = 'rgba(14, 20, 32, 0.92)';
      ctx.fillRect(r.x, r.y, r.w, r.h);

      ctx.strokeStyle = 'rgba(53, 224, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = r.x; gx <= r.w; gx += 80) { ctx.moveTo(gx, r.y); ctx.lineTo(gx, r.h); }
      for (let gy = r.y; gy <= r.h; gy += 80) { ctx.moveTo(r.x, gy); ctx.lineTo(r.w, gy); }
      ctx.stroke();

      ctx.shadowColor = '#35e0ff';
      ctx.shadowBlur = 14;
      ctx.strokeStyle = '#35e0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.shadowBlur = 0;

      // 四角装饰
      ctx.fillStyle = 'rgba(53, 224, 255, 0.55)';
      const c = 14;
      ctx.fillRect(r.x, r.y, c, c); ctx.fillRect(r.w - c, r.y, c, c);
      ctx.fillRect(r.x, r.h - c, c, c); ctx.fillRect(r.w - c, r.h - c, c, c);
    }

    function drawBullets() {
      for (const b of world.bullets) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCasings() {
      for (const c of world.casings) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = utils.clamp(c.life / 0.4, 0, 1);
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(-3, -1.5, 6, 3);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      for (const q of world.particles) {
        const a = utils.clamp(q.life / q.maxLife, 0, 1);
        if (q.kind === 'muzzle') {
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'smoke') {
          ctx.globalAlpha = a * 0.16;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'spark') {
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'burst') {
          ctx.save();
          ctx.translate(q.x, q.y);
          ctx.rotate(q.rot);
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size);
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawEnemies() {
      for (const e of world.enemies) {
        const flash = e.flash > 0;
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = flash ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = flash ? '#ffffff' : e.coreColor;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        if (e.state === 'telegraph') {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(world.time * 30);
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }
    }

    function drawFloaters() {
      ctx.textAlign = 'center';
      for (const f of world.floaters) {
        const a = utils.clamp(f.life / f.maxLife, 0, 1);
        ctx.globalAlpha = a;
        if (f.kind === 'crit') {
          ctx.fillStyle = '#ffd166';
          ctx.font = 'bold 20px Consolas, monospace';
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px Consolas, monospace';
        }
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawTracers() {
      for (const t of world.tracers) {
        const a = utils.clamp(t.life / 0.09, 0, 1);
        ctx.globalAlpha = a;
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(t.x0, t.y0);
        ctx.lineTo(t.x1, t.y1);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x1, t.y1, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawScanline() {
      const r = world.room;
      const y = ((world.time * 140) % (r.h)) + r.y;
      ctx.fillStyle = 'rgba(53, 224, 255, 0.05)';
      ctx.fillRect(r.x, y, r.w, 2);
    }

    function drawPlayer() {
      const p = world.player;
      const g = gun();
      const bodyColor = PARTS.body[g.slots.body] ? PARTS.body[g.slots.body].color : '#35e0ff';
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.aimAngle);
      ctx.translate(-p.recoil * 8, 0);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1d3a52';
      ctx.strokeStyle = '#35e0ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-10, 11);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, -11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = bodyColor;
      ctx.fillRect(10, -2.5, 16, 5);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(12, -1, 12, 2);
      ctx.restore();
    }

    function drawHUD() {
      const g = gun();
      ctx.fillStyle = 'rgba(53, 224, 255, 0.7)';
      ctx.font = '14px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('T ' + world.time.toFixed(1) + 's', 14, 24);
      ctx.textAlign = 'right';
      ctx.fillStyle = g.mag === 0 ? '#ff4d5e' : '#ffd166';
      ctx.fillText(g.mag + ' / ' + g.stats.magSize, view.w - 14, view.h - 18);
      if (g.reloading) {
        ctx.fillStyle = 'rgba(255, 209, 102, 0.7)';
        const w = 120 * (1 - g.reloadT / g.stats.reloadTime);
        ctx.fillRect(view.w - 14 - w, view.h - 12, w, 4);
      }
      ctx.fillStyle = 'rgba(255, 77, 94, 0.7)';
      ctx.fillText('击杀 ' + world.stats.kills, view.w - 14, 24);
    }

    // ---------- main loop ----------
    function frame(now) {
      let dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      input.pressedSet.clear();
      acc += dt;
      while (acc >= STEP) { update(STEP); acc -= STEP; }
      render(acc / STEP);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (typeof window !== 'undefined' && window.addEventListener) {
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('wheel', onWheel, { passive: false });
        window.addEventListener('blur', onBlur);
        window.addEventListener('resize', onResize);
      }
      onResize();
      last = performance.now();
      raf = requestAnimationFrame(frame);
      // 临时刷怪便于手动冒烟（Task 6 由房间生成替换）
      const px = world.player.x, py = world.player.y;
      world.enemies.push(spawnEnemy('chaser', px + 220, py, 1));
      world.enemies.push(spawnEnemy('chaser', px - 220, py, 1));
      world.enemies.push(spawnEnemy('chaser', px, py + 220, 1));
      world.enemies.push(spawnEnemy('shooter', px + 360, py + 130, 1));
      world.enemies.push(spawnEnemy('shooter', px - 360, py - 130, 1));
    }

    return {
      world, state, camera, input, fx,
      gun, rebuildGun,
      spawnEnemy, damageEnemy, damagePlayer, killEnemy, maybeDrop,
      update, render, start, setScreen,
      VERSION
    };
  }

  return { createGame, PARTS, VERSION };
})();

if (typeof window !== 'undefined') window.Game = Game;

if (typeof window !== 'undefined' && window.document && window.document.body) {
  const canvas = window.document.getElementById('game');
  if (canvas) {
    const g = Game.createGame(canvas);
    g.start();
    window.game = g;
  }
}
</script>

'use strict';

// ===== utils =====
const utils = (() => {
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function swapRemove(arr, i) {
    arr[i] = arr[arr.length - 1];
    arr.pop();
  }
  function circleRectHit(px, py, r, rect) {
    const nx = clamp(px, rect.x, rect.x + rect.w);
    const ny = clamp(py, rect.y, rect.y + rect.h);
    const dx = px - nx, dy = py - ny;
    return dx * dx + dy * dy < r * r;
  }
  function resolveCircleRect(px, py, r, rect) {
    const nx = clamp(px, rect.x, rect.x + rect.w);
    const ny = clamp(py, rect.y, rect.y + rect.h);
    const dx = px - nx, dy = py - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return { x: px, y: py };
    if (d2 === 0) {
      const left = px - rect.x, right = rect.x + rect.w - px;
      const top = py - rect.y, bottom = rect.y + rect.h - py;
      const m = Math.min(left, right, top, bottom);
      if (m === left) px = rect.x - r;
      else if (m === right) px = rect.x + rect.w + r;
      else if (m === top) py = rect.y - r;
      else py = rect.y + rect.h + r;
      return { x: px, y: py };
    }
    const d = Math.sqrt(d2);
    return { x: nx + (dx / d) * r, y: ny + (dy / d) * r };
  }
  return { clamp, lerp, rand, randInt, distance, rectsOverlap, mulberry32, swapRemove, circleRectHit, resolveCircleRect };
})();

// ===== world =====
const Game = (() => {
  const VERSION = '0.3.0';
  const STEP = 1 / 120;

  const ROOM_H = 1100;

  // ===== PARTS（部件库）=====
  const PARTS = {

    },

        base: {} },

        base: { critChance: 0.15, critMult: 2 } },

        base: { armor: 80, kbMul: 0.5 } },
      energy_armor: { id: 'energy_armor', slot: 'armor', name: '能量护甲', rarity: 3, color: '#ffb347', desc: '护甲+40，恢复×2',
        base: { armor: 40, regenMul: 2 } },
      regen_armor: { id: 'regen_armor', slot: 'armor', name: '再生护甲', rarity: 4, color: '#ff4d5e', desc: '护甲+60，每秒回1HP',
        base: { armor: 60, hpRegen: 1 } }
    }
  };

  // ===== partsEngine（词条/稀有度/掉落）=====
  const partsEngine = {
    rarityNames: ['普通', '优秀', '稀有', '史诗', '传说'],
    rarityColors: ['#cfd8d8', '#7ef29a', '#4dc9ff', '#b06cff', '#ff8f3d'],
    enhancePrices: [30, 60, 120, 240, 500],
    affixPool: [
      { stat: 'fireRate', label: '射速', pct: 0.08 },
      { stat: 'damage', label: '伤害', pct: 0.12 },
      { stat: 'magSize', label: '弹容', flat: 4 },
      { stat: 'reloadTime', label: '换弹', pct: -0.12 },
      { stat: 'pierce', label: '穿透', flat: 1 },
      { stat: 'critChance', label: '暴击率', flat: 0.06 },
      { stat: 'spread', label: '散布', pct: -0.20 },
      { stat: 'armor', label: '护甲', flat: 10 },
      { stat: 'armorRegen', label: '护甲恢复', flat: 3 },
      { stat: 'hpRegen', label: '生命恢复', flat: 0.6 }
    ],
    rollRarity() {
      const weights = [40, 30, 18, 9, 3];
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return 0;
    },
    rollAffixes(rarity) {
      const n = 1 + Math.floor(rarity / 2);
      const pool = partsEngine.affixPool.slice();
      const out = [];
      for (let i = 0; i < n && pool.length; i++) {
        const src = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        out.push({
          stat: src.stat, label: src.label,
          pct: src.pct, flat: src.flat,
          value: src.pct !== undefined ? src.pct : src.flat,
          enhanced: false, rerolls: 0
        });
      }
      return out;
    },
    rollPart() {
      const slots = ['body', 'ammo', 'mod', 'armor'];
      const slot = slots[Math.floor(Math.random() * slots.length)];
      const keys = Object.keys(PARTS[slot]).filter(id => id !== 'none_mod');
      const def = PARTS[slot][keys[Math.floor(Math.random() * keys.length)]];
      return {
        id: def.id, slot, name: def.name, rarity: def.rarity,
        color: def.color, desc: def.desc || '',
        affixes: partsEngine.rollAffixes(def.rarity)
      };
    },
    affixLabel(aff) {
      const v = aff.value !== undefined ? aff.value : (aff.pct !== undefined ? aff.pct : aff.flat);
      if (aff.pct !== undefined) return aff.label + (v > 0 ? ' +' : ' ') + Math.round(v * 100) + '%';
      return aff.label + (v > 0 ? ' +' : ' ') + v;
    }
  };

  function makePart(id) {
    let slot = null, target = null;
    for (const s of ['body', 'ammo', 'mod', 'armor']) {
      if (PARTS[s][id]) { slot = s; target = PARTS[s][id]; break; }
    }
    if (!target) throw new Error('未知部件: ' + id);
    return {
      id, slot, name: target.name, rarity: target.rarity,
      color: target.color, desc: target.desc || '', affixes: []
    };
  }

  function buildGun(bodyId, ammoId, modId) {
    const gun = {
      parts: { body: makePart(bodyId), ammo: makePart(ammoId), mod: makePart(modId) },
      stats: null,
      mag: 0,
      reloading: false,
      reloadT: 0,
      cooldown: 0
    };
    applyParts(gun);
    gun.mag = gun.stats.magSize;
    return gun;
  }

  function applyParts(gun) {
    const b = PARTS.body[gun.parts.body.id];
    const a = PARTS.ammo[gun.parts.ammo.id];
    const m = PARTS.mod[gun.parts.mod.id];
    const st = {
      fireRate: b.base.fireRate,
      damage: b.base.damage,
      magSize: b.base.magSize,
      reloadTime: b.base.reloadTime,
      spread: b.base.spread,
      pellet: (b.base.pellet || 1) * (a.base.pellet || 1),
      pierce: (b.base.pierce || 0) + (a.base.pierce || 0),
      bulletSpeed: 750 * (a.base.bulletSpeedMul || 1),
      critChance: 0.1,
      critMult: 2,
      splitCount: a.base.splitCount || 0,
      homing: !!a.base.homing,
      explosionRadius: a.base.explosionRadius || 0,
      chain: a.base.chain || 0,
      burnDps: 0, burnT: 0, slowPct: 0, slowT: 0, vamp: 0
    };
    if (m.base.critChance) st.critChance += m.base.critChance;
    if (m.base.critMult) st.critMult = m.base.critMult;
    if (m.base.fireRateMul) st.fireRate *= m.base.fireRateMul;
    if (m.base.vamp) st.vamp = m.base.vamp;
    if (m.base.burnDps) { st.burnDps = m.base.burnDps; st.burnT = m.base.burnT; }
    if (m.base.slowPct) { st.slowPct = m.base.slowPct; st.slowT = m.base.slowT; }
    if (m.base.spreadMul) st.spread *= m.base.spreadMul;
    if (m.base.reloadMul) st.reloadTime *= m.base.reloadMul;

    for (const s of ['body', 'ammo', 'mod']) {
      const part = gun.parts[s];
      for (const aff of part.affixes) {
        const v = aff.value !== undefined ? aff.value : (aff.pct !== undefined ? aff.pct : aff.flat);
        if (aff.pct !== undefined) st[aff.stat] *= (1 + v);
        else st[aff.stat] += v;
      }
    }

    st.fireRate = utils.clamp(st.fireRate, 1, 25);
    st.damage = utils.clamp(st.damage, 1, 120);
    st.magSize = utils.clamp(Math.round(st.magSize), 1, 60);
    st.reloadTime = Math.max(0.2, st.reloadTime);
    st.pierce = Math.min(3, st.pierce);
    st.critChance = Math.min(0.5, st.critChance);
    st.spread = Math.max(0.001, st.spread);
    gun.stats = st;
  }

  // ===== map（房间地图生成）=====
  const mapModule = {
    generate(seed, layer) {
      const rng = utils.mulberry32(seed || 1);
      const lv = layer || 1;
      const W = lv >= 2 ? 4 : 3;
      const H = lv >= 2 ? 4 : 3;
      const fillP = lv >= 2 ? 0.85 : 0.95;
      const minRooms = lv >= 2 ? 12 : 8;
      const cells = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (rng() < fillP) cells.push({ x, y });
        }
      }
      if (!cells.some(c => c.x === 0 && c.y === 0)) cells.push({ x: 0, y: 0 });
      if (cells.length < minRooms) {
        for (let y = 0; y < H && cells.length < minRooms; y++) {
          for (let x = 0; x < W && cells.length < minRooms; x++) {
            if (!cells.some(c => c.x === x && c.y === y)) cells.push({ x, y });
          }
        }
      }
      const key = (x, y) => x + ',' + y;
      const cellSet = new Set(cells.map(c => key(c.x, c.y)));
      const neighborsOf = c => [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .map(([dx, dy]) => ({ x: c.x + dx, y: c.y + dy }))
        .filter(n => cellSet.has(key(n.x, n.y)));
      const addCell = (x, y) => {
        const k = key(x, y);
        if (!cellSet.has(k)) {
          cellSet.add(k);
          cells.push({ x, y });
        }
      };
      const connectedToStart = () => {
        const seen = new Set([key(0, 0)]);
        const q = [{ x: 0, y: 0 }];
        while (q.length) {
          const c = q.shift();
          for (const n of neighborsOf(c)) {
            const nk = key(n.x, n.y);
            if (!seen.has(nk)) { seen.add(nk); q.push(n); }
          }
        }
        return seen;
      };
      // 连通化：把所有房间格连到起点（必要时补中间格）
      let seen = connectedToStart();
      for (let guard = 0; guard < 30 && seen.size < cellSet.size; guard++) {
        let best = null, bestD = 1e9;
        for (const c of cells) {
          if (seen.has(key(c.x, c.y))) continue;
          let dMin = 1e9, near = null;
          for (const sk of seen) {
            const [sx, sy] = sk.split(',').map(Number);
            const d = Math.abs(sx - c.x) + Math.abs(sy - c.y);
            if (d < dMin) { dMin = d; near = { x: sx, y: sy }; }
          }
          if (dMin < bestD) { bestD = dMin; best = { c, near }; }
        }
        if (!best) break;
        let cx = best.c.x, cy = best.c.y;
        while (cx !== best.near.x || cy !== best.near.y) {
          let sx = 0, sy = 0;
          if (cx > best.near.x) sx = -1;
          else if (cx < best.near.x) sx = 1;
          else if (cy > best.near.y) sy = -1;
          else if (cy < best.near.y) sy = 1;
          cx += sx;
          cy += sy;
          addCell(cx, cy);
        }
        seen = connectedToStart();
      }
      const rooms = cells.map(c => {
        const doors = { n: false, e: false, s: false, w: false };
        if (cells.some(o => o.x === c.x && o.y === c.y - 1)) doors.n = true;
        if (cells.some(o => o.x === c.x + 1 && o.y === c.y)) doors.e = true;
        if (cells.some(o => o.x === c.x && o.y === c.y + 1)) doors.s = true;
        if (cells.some(o => o.x === c.x - 1 && o.y === c.y)) doors.w = true;
        return {
          x: c.x, y: c.y, w: ROOM_W, h: ROOM_H,
          type: 'combat', doors,
          spawned: false, cleared: false, depth: 0, forgeTalked: false
        };
      });
      const depthMap = { '0,0': 0 };
      const q = [rooms.find(r => r.x === 0 && r.y === 0)];
      while (q.length) {
        const r = q.shift();
        for (const d of ['n', 'e', 's', 'w']) {
          if (!r.doors[d]) continue;
          const nx = r.x + (d === 'e' ? 1 : d === 'w' ? -1 : 0);
          const ny = r.y + (d === 's' ? 1 : d === 'n' ? -1 : 0);
          const k = nx + ',' + ny;
          if (depthMap[k] === undefined) {
            const nr = rooms.find(ro => ro.x === nx && ro.y === ny);
            if (nr) {
              depthMap[k] = depthMap[r.x + ',' + r.y] + 1;
              q.push(nr);
            }
          }
        }
      }
      for (const r of rooms) r.depth = depthMap[r.x + ',' + r.y] || 0;
      const start = rooms.find(r => r.x === 0 && r.y === 0);
      start.type = 'start';
      start.cleared = true;
      start.spawned = true;
      let boss = rooms[0];
      for (const r of rooms) if (r.depth > boss.depth) boss = r;
      boss.type = 'boss';
      const others = rooms.filter(r => r !== start && r !== boss);
      for (let i = others.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const t = others[i]; others[i] = others[j]; others[j] = t;
      }
      let ti = 0;
      if (others[ti]) { others[ti].type = 'treasure'; ti++; }
      if (others[ti]) { others[ti].type = 'shop'; ti++; }
      if (others[ti]) { others[ti].type = 'coin'; ti++; }
      if (others[ti]) { others[ti].type = 'elite'; ti++; }
      if (others[ti] && rng() < 0.8) { others[ti].type = 'forge'; ti++; }
      return { rooms, start: { x: 0, y: 0 }, boss: { x: boss.x, y: boss.y }, gridW: W, gridH: H };
    }
  };

  const GUN_SOUNDS = { pistol_body: 'pistol', smg_body: 'smg', shotgun_body: 'shotgun', sniper_body: 'sniper', heavy_body: 'heavy' };
  const GUN_RECOIL = { pistol_body: 0.35, smg_body: 0.22, shotgun_body: 0.75, sniper_body: 0.9, heavy_body: 0.85 };
  const PART_DEFAULTS = { body: 'pistol_body', ammo: 'standard_ammo', mod: 'none_mod' };
  const MINIMAP_COLORS = {
    start: '#35e0ff', combat: 'rgba(122, 152, 178, 0.75)',
    treasure: '#b06cff', shop: '#ffd166', coin: '#ffe14d', forge: '#ff6ec7',
    elite: '#ff9f43', boss: '#ff3d81'
  };
  const LAYER_ACCENTS = ['#35e0ff', '#ffb347'];

  // ===== ENEMY_KINDS =====
  const ENEMY_KINDS = {
    chaser: {
      name: '冲锋者', color: '#ff4d5e', coreColor: '#7a0d1e',
      hp: 34, radius: 18, speed: 70, dmg: 18,
      behavior: 'chase_telegraph_dash', dashSpeed: 520, telegraphT: 0.3, cooldown: 1.1,
      engageRange: 340, shardCount: 3, coinTier: 1
    },
    shooter: {
      name: '射手', color: '#ff9f43', coreColor: '#7a3b00',
      hp: 22, radius: 16, speed: 60, dmg: 10,
      behavior: 'keep_distance_shoot', range: 330, fireInterval: 1.4, bulletSpeed: 260,
      burst: 3, burstSpread: 0.09, coinTier: 1
    },
    splitter: {
      name: '分裂虫', color: '#7ef29a', coreColor: '#1d6b33',
      hp: 16, radius: 14, speed: 110, dmg: 8,
      behavior: 'splitter', splitKind: 'splitter_mini', splitCount: 2, maxGen: 1,
      spitRange: 150, spitInterval: 1.6, coinTier: 1
    },
    splitter_mini: {
      name: '小分裂虫', color: '#7ef29a', coreColor: '#1d6b33',
      hp: 8, radius: 8, speed: 130, dmg: 5,
      behavior: 'splitter', splitKind: null, splitCount: 0, maxGen: 1, coinTier: 1
    },
    buzzer: {
      name: '穿梭者', color: '#4dc9ff', coreColor: '#0b3d5e',
      hp: 12, radius: 12, speed: 0, dmg: 10,
      behavior: 'buzzer', dashSpeed: 600, dashT: 0.7, waitT: 0.35,
      dashShots: 2, dashShotSpeed: 360, coinTier: 2
    },
    elite: {
      name: '护卫精英', color: '#b06cff', coreColor: '#3d0f73',
      hp: 90, radius: 30, speed: 55, dmg: 20,
      behavior: 'elite', shield: 40, maxShield: 40, shieldRegen: 30,
      dashCooldown: 2.2, telegraphT: 0.35, coinTier: 3
    },
    boss: {
      name: '机械核心', color: '#ff3d81', coreColor: '#5c0a2e',
      hp: 840, radius: 58, speed: 38, dmg: 24,
      behavior: 'boss', ringSegs: 14, rotSpeed: 0.6,
      burstCd: 1.8, summonCd: 10, coinTier: 5
    }
  };

  // ===== audio（WebAudio 合成）=====
  const audio = (() => {
    let actx = null;
    function ac() {
      if (!actx && typeof AudioContext !== 'undefined') {
        try { actx = new AudioContext(); } catch (e) { actx = null; }
      }
      return actx;
    }
    function tone(f0, f1, dur, type, vol, delay) {
      const a = ac();
      if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(1, f0), t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(t0);
      o.stop(t0 + dur);
    }
    function noise(dur, vol, cutoff) {
      const a = ac();
      if (!a) return;
      const sr = a.sampleRate || 44100;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = a.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource();
      src.buffer = buf;
      const g = a.createGain();
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      let node = src;
      if (cutoff && a.createFilter) {
        const f = a.createFilter();
        f.frequency.setValueAtTime(cutoff, a.currentTime);
        src.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(a.destination);
      src.start();
    }
    function play(name, opt) {
      const a = ac();
      if (!a) return;
      if (a.state === 'suspended') { try { a.resume(); } catch (e) {} }
      switch (name) {
        case 'pistol':
          noise(0.05, 0.45, 3200);
          tone(240 + Math.random() * 20, 70, 0.07, 'square', 0.22);
          break;
        case 'smg':
          noise(0.04, 0.35, 4200);
          tone(340 + Math.random() * 20, 170, 0.05, 'square', 0.16);
          break;
        case 'shotgun':
          noise(0.12, 0.6, 1600);
          tone(150, 50, 0.2, 'triangle', 0.35);
          break;
        case 'sniper':
          noise(0.16, 0.55, 2800);
          tone(520, 60, 0.3, 'sawtooth', 0.3);
          break;
        case 'heavy':
          noise(0.09, 0.5, 2000);
          tone(180, 60, 0.14, 'square', 0.28);
          break;
        case 'hit':
          noise(0.03, 0.3, 4500);
          tone(500 + Math.random() * 100, 300, 0.04, 'square', 0.12);
          break;
        case 'kill':
          tone(200, 60, 0.18, 'triangle', 0.3);
          noise(0.12, 0.25, 900);
          break;
        case 'pickup':
          tone(620, 880, 0.09, 'sine', 0.2);
          tone(930, 1240, 0.09, 'sine', 0.12, 0.05);
          break;
        case 'ui':
          tone(760, 900, 0.05, 'square', 0.12);
          break;
        case 'buy':
          tone(700, 1100, 0.12, 'square', 0.18);
          tone(1100, 1500, 0.1, 'sine', 0.12, 0.06);
          break;
        case 'deny':
          tone(300, 180, 0.12, 'sawtooth', 0.14);
          break;
        case 'chest':
          tone(500, 900, 0.16, 'triangle', 0.22);
          noise(0.12, 0.15, 3000);
          break;
        case 'boom':
          noise(0.25, 0.5, 700);
          tone(120, 40, 0.25, 'triangle', 0.35);
          break;
        case 'zap':
          tone(1800, 300, 0.1, 'sawtooth', 0.12);
          break;
        case 'roar':
          tone(160, 45, 0.6, 'sawtooth', 0.4);
          tone(120, 38, 0.7, 'triangle', 0.3, 0.1);
          noise(0.5, 0.3, 500);
          break;
        case 'door':
          tone(120, 220, 0.18, 'sine', 0.2);
          tone(160, 260, 0.12, 'sine', 0.12, 0.08);
          break;
        case 'combo':
          {
            const c = Math.min(8, opt || 1);
            tone(500 + c * 70, 700 + c * 90, 0.09, 'square', 0.12);
          }
          break;
        case 'lowhp':
          tone(72, 54, 0.15, 'sine', 0.24);
          tone(60, 46, 0.12, 'sine', 0.18, 0.17);
          break;
        case 'reload_done':
          tone(520, 900, 0.05, 'square', 0.14);
          tone(900, 1350, 0.06, 'square', 0.11, 0.05);
          break;
        case 'dash':
          tone(300, 900, 0.16, 'sine', 0.2);
          noise(0.1, 0.18, 3600);
          break;
      }
    }
    return { play };
  })();

  function createGame(canvas) {
    const world = {
      player: {
        x: ROOM_W / 2, y: ROOM_H / 2, vx: 0, vy: 0,
        hp: 100, maxHp: 100, radius: 14, speed: 260,
        aimAngle: 0, invuln: 0, recoil: 0,
        armor: 0, maxArmor: 0,
        armorSpec: { speedMul: 1, dmgMul: 1, kbMul: 1, regenMul: 1, regenFlat: 0, hpRegen: 0 }
      },
      guns: [buildGun('pistol_body', 'standard_ammo', 'none_mod'), buildGun('pistol_body', 'standard_ammo', 'none_mod')],
      activeGun: 0,
      enemies: [],
      bullets: [],
      particles: [],
      pickups: [],
      casings: [],
      floaters: [],
      tracers: [],
      impactMarks: [],
      room: { id: 0, type: 'start', x: 0, y: 0, w: ROOM_W, h: ROOM_H, cleared: false, doors: { n: false, e: false, s: false, w: false } },
      map: null,
      coins: 0,
      time: 0,
      stats: { kills: 0, combo: 0, comboT: -9, score: 0 },
      enemySeq: 0,
      inventory: [],
      chains: [],
      shopOffers: [],
      shopPrices: [],
      shopPos: null,
      chest: null,
      coinPile: null,
      portal: null,
      mapInfo: { roomPos: { x: 0, y: 0 }, totalRooms: 0, clearedRooms: 0 },
      transition: { active: false, t: 0, rx: 0, ry: 0 },
      hpDelay: 100,
      lowhpT: 0,
      armorTick: 0,
      dash: { cd: 0, active: false, t: 0, angle: 0, ghostT: 0 },
      dashGhosts: [],
      layer: 1,
      maxLayers: 2,
      armor: null,
      startNpc: null,
      forgeNpc: null,
      fightNpc: false,
      poisonZones: [],
      banner: { text: '', sub: '', t: 0, dur: 0 }
    };
    const state = { screen: 'start', paused: false };
    const ui = { panel: 'none', title: '', items: [], loadout: [], loadoutChips: [], scroll: 0, maxScroll: 0, chat: null, forgeState: { mode: null, part: null } };
    const camera = { x: world.player.x, y: world.player.y };
    const input = {
      keys: new Set(), pressedSet: new Set(),
      mouse: { x: 0, y: 0, down: false, downPrev: false }, mouseHard: false,
      wheelDelta: 0, frameHandled: false,
      tapQueue: new Set(), dashTap: false,
      gp: null, gpPrev: null,
      touch: { moveId: null, moveOrigin: { x: 0, y: 0 }, moveVec: { x: 0, y: 0 }, aimId: null, aimPos: { x: 0, y: 0 }, firing: false }
    };
    const view = { w: canvas.clientWidth || canvas.width || 960, h: canvas.clientHeight || canvas.height || 540 };
    const ctx = canvas.getContext('2d');
    let acc = 0, last = 0, raf = 0;
    let touchMode = false;
    let isTouchUI = false;

    function gun() { return world.guns[world.activeGun]; }
    function accent() {
      return LAYER_ACCENTS[Math.min(world.layer, LAYER_ACCENTS.length) - 1] || '#35e0ff';
    }
    function rebuildGun(i) {
      const g = world.guns[i];
      applyParts(g);
      g.mag = Math.min(g.mag, g.stats.magSize);
    }

    function pushPart(part) {
      if (world.inventory.length >= 10) world.inventory.shift();
      world.inventory.push(part);
    }

    function applyArmor(refill) {
      const part = world.armor;
      const p = world.player;
      const base = part ? PARTS.armor[part.id].base : null;
      const spec = { speedMul: 1, dmgMul: 1, kbMul: 1, regenMul: 1, regenFlat: 0, hpRegen: 0 };
      let maxArmor = 0;
      if (base) {
        maxArmor = base.armor;
        if (base.speedMul) spec.speedMul = base.speedMul;
        if (base.dmgMul) spec.dmgMul = base.dmgMul;
        if (base.kbMul) spec.kbMul = base.kbMul;
        if (base.regenMul) spec.regenMul = base.regenMul;
        if (base.hpRegen) spec.hpRegen = base.hpRegen;
        for (const aff of part.affixes) {
          const v = aff.value !== undefined ? aff.value : aff.flat;
          if (aff.stat === 'armor') maxArmor += v;
          else if (aff.stat === 'armorRegen') spec.regenFlat += v;
          else if (aff.stat === 'hpRegen') spec.hpRegen += v;
        }
      }
      p.maxArmor = Math.max(0, maxArmor);
      if (refill) p.armor = p.maxArmor;
      else p.armor = Math.min(p.armor, p.maxArmor);
      p.armorSpec = spec;
    }

    function equipPart(part) {
      if (part.slot === 'armor') {
        const old = world.armor;
        world.armor = part;
        applyArmor(true);
        const idx = world.inventory.indexOf(part);
        if (idx >= 0) utils.swapRemove(world.inventory, idx);
        if (old && old !== part) pushPart(old);
        audio.play('ui');
        return old;
      }
      const g = gun();
      const old = g.parts[part.slot];
      g.parts[part.slot] = part;
      rebuildGun(world.activeGun);
      const idx = world.inventory.indexOf(part);
      if (idx >= 0) utils.swapRemove(world.inventory, idx);
      if (old && old !== part && old.id !== 'none_mod') pushPart(old);
      audio.play('ui');
      return old;
    }

    function unequipPart(slot) {
      if (slot === 'armor') {
        const old = world.armor;
        if (!old) return;
        world.armor = null;
        applyArmor();
        pushPart(old);
        audio.play('ui');
        return;
      }
      const g = gun();
      const old = g.parts[slot];
      const defId = PART_DEFAULTS[slot];
      if (old.id === defId) return;
      g.parts[slot] = makePart(defId);
      rebuildGun(world.activeGun);
      pushPart(old);
      audio.play('ui');
    }

    function spawnPickup(kind, x, y, payload) {
      const a = Math.random() * Math.PI * 2;
      const sp = 180 + Math.random() * 140;
      const k = {
        kind, x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 30,
        part: kind === 'part' ? payload : null,
        value: kind === 'coin' ? payload : 0
      };
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        const res = utils.resolveCircleRect(k.x, k.y, 6, o);
        k.x = res.x;
        k.y = res.y;
      }
      world.pickups.push(k);
    }

    // ===== 敌人 =====
    function spawnEnemy(kind, x, y, scale) {
      const k = ENEMY_KINDS[kind];
      const s = scale || 1;
      const hpScale = 1 + (s - 1) * 0.6;
      const e = {
        id: world.enemySeq++,
        kind, x, y, vx: 0, vy: 0,
        hp: k.hp * hpScale, maxHp: k.hp * hpScale,
        radius: k.radius * s, color: k.color, coreColor: k.coreColor,
        scale: s, speed: k.speed, dmg: k.dmg,
        behavior: k.behavior,
        state: 'idle', stateT: 0, flash: 0,
        kbvx: 0, kbvy: 0, hitCd: 0, dead: false,
        dashAngle: 0, fireT: k.fireInterval || 0, attackT: 0, facing: 0,
        shield: k.shield || 0, maxShield: k.maxShield || (k.shield || 0),
        shieldRegen: k.shieldRegen || 0, shieldDelay: 0,
        extra: { gen: 0, target: null, waitT: 0, dashT: 0, dashDirX: 0, dashDirY: 0, flank: Math.random() < 0.5 ? -1 : 1 },
        phase: 1, rotation: 0, rotSpeed: k.rotSpeed || 0,
        ringSegs: k.ringSegs || 0,
        burstCd: k.burstCd || 0, summonCd: k.summonCd || 0, dashCd: 0
      };
      if (e.kind === 'elite') e.attackT = 1.2;
      return e;
    }

    function spawnEnemyBullet(x, y, angle, speed, damage, color, kind, life) {
      world.bullets.push({
        x, y, px: x, py: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage, pierce: 0, friendly: false,
        life: life || 6, color: color || '#ff9f43', size: 4, kind: kind || 'enemy'
      });
    }

    function updateEnemies(dt) {
      for (let i = world.enemies.length - 1; i >= 0; i--) {
        const e = world.enemies[i];
        e.flash -= dt;
        e.hitCd -= dt;
        if (e.specialNpc && e.renderScale !== undefined && e.renderScale < 1) {
          e.renderScale = Math.min(1, e.renderScale + dt * 1.5);
        }
        if (e.shieldRegen && e.shield < e.maxShield) {
          e.shieldDelay -= dt;
          if (e.shieldDelay <= 0) e.shield = Math.min(e.maxShield, e.shield + e.shieldRegen * dt);
        }
        if (e.burnT > 0) {
          e.burnT -= dt;
          e.hp -= (e.burnDps || 0) * dt;
          if (Math.random() < dt * 8) {
            fx.spawn({
              kind: 'spark', x: e.x + utils.rand(-e.radius * 0.5, e.radius * 0.5),
              y: e.y + utils.rand(-e.radius * 0.5, e.radius * 0.5),
              vx: utils.rand(-30, 30), vy: utils.rand(-50, -10),
              life: 0.25, color: '#ff9f43', size: 2
            });
          }
          if (e.hp <= 0) { killEnemy(e); continue; }
        }
        if (e.slowT > 0) e.slowT -= dt;
        e.x += e.kbvx * dt;
        e.y += e.kbvy * dt;
        const kbDamp = Math.exp(-10 * dt);
        e.kbvx *= kbDamp;
        e.kbvy *= kbDamp;
        updateEnemyAI(e, dt);
        e.x = utils.clamp(e.x, e.radius, world.room.w - e.radius);
        e.y = utils.clamp(e.y, e.radius, world.room.h - e.radius);
        const resE = resolveObstaclesFor(e.x, e.y, e.radius);
        e.x = resE.x;
        e.y = resE.y;
      }
    }

    function bounceDash(e) {
      e.dashAngle = (e.dashAngle + Math.PI) % (Math.PI * 2);
      e.stateT = 0.12;
      fx.sparks(e.x, e.y, e.color, 4);
    }

    function separateEnemies() {
      const es = world.enemies;
      for (let i = 0; i < es.length; i++) {
        for (let j = i + 1; j < es.length; j++) {
          const a = es[i], b = es[j];
          if (a.dead || b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const minD = a.radius + b.radius;
          const d = Math.hypot(dx, dy) || 0.001;
          if (d < minD) {
            const push = (minD - d) * 0.5;
            const wx = dx / d, wy = dy / d;
            const wa = a.kind === 'boss' ? 0.2 : a.kind === 'elite' ? 0.5 : 1;
            const wb = b.kind === 'boss' ? 0.2 : b.kind === 'elite' ? 0.5 : 1;
            a.x -= wx * push * wb;
            a.y -= wy * push * wb;
            b.x += wx * push * wa;
            b.y += wy * push * wa;
          }
        }
      }
    }

    function updateEnemyAI(e, dt) {
      if (world.room && world.room.alertT > 0) return; // 警觉期敌人不行动
      const p = world.player;
      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const ux = dx / dist;
      const uy = dy / dist;
      const k = ENEMY_KINDS[e.kind];

      e.stateT -= dt;
      e.facing = Math.atan2(dy, dx); // 默认面向玩家
      if (e.behavior === 'chase_telegraph_dash') {
        const spd = e.speed * (e.slowT > 0 ? (1 - (e.slowPct || 0)) : 1);
        if (e.state === 'idle') {
          const flank = e.extra.flank || 1;
          const lat = Math.sin(world.time * 2.2 + e.id * 1.7) * 0.55;
          let mx2 = ux + (-uy) * lat * flank;
          let my2 = uy + ux * lat * flank;
          if (dist < 90) { mx2 = -ux; my2 = -uy; } // 太近先拉开
          const ml = Math.hypot(mx2, my2) || 1;
          e.x += (mx2 / ml) * spd * dt;
          e.y += (my2 / ml) * spd * dt;
          if (dist < (k.engageRange || 260)) { e.state = 'telegraph'; e.stateT = k.telegraphT; }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            e.state = 'dash';
            e.dashAngle = Math.atan2(dy, dx);
            e.stateT = 0.35;
            const shards = k.shardCount || 0;
            for (let s2 = 0; s2 < shards; s2++) {
              spawnEnemyBullet(
                e.x, e.y,
                Math.atan2(dy, dx) + (s2 - (shards - 1) / 2) * 0.16,
                300, e.dmg * 0.5, e.color
              );
            }
          }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * k.dashSpeed * dt;
          e.y += Math.sin(e.dashAngle) * k.dashSpeed * dt;
          e.facing = e.dashAngle;
          if (dist < e.radius + p.radius + 4) {
            damagePlayer(e.dmg, e.dashAngle);
            bounceDash(e);
          } else {
            for (const other of world.enemies) {
              if (other === e || other.dead) continue;
              if (Math.hypot(other.x - e.x, other.y - e.y) < e.radius + other.radius) {
                bounceDash(e);
                const a2 = Math.atan2(other.y - e.y, other.x - e.x);
                other.x += Math.cos(a2) * 12;
                other.y += Math.sin(a2) * 12;
                break;
              }
            }
          }
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.cooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'keep_distance_shoot') {
        const spd = e.speed * (e.slowT > 0 ? (1 - (e.slowPct || 0)) : 1);
        if (dist < 220) {
          e.x -= ux * spd * dt;
          e.y -= uy * spd * dt;
        } else if (dist > k.range) {
          e.x += ux * spd * dt;
          e.y += uy * spd * dt;
        } else {
          e.x += (-uy) * spd * 0.5 * dt;
          e.y += ux * spd * 0.5 * dt;
        }
        e.fireT -= dt;
        if (e.fireT <= 0 && dist < k.range + 30) {
          e.fireT = k.fireInterval;
          const burst = k.burst || 1;
          const baseA = Math.atan2(dy, dx);
          for (let b2 = 0; b2 < burst; b2++) {
            spawnEnemyBullet(
              e.x, e.y,
              baseA + (b2 - (burst - 1) / 2) * (k.burstSpread || 0.06),
              k.bulletSpeed, e.dmg, e.color
            );
          }
        }
      } else if (e.behavior === 'splitter') {
        const flank = e.extra.flank || 1;
        const lat = Math.sin(world.time * 2.2 + e.id * 1.7) * 0.5;
        let mx2 = ux + (-uy) * lat * flank;
        let my2 = uy + ux * lat * flank;
        if (dist < 80) { mx2 = -ux; my2 = -uy; }
        const ml = Math.hypot(mx2, my2) || 1;
        e.x += (mx2 / ml) * e.speed * dt;
        e.y += (my2 / ml) * e.speed * dt;
        e.attackT -= dt;
        if (e.attackT <= 0 && dist < (k.spitRange || 150)) {
          e.attackT = k.spitInterval || 1.6;
          const baseA = Math.atan2(dy, dx);
          spawnEnemyBullet(e.x, e.y, baseA - 0.25, 190, e.dmg * 0.7, e.color);
          spawnEnemyBullet(e.x, e.y, baseA + 0.25, 190, e.dmg * 0.7, e.color);
        }
        if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, Math.atan2(dy, dx));
      } else if (e.behavior === 'buzzer') {
        const ex = e.extra;
        if (e.state === 'idle' || e.state === 'wait') {
          if (e.state === 'idle') { e.state = 'wait'; e.stateT = 0.4; }
          if (e.stateT <= 0) {
            ex.target = { x: utils.rand(120, world.room.w - 120), y: utils.rand(120, world.room.h - 120) };
            e.state = 'telegraph';
            e.stateT = 0.3;
          }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            const tx = ex.target.x - e.x, ty = ex.target.y - e.y;
            const l = Math.hypot(tx, ty) || 1;
            ex.dashDirX = tx / l;
            ex.dashDirY = ty / l;
            e.state = 'dash';
            e.stateT = k.dashT;
            const shots = k.dashShots || 0;
            const baseA = Math.atan2(dy, dx);
            for (let s2 = 0; s2 < shots; s2++) {
              spawnEnemyBullet(
                e.x, e.y,
                baseA + (s2 - (shots - 1) / 2) * 0.15,
                k.dashShotSpeed || 360, e.dmg * 0.5, e.color
              );
            }
          }
        } else if (e.state === 'dash') {
          e.x += ex.dashDirX * k.dashSpeed * dt;
          e.y += ex.dashDirY * k.dashSpeed * dt;
          e.facing = Math.atan2(ex.dashDirY, ex.dashDirX);
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, Math.atan2(dy, dx));
          if (Math.random() < dt * 30) {
            fx.spawn({
              kind: 'spark', x: e.x, y: e.y,
              vx: utils.rand(-20, 20), vy: utils.rand(-20, 20),
              life: 0.3, color: e.color, size: 2
            });
          }
          if (e.stateT <= 0) { e.state = 'wait'; e.stateT = k.waitT; }
        }
      } else if (e.behavior === 'elite') {
        if (e.state === 'idle') {
          if (dist > 240) {
            e.x += ux * e.speed * dt;
            e.y += uy * e.speed * dt;
          } else if (dist < 150) {
            e.x -= ux * e.speed * dt;
            e.y -= uy * e.speed * dt;
          } else {
            if (e.attackT <= 0) {
              e.state = 'telegraph';
              e.stateT = k.telegraphT;
            } else {
              e.attackT -= dt;
              const lat = Math.sin(world.time * 1.8 + e.id) * 0.6;
              e.x += (-uy) * e.speed * lat * dt;
              e.y += ux * e.speed * lat * dt;
            }
          }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            e.dashAngle = Math.atan2(dy, dx);
            e.state = 'dash';
            e.stateT = 0.25;
            for (let a2 = 0; a2 < Math.PI * 2; a2 += Math.PI / 3) {
              spawnEnemyBullet(e.x, e.y, a2, 240, e.dmg * 0.6, e.color);
            }
            audio.play('zap');
          }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * 420 * dt;
          e.y += Math.sin(e.dashAngle) * 420 * dt;
          e.facing = e.dashAngle;
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.dashCooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'boss') {
        if (e.poison) {
          updatePoisonBoss(e, dt);
        } else {
        const def = ENEMY_KINDS[e.kind];
        e.rotation += def.rotSpeed * dt * (e.phase >= 3 ? 2 : 1);
        const pct = e.hp / e.maxHp;
        if (pct <= 0.3 && e.phase < 3) {
          e.phase = 3;
          fx.burst(e.x, e.y, '#ff4d5e', 20);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        } else if (pct <= 0.6 && e.phase < 2) {
          e.phase = 2;
          fx.burst(e.x, e.y, '#ffd166', 16);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        }
        e.x += ux * e.speed * dt;
        e.y += uy * e.speed * dt;
        e.burstCd -= dt;
        const interval = e.phase >= 3 ? 0.7 : e.phase === 2 ? 0.9 : 1.8;
        if (e.burstCd <= 0) {
          e.burstCd = interval;
          const count = e.phase >= 3 ? 24 : 12;
          const off = (e.phase >= 2 ? 15 : 0) * Math.PI / 180;
          for (let a2 = off; a2 < Math.PI * 2 + off; a2 += Math.PI * 2 / count) {
            spawnEnemyBullet(e.x, e.y, a2, 260, e.dmg, '#ff3d81');
          }
          if (e.phase === 1 && Math.random() < 0.3) {
            for (let f = -1; f <= 1; f++) {
              spawnEnemyBullet(e.x, e.y, Math.atan2(dy, dx) + f * 0.22, 300, e.dmg, '#ff3d81');
            }
          }
          audio.play('zap');
        }
        if (e.phase >= 2) {
          e.summonCd -= dt;
          const buzzers = world.enemies.filter(x => x.kind === 'buzzer').length;
          if (e.summonCd <= 0 && buzzers < 4) {
            e.summonCd = 10;
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
          }
        }
        if (e.phase >= 3) {
          e.dashCd -= dt;
          if (e.state === 'idle' && e.dashCd <= 0) {
            e.state = 'telegraph';
            e.stateT = 0.5;
          } else if (e.state === 'telegraph') {
            if (e.stateT <= 0) {
              e.dashAngle = Math.atan2(dy, dx);
              e.state = 'dash';
              e.stateT = 0.4;
            }
          } else if (e.state === 'dash') {
            e.x += Math.cos(e.dashAngle) * 520 * dt;
            e.y += Math.sin(e.dashAngle) * 520 * dt;
            if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
            if (e.stateT <= 0) {
              e.state = 'recover';
              e.stateT = 1.0;
              e.dashCd = 2.5;
            }
          } else if (e.state === 'recover') {
            if (e.stateT <= 0) e.state = 'idle';
          }
        }
        }
      }
    }

    function updatePoisonBoss(e, dt) {
      const p = world.player;
      const dx = p.x - e.x, dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const ux = dx / dist, uy = dy / dist;
      e.rotation += 0.8 * dt * (e.phase >= 3 ? 2 : 1);
      const pct = e.hp / e.maxHp;
      if (pct <= 0.3 && e.phase < 3) {
        e.phase = 3;
        fx.burst(e.x, e.y, '#7ef29a', 20);
        fx.shake(6);
        audio.play('roar');
        fx.slowmo(0.4, 0.3);
      } else if (pct <= 0.6 && e.phase < 2) {
        e.phase = 2;
        fx.burst(e.x, e.y, '#7ef29a', 16);
        fx.shake(6);
        audio.play('roar');
        fx.slowmo(0.4, 0.3);
      }
      e.x += ux * e.speed * dt;
      e.y += uy * e.speed * dt;
      e.burstCd -= dt;
      const interval = e.phase >= 3 ? 0.8 : e.phase === 2 ? 1.0 : 1.4;
      if (e.burstCd <= 0) {
        e.burstCd = interval;
        const count = e.phase >= 3 ? 18 : e.phase === 2 ? 12 : 8;
        for (let a2 = 0; a2 < Math.PI * 2; a2 += Math.PI * 2 / count) {
          spawnEnemyBullet(e.x, e.y, a2, 175, e.dmg * 0.7, '#7ef29a', 'poison', 2.6);
        }
        if (e.phase >= 2 && Math.random() < 0.6) {
          for (let i = 0; i < 4; i++) {
            spawnPoisonZone(
              utils.clamp(e.x + utils.rand(-280, 280), 60, ROOM_W - 60),
              utils.clamp(e.y + utils.rand(-280, 280), 60, ROOM_H - 60),
              62
            );
          }
        }
        audio.play('zap');
      }
      if (e.phase >= 2) {
        e.summonCd -= dt;
        const buzzers = world.enemies.filter(x => x.kind === 'buzzer').length;
        if (e.summonCd <= 0 && buzzers < 3) {
          e.summonCd = 8;
          world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
          world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
        }
      }
      if (e.phase >= 3) {
        e.attackT -= dt;
        if (e.attackT <= 0) {
          e.attackT = 1.6;
          const base = Math.atan2(dy, dx);
          for (let f = -2; f <= 2; f++) {
            spawnEnemyBullet(e.x, e.y, base + f * 0.16, 260, e.dmg, '#7ef29a', 'poison', 2.2);
          }
          audio.play('zap');
        }
      }
      if (dist < 130) applyRawDamage(5 * dt); // 毒光环
    }

    // ===== fx（粒子/弹壳/曳光，对象池）=====
    const fx = {
      poolLimit: 1500,
      spawn(o) {
        if (world.particles.length >= fx.poolLimit) world.particles.shift();
        world.particles.push(Object.assign({ maxLife: o.life, rot: 0, vr: 0 }, o));
      },
      muzzle(x, y, angle, color) {
        for (let i = 0; i < 5; i++) {
          const a = angle + (Math.random() - 0.5) * 0.9;
          const sp = 130 + Math.random() * 200;
          fx.spawn({
            kind: 'muzzle', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.05 + Math.random() * 0.045,
            color, size: 3 + Math.random() * 4
          });
        }
      },
      casing(x, y, angle) {
        world.casings.push({
          x, y,
          vx: Math.cos(angle + Math.PI / 2) * 130 + utils.rand(-40, 40),
          vy: Math.sin(angle + Math.PI / 2) * 130 - 90,
          rot: Math.random() * Math.PI * 2,
          vr: utils.rand(-12, 12),
          life: 1.4
        });
      },
      smoke(x, y) {
        fx.spawn({
          kind: 'smoke', x: x + utils.rand(-3, 3), y: y + utils.rand(-3, 3),
          vx: utils.rand(-15, 15), vy: utils.rand(-15, 15),
          life: 0.35 + Math.random() * 0.2,
          color: '#8fa6b8', size: 4
        });
      },
      sparks(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 90 + Math.random() * 190;
          fx.spawn({
            kind: 'spark', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.18 + Math.random() * 0.15,
            color, size: 1.5 + Math.random() * 2
          });
        }
      },
      burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 60 + Math.random() * 220;
          fx.spawn({
            kind: 'burst', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.5 + Math.random() * 0.4,
            color, size: 2.5 + Math.random() * 4,
            rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10
          });
        }
      },
      floater(x, y, text, kind) {
        world.floaters.push({
          x: x + utils.rand(-6, 6), y, text,
          kind: kind || 'normal', life: 0.7, maxLife: 0.7
        });
      },
      shake(power) {
        fx.shakePower = Math.min(12, Math.max(fx.shakePower || 0, power));
      },
      hitStop(ms) {
        fx.hitStopMs = Math.max(fx.hitStopMs || 0, ms);
      },
      slowmo(factor, sec) {
        fx.slowmoFactor = factor;
        fx.slowmoT = sec;
      }
    };
    fx.shakePower = 0;
    fx.hitStopMs = 0;
    fx.slowmoFactor = 1;
    fx.slowmoT = 0;

    // ===== 战斗结算 =====
    function damageEnemy(e, dmg, angle, opts) {
      if (!e || e.dead) return { died: false, crit: false };
      const o = opts || {};
      if (e.shield > 0) {
        e.shield -= dmg;
        e.shieldDelay = 3;
        e.flash = 0.08;
        fx.sparks(e.x, e.y, '#b06cff', 4);
        fx.floater(e.x, e.y - e.radius - 8, '盾', 'normal');
        audio.play('hit');
        if (e.shield <= 0) {
          e.shield = 0;
          fx.burst(e.x, e.y, '#b06cff', 10);
          audio.play('kill');
          e.state = 'recover';
          e.stateT = 0.8;
        }
        return { died: false, crit: false };
      }
      const crit = !!o.critChance && Math.random() < o.critChance;
      const final = crit ? dmg * (o.critMult || 2) : dmg;
      e.hp -= final;
      e.flash = 0.08;
      if (e.kind !== 'boss') {
        const kb = (18 + Math.min(20, dmg * 0.25)) * (e.kind === 'elite' ? 0.3 : 1);
        e.kbvx = Math.cos(angle) * kb;
        e.kbvy = Math.sin(angle) * kb;
      }
      fx.sparks(e.x, e.y, e.color, 5);
      fx.floater(e.x, e.y - e.radius - 8, String(Math.round(final)), crit ? 'crit' : 'normal');
      if (o.burnDps) { e.burnDps = o.burnDps; e.burnT = o.burnT; }
      if (o.slowPct) { e.slowPct = o.slowPct; e.slowT = o.slowT; }
      audio.play('hit');
      if (e.hp <= 0) {
        if (o.vamp) world.player.hp = Math.min(world.player.maxHp, world.player.hp + o.vamp);
        killEnemy(e);
        return { died: true, crit };
      }
      return { died: false, crit };
    }

    function killEnemy(e) {
      if (e.dead) return;
      e.dead = true;
      if (e.kind === 'boss') {
        fx.slowmo(0.3, 0.5);
        fx.hitStop(120);
        audio.play('roar');
        if (e.specialNpc) {
          setScreen('win');
        } else if (world.layer >= world.maxLayers) {
          for (let i = 0; i < 4; i++) {
            spawnPickup('part', e.x + utils.rand(-70, 70), e.y + utils.rand(-70, 70), partsEngine.rollPart());
          }
          spawnPickup('medkit', e.x, e.y + 60, 0);
          spawnPickup('medkit', e.x, e.y - 60, 0);
          setScreen('win');
        } else {
          for (const rem of [...world.enemies]) {
            if (rem !== e && !rem.dead) {
              rem.dead = true;
              fx.burst(rem.x, rem.y, rem.color, 6);
            }
          }
          world.enemies.length = 0;
          world.portal = {
            x: ROOM_W / 2, y: ROOM_H / 2, t: 0, active: false,
            roomX: world.mapInfo.roomPos.x, roomY: world.mapInfo.roomPos.y
          };
          audio.play('door');
        }
      }
      const idx = world.enemies.indexOf(e);
      if (idx >= 0) utils.swapRemove(world.enemies, idx);
      const def = ENEMY_KINDS[e.kind];
      if (e.behavior === 'splitter' && def.splitKind && (e.extra.gen || 0) < (def.maxGen || 1)) {
        for (let s = 0; s < (def.splitCount || 2); s++) {
          const mini = spawnEnemy(def.splitKind, e.x + utils.rand(-12, 12), e.y + utils.rand(-12, 12), 1);
          mini.extra.gen = (e.extra.gen || 0) + 1;
          mini.hp = mini.maxHp;
          world.enemies.push(mini);
        }
      }
      fx.burst(e.x, e.y, e.color, 8);
      fx.hitStop(60);
      audio.play('kill');
      world.stats.kills++;
      updateCombo();
      maybeDrop(e);
      world.dash.cd = 0;
      if (e.scale > 1) fx.slowmo(0.3, 0.25);
    }

    function damagePlayer(dmg, angle) {
      const p = world.player;
      if (p.invuln > 0) return;
      let d = dmg;
      if (p.armor > 0) {
        const absorbed = Math.min(p.armor, d);
        p.armor -= absorbed;
        d -= absorbed;
        fx.sparks(p.x, p.y, '#35e0ff', 3);
        if (absorbed > 0) fx.floater(p.x, p.y - 30, '-' + Math.round(absorbed), 'normal');
      }
      d *= (p.armorSpec ? p.armorSpec.dmgMul : 1);
      p.hp -= d;
      p.invuln = 0.4;
      const kbMul = (p.armorSpec ? p.armorSpec.kbMul : 1);
      p.vx += Math.cos(angle) * 300 * kbMul;
      p.vy += Math.sin(angle) * 300 * kbMul;
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > 800) {
        p.vx = (p.vx / spd) * 800;
        p.vy = (p.vy / spd) * 800;
      }
      fx.shake(4);
      fx.sparks(p.x, p.y, '#ff4d5e', 6);
      fx.floater(p.x, p.y - 20, '-' + dmg, 'normal');
      audio.play('hit');
      if (p.hp <= 0) {
        p.hp = 0;
        if (world.fightNpc) restart();
        else setScreen('dead');
      }
    }

    function applyRawDamage(dmg) {
      const p = world.player;
      let d = dmg;
      if (p.armor > 0) {
        const absorbed = Math.min(p.armor, d);
        p.armor -= absorbed;
        d -= absorbed;
      }
      d *= (p.armorSpec ? p.armorSpec.dmgMul : 1);
      p.hp -= d;
      if (p.hp <= 0) {
        p.hp = 0;
        if (world.fightNpc) restart();
        else setScreen('dead');
      }
    }

    function spawnPoisonZone(x, y, r) {
      world.poisonZones.push({ x, y, r, life: 4.5, maxLife: 4.5, dps: 7 });
    }

    function updatePoisonZones(dt) {
      const p = world.player;
      for (let i = world.poisonZones.length - 1; i >= 0; i--) {
        const z = world.poisonZones[i];
        z.life -= dt;
        if (z.life <= 0) { utils.swapRemove(world.poisonZones, i); continue; }
        if (Math.hypot(p.x - z.x, p.y - z.y) < z.r) {
          applyRawDamage(z.dps * dt);
          if (Math.random() < dt * 8) {
            fx.spawn({
              kind: 'spark', x: p.x + utils.rand(-12, 12), y: p.y + utils.rand(-12, 12),
              vx: utils.rand(-15, 15), vy: utils.rand(-25, -5),
              life: 0.4, color: '#7ef29a', size: 2.5
            });
          }
        }
      }
    }

    function maybeDrop(e) {
      if (e.scale > 1.5) {
        spawnPickup('part', e.x, e.y, partsEngine.rollPart());
        return;
      }
      const r = Math.random();
      if (r < 0.021) spawnPickup('part', e.x, e.y, partsEngine.rollPart());
      else if (r < 0.041) {
        const weights = [10, 15, 20, 25, 30]; // 品质越高掉落概率越高
        const total = weights.reduce((a, b) => a + b, 0);
        let rr = Math.random() * total;
        let rarity = 0;
        for (let i = 0; i < weights.length; i++) {
          rr -= weights[i];
          if (rr <= 0) { rarity = i; break; }
        }
        const keys = Object.keys(PARTS.armor);
        const def = PARTS.armor[keys[Math.floor(Math.random() * keys.length)]];
        spawnPickup('part', e.x, e.y, {
          id: def.id, slot: 'armor', name: def.name, rarity,
          color: def.color, desc: def.desc || '',
          affixes: partsEngine.rollAffixes(rarity)
        });
      }
      else if (r < 0.09 && world.player.hp < world.player.maxHp * 0.5) spawnPickup('medkit', e.x, e.y, 0);
      else if (r < 0.336) {
        const def = ENEMY_KINDS[e.kind] || {};
        const tier = (def.coinTier || 1) + Math.max(0, Math.round(e.scale) - 1);
        spawnPickup('coin', e.x, e.y, utils.randInt(1, Math.max(1, tier)));
      }
    }

    function updateCombo() {
      const now = world.time;
      if (now - world.stats.comboT < 0.5) world.stats.combo++;
      else world.stats.combo = 1;
      world.stats.comboT = now;
      if (world.stats.combo >= 3) audio.play('combo', world.stats.combo);
    }

      state.screen = name;
      state.paused = name === 'paused';

    function beginRun() {
      resetState();
      startMap(Math.floor(Math.random() * 100000) + 1);
      setScreen('playing');
    }

    function restart() {
      resetState();
      setScreen('start');
    }

    // ---------- input ----------
    function onKeyDown(e) {
      const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyR', 'KeyE', 'KeyB', 'Digit1', 'Digit2', 'Escape', 'Enter', 'Tab'];
      if (GAME_KEYS.includes(e.code)) e.preventDefault();
      if (!e.repeat) { input.keys.add(e.code); input.pressedSet.add(e.code); }
    }
    function onKeyUp(e) { input.keys.delete(e.code); }
    function onMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;
    }
    function onMouseDown(e) {
      if (e.button === 2) {
        if (ui.chat) {
          if (ui.chat.battle) declineBattle();
          else closeChat();
        }
        return;
      }
      if (e.button !== 0) return;
      if (canvas.focus) canvas.focus();
      const rect = canvas.getBoundingClientRect();
      handleClick(e.clientX - rect.left, e.clientY - rect.top);
    }

    function handleClick(mx, my) {
      if (ui.chat && ui.chat.buttons) {
        for (const b of ui.chat.buttons) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (b.action === 'acceptBattle') acceptBattle();
            else declineBattle();
            return true;
          }
        }
        if (ui.chat.battle) return true; // 战斗询问期间点击别处不触发开火
      }
      if (ui.panel !== 'none') {
        uiClick(mx, my);
        return true;
      }
      if (state.screen !== 'playing') {
        for (const b of overlayButtons()) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            b.action();
            return true;
          }
        }
        return false;
      }
      if (isTouchUI) {
        const btn = hitTouchButton(mx, my);
        if (btn) {
          if (btn.id === 'dash') input.dashTap = true;
          else if (btn.id === 'reload') input.tapQueue.add('reload');
          else if (btn.id === 'interact') input.tapQueue.add('interact');
          else if (btn.id === 'switch') input.tapQueue.add('switchR');
          else if (btn.id === 'panel') input.tapQueue.add('panel');
          else if (btn.id === 'pause') input.tapQueue.add('pause');
          return true;
        }
      }
      input.mouseHard = true;
      return true;
    }
    function onMouseUp(e) { if (e.button === 0) input.mouseHard = false; }
    function onWheel(e) {
      if (ui.panel === 'parts') {
        ui.scroll = utils.clamp((ui.scroll || 0) + (e.deltaY > 0 ? 30 : -30), 0, ui.maxScroll || 0);
        e.preventDefault();
        return;
      }
      input.wheelDelta += e.deltaY;
      e.preventDefault();
    }
    function onBlur() {
      input.keys.clear();
      input.pressedSet.clear();
      input.mouseHard = false;
      input.touch.firing = false;
      input.touch.moveId = null;
      input.touch.aimId = null;
    }
    function onResize() {
      const dpr = Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
      view.w = canvas.clientWidth || window.innerWidth || 960;
      view.h = canvas.clientHeight || window.innerHeight || 540;
      isTouchUI = touchMode || view.w < 780;
      canvas.width = Math.round(view.w * dpr);
      canvas.height = Math.round(view.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function touchButtons() {
      if (isTouchUI) {
        return [
          { id: 'dash', x: 84, y: view.h - 150, r: 34, label: '闪' },
          { id: 'interact', x: view.w - 60, y: view.h - 104, r: 30, label: 'E' },
          { id: 'reload', x: view.w - 60, y: view.h - 176, r: 30, label: 'R' },
          { id: 'switch', x: view.w - 60, y: view.h - 248, r: 30, label: '换' },
          { id: 'panel', x: view.w - 60, y: view.h - 320, r: 30, label: '包' },
          { id: 'pause', x: 40, y: 42, r: 22, label: 'II' }
        ];
      }
      return [
        { id: 'dash', x: 96, y: view.h - 150, r: 36, label: '闪' },
        { id: 'reload', x: view.w - 64, y: view.h - 64, r: 30, label: 'R' },
        { id: 'interact', x: view.w - 132, y: view.h - 118, r: 30, label: 'E' },
        { id: 'switch', x: view.w - 64, y: view.h - 140, r: 30, label: '换' },
        { id: 'panel', x: view.w - 132, y: view.h - 188, r: 30, label: '包' },
        { id: 'pause', x: view.w - 34, y: 42, r: 22, label: 'II' }
      ];
    }

    function hitTouchButton(x, y) {
      for (const b of touchButtons()) {
        if (Math.hypot(x - b.x, y - b.y) <= b.r) return b;
      }
      return null;
    }

    function onTouchStart(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        handleTouchPoint(x, y, t.identifier);
      }
    }

    function handleTouchPoint(x, y, id) {
      if (ui.chat) {
        if (ui.chat.buttons) handleClick(x, y);
        else closeChat(); // 普通聊天：点击任意处关闭（替代右键）
        return;
      }
      if (ui.panel !== 'none') {
        uiClick(x, y);
        return;
      }
      if (state.screen !== 'playing') {
        const acted = handleClick(x, y);
        if (!acted && state.screen === 'start') beginRun(); // 手机端点击任意处开始
        return;
      }
      const btn = hitTouchButton(x, y);
      if (btn) {
        if (btn.id === 'dash') input.dashTap = true;
        else if (btn.id === 'reload') input.tapQueue.add('reload');
        else if (btn.id === 'interact') input.tapQueue.add('interact');
        else if (btn.id === 'switch') input.tapQueue.add('switchR');
        else if (btn.id === 'panel') input.tapQueue.add('panel');
        else if (btn.id === 'pause') input.tapQueue.add('pause');
        return;
      }
      if (x < view.w * 0.5 && input.touch.moveId === null) {
        input.touch.moveId = id;
        input.touch.moveOrigin = { x, y };
        input.touch.moveVec = { x: 0, y: 0 };
      } else if (x >= view.w * 0.5 && input.touch.aimId === null) {
        input.touch.aimId = id;
        input.touch.aimPos = { x, y };
        input.touch.firing = true;
      }
    }

    function onTouchMove(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        updateTouchMove(t.identifier, t.clientX - rect.left, t.clientY - rect.top);
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        releaseTouch(t.identifier);
      }
    }

    function updateTouchMove(id, x, y) {
      if (id === input.touch.moveId) {
        let vx = x - input.touch.moveOrigin.x;
        let vy = y - input.touch.moveOrigin.y;
        const len = Math.hypot(vx, vy);
        const maxR = 60;
        if (len > maxR) { vx = (vx / len) * maxR; vy = (vy / len) * maxR; }
        input.touch.moveVec = { x: vx, y: vy };
      } else if (id === input.touch.aimId) {
        input.touch.aimPos = { x, y };
      }
    }

    function releaseTouch(id) {
      if (id === input.touch.moveId) {
        input.touch.moveId = null;
        input.touch.moveVec = { x: 0, y: 0 };
      } else if (id === input.touch.aimId) {
        input.touch.aimId = null;
        input.touch.firing = false;
      }
    }

    function onPointerDown(e) {
      if (e.pointerType === 'mouse') return; // 鼠标仍走原路径
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      handleTouchPoint(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
    }

    function onPointerMove(e) {
      if (e.pointerType === 'mouse') return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      updateTouchMove(e.pointerId, e.clientX - rect.left, e.clientY - rect.top);
    }

    function onPointerUp(e) {
      if (e.pointerType === 'mouse') return;
      e.preventDefault();
      releaseTouch(e.pointerId);
    }

    function pollGamepad() {
      if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
      const pads = navigator.getGamepads();
      const gp = pads && pads[0];
      const prev = input.gpPrev;
      if (!gp) { input.gp = null; input.gpPrev = null; return; }
      const dead = 0.25;
      const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const cur = {
        lx: Math.abs(gp.axes[0]) > dead ? gp.axes[0] : 0,
        ly: Math.abs(gp.axes[1]) > dead ? gp.axes[1] : 0,
        ax: Math.abs(gp.axes[2]) > dead ? gp.axes[2] : 0,
        ay: Math.abs(gp.axes[3]) > dead ? gp.axes[3] : 0,
        fire: btn(7), dash: btn(3), interact: btn(0), reload: btn(2),
        panel: btn(1), pause: btn(9), switchR: btn(5), switchL: btn(4)
      };
      input.gp = cur;
      if (prev) {
        if (cur.dash && !prev.dash) input.dashTap = true;
        if (cur.interact && !prev.interact) input.tapQueue.add('interact');
        if (cur.reload && !prev.reload) input.tapQueue.add('reload');
        if (cur.panel && !prev.panel) input.tapQueue.add('panel');
        if (cur.pause && !prev.pause) input.tapQueue.add('pause');
        if (cur.switchR && !prev.switchR) input.tapQueue.add('switchR');
        if (cur.switchL && !prev.switchL) input.tapQueue.add('switchL');
      }
      input.gpPrev = cur;
    }

    // ---------- update ----------
    function update(dt) {
      input.frameHandled = false;
      if (input.tapQueue.size) {
        if (input.tapQueue.has('interact')) input.pressedSet.add('KeyE');
        if (input.tapQueue.has('panel')) input.pressedSet.add('KeyB');
        if (input.tapQueue.has('pause')) input.pressedSet.add('Escape');
        if (input.tapQueue.has('switchR') || input.tapQueue.has('switchL')) {
          world.activeGun = (world.activeGun + (input.tapQueue.has('switchR') ? 1 : -1) + 2) % 2;
        }
        if (input.tapQueue.has('reload')) {
          const g = gun();
          if (!g.reloading && g.mag < g.stats.magSize) {
            g.reloading = true;
            g.reloadT = g.stats.reloadTime;
          }
        }
        input.tapQueue.clear();
      }
      if (input.pressedSet.size) {
        if (input.pressedSet.has('Escape')) {
          if (ui.panel !== 'none') {
            closePanel();
          } else if (state.screen === 'playing') {
            setScreen('paused');
          } else if (state.screen === 'paused') {
            setScreen('playing');
          }
        }
        if (input.pressedSet.has('Enter') &&
            (state.screen === 'start' || state.screen === 'dead' || state.screen === 'win')) {
          beginRun();
        }
        if (input.pressedSet.has('KeyB')) {
          if (ui.panel !== 'none') closePanel();
          else openPanel('parts');
        }
        if (input.pressedSet.has('KeyE')) {
          if (ui.panel !== 'none') {
            closePanel();
          } else {
            const p = world.player;
            if (world.startNpc &&
                utils.distance(p.x, p.y, world.startNpc.x, world.startNpc.y) < 100) {
              ui.chat = {
                name: '作者 awa_cw', color: '#ff4d5e',
                lines: ['感谢你游玩枪械工艺，我是作者awa_cw'],
                showOptions: false
              };
              state.paused = true;
              audio.play('ui');
            } else if (world.forgeNpc &&
                utils.distance(p.x, p.y, world.forgeNpc.x, world.forgeNpc.y) < 110) {
              if (world.room.forgeTalked) {
                openPanel('forgeMenu');
              } else {
                world.room.forgeTalked = true;
                ui.chat = {
                  name: '锻造师', color: '#b06cff',
                  lines: ['你好，我是这里唯一的锻造师，我可以为你物品进行"属性强化"、"属性重组"'],
                  showOptions: true
                };
                state.paused = true;
                audio.play('ui');
              }
            } else if (world.chest && !world.chest.opened &&
                utils.distance(p.x, p.y, world.chest.x, world.chest.y) < 100) {
              world.chestPart = partsEngine.rollPart();
              openPanel('chest');
            } else if (world.coinPile && !world.coinPile.collected &&
                utils.distance(p.x, p.y, world.coinPile.x, world.coinPile.y) < 90) {
              world.coins += world.coinPile.amount;
              world.coinPile.collected = true;
              fx.floater(p.x, p.y - 30, '+' + world.coinPile.amount + ' 金币', 'crit');
              audio.play('chest');
            } else if (portalVisible() && world.portal.active &&
                utils.distance(p.x, p.y, world.portal.x, world.portal.y) < 90) {
              world.portal = null;
              world.transition = { active: true, t: 0, rx: 'next', ry: 0 };
              audio.play('door');
            } else if (world.shopPos && world.shopOffers.length &&
                utils.distance(p.x, p.y, world.shopPos.x, world.shopPos.y) < 120) {
              openPanel('shop');
            }
          }
        }
        if (input.pressedSet.has('Digit1')) world.activeGun = 0;
        if (input.pressedSet.has('Digit2')) world.activeGun = 1;
        input.pressedSet.clear();
      }
      if (world.startNpc && world.startNpc.state === 'transform') {
        const n = world.startNpc;
        n.transformT += dt;
        n.scale = 1 + 2 * Math.min(1, n.transformT / 1.2);
        if (n.transformT >= 1.2) spawnAuthorBoss();
      }
      if (world.transition.active) {
        world.transition.t += dt;
        if (world.transition.t >= 0.6) {
          world.transition.active = false;
          if (world.transition.rx === 'next') advanceLayer();
          else enterRoom(world.transition.rx, world.transition.ry, world.transition.dir);
        }
        return;
      }
      if (state.paused || state.screen === 'dead' || state.screen === 'win') return;
      if (fx.hitStopMs > 0) {
        fx.hitStopMs -= dt * 1000;
        return;
      }
      if (fx.slowmoT > 0) {
        fx.slowmoT -= dt;
        dt *= fx.slowmoFactor;
      } else if (input.keys.has('Space') && state.screen === 'playing' && !world.dash.active) {
        dt *= 0.35; // 按住空格进入慢动作瞄准
      }
      const p = world.player;
      const gp = input.gp;
      input.mouse.down = !!(input.mouseHard || input.touch.firing || (gp && gp.fire));
      if (input.touch.aimId !== null) {
        input.mouse.x = input.touch.aimPos.x;
        input.mouse.y = input.touch.aimPos.y;
      }
      const stickAim = gp && (Math.abs(gp.ax) > 0.2 || Math.abs(gp.ay) > 0.2);
      if (stickAim) {
        p.aimAngle = Math.atan2(gp.ay, gp.ax);
      } else {
        const mx = input.mouse.x + camera.x - view.w / 2;
        const my = input.mouse.y + camera.y - view.h / 2;
        p.aimAngle = Math.atan2(my - p.y, mx - p.x);
      }

      let dx = 0, dy = 0;
      if (input.keys.has('KeyW')) dy -= 1;
      if (input.keys.has('KeyS')) dy += 1;
      if (input.keys.has('KeyA')) dx -= 1;
      if (input.keys.has('KeyD')) dx += 1;
      if (gp) { dx += gp.lx; dy += gp.ly; }
      if (input.touch.moveId !== null) {
        dx += input.touch.moveVec.x / 60;
        dy += input.touch.moveVec.y / 60;
      }
      let moveX = 0, moveY = 0;
      if (dx || dy) {
        const l = Math.hypot(dx, dy);
        moveX = dx / l;
        moveY = dy / l;
      }
      // 惯性滑动：加速到上限，松键后自然衰减
      const ACCEL = 1500;
      p.vx += moveX * ACCEL * dt;
      p.vy += moveY * ACCEL * dt;
      const maxSpd = p.speed * ((p.armorSpec && p.armorSpec.speedMul) || 1);
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > maxSpd) {
        p.vx = (p.vx / spd) * maxSpd;
        p.vy = (p.vy / spd) * maxSpd;
      }
      const damp = Math.exp(-5.5 * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);

      // 瞬身：空格+左键向准星方向短距离滑步
      const dash = world.dash;
      dash.cd = Math.max(0, dash.cd - dt);
      if (dash.active) {
        dash.t -= dt;
        p.x += Math.cos(dash.angle) * 1400 * dt;
        p.y += Math.sin(dash.angle) * 1400 * dt;
        for (let s = 0; s < 2; s++) {
          fx.spawn({
            kind: 'dash', x: p.x + utils.rand(-5, 5), y: p.y + utils.rand(-5, 5),
            vx: -Math.cos(dash.angle) * 240, vy: -Math.sin(dash.angle) * 240,
            life: 0.28, color: '#35e0ff', size: 7 + Math.random() * 6, angle: dash.angle
          });
        }
        dash.ghostT += dt;
        if (dash.ghostT > 0.02) {
          dash.ghostT = 0;
          world.dashGhosts.push({
            x: p.x, y: p.y, angle: p.aimAngle,
            life: 0.3, maxLife: 0.3, color: '#35e0ff'
          });
          if (world.dashGhosts.length > 12) world.dashGhosts.shift();
        }
        if (dash.t <= 0) dash.active = false;
      }
      if (((input.mouse.down && !input.mouse.downPrev && input.keys.has('Space')) || input.dashTap) &&
          dash.cd <= 0 && !dash.active && state.screen === 'playing') {
        const mxw = input.mouse.x + camera.x - view.w / 2;
        const myw = input.mouse.y + camera.y - view.h / 2;
        dash.angle = Math.atan2(myw - p.y, mxw - p.x);
        dash.active = true;
        dash.t = 0.13;
        dash.cd = 3;
        p.invuln = 0.25;
        audio.play('dash');
      }
      input.dashTap = false;
      input.mouse.downPrev = input.mouse.down;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);
      const resP = resolveObstaclesFor(p.x, p.y, p.radius);
      p.x = resP.x;
      p.y = resP.y;

      updateGun(dt);
      updateBullets(dt);
      updateEnemies(dt);
      separateEnemies();
      checkRoomProgress();
      checkDoors(dt);
      const curRoom = world.room;
      if (curRoom.waveState === 'countdown') {
        curRoom.waveT -= dt;
        if (curRoom.waveT <= 0) {
          curRoom.waveState = 'active';
          spawnWaveEnemies(curRoom, curRoom.waveCounts[curRoom.waveIndex], curRoom.waveSpawns);
          curRoom.waveSpawns = [];
          curRoom.waveIndex++;
          setBanner('第 ' + curRoom.waveIndex + ' 波 / 共 ' + curRoom.waveTotal + ' 波', 1.4);
        }
      }
      if (curRoom.alertT > 0) curRoom.alertT -= dt;
      if (curRoom.obstacleReveal !== undefined && curRoom.obstacleReveal < 999) curRoom.obstacleReveal += dt;
      world.banner.t += dt;
      updatePoisonZones(dt);
      updateParticles(dt);
      updateCasings(dt);
      updateTracers(dt);
      updateFloaters(dt);
      updatePickups(dt);
      updateChains(dt);
      updateDashGhosts(dt);
      updateImpactMarks(dt);
      if (world.portal && !world.portal.active) {
        world.portal.t += dt;
        if (world.portal.t >= 1.2) world.portal.active = true;
      }

      p.invuln -= dt;
      fx.shakePower *= Math.exp(-6 * dt);
      if (p.hp < world.hpDelay) world.hpDelay = Math.max(p.hp, world.hpDelay - 26 * dt);
      else world.hpDelay = p.hp;
      if (p.maxArmor > 0) {
        const as = p.armorSpec || {};
        if (as.hpRegen) p.hp = Math.min(p.maxHp, p.hp + as.hpRegen * dt);
        world.armorTick += dt;
        if (world.armorTick >= 2.4999) { // 回复频率降低150%（间隔×2.5）
          world.armorTick -= 2.5;
          const amount = (6 * (as.regenMul || 1) + (as.regenFlat || 0)) * 2.5 * 0.6; // 每次回复值 -40%
          p.armor = Math.min(p.maxArmor, p.armor + amount);
        }
      }
      if (state.screen === 'playing' && p.hp > 0 && p.hp < p.maxHp * 0.3) {
        world.lowhpT -= dt;
        if (world.lowhpT <= 0) {
          world.lowhpT = 0.85;
          audio.play('lowhp');
        }
      }

      // 视角随准星走：目标点偏向鼠标方向 32%，并限制在房间可视范围内
      const mxw = input.mouse.x + camera.x - view.w / 2;
      const myw = input.mouse.y + camera.y - view.h / 2;
      const r = world.room;
      const halfW = view.w / 2, halfH = view.h / 2;
      const minX = r.w <= view.w ? r.w / 2 : halfW;
      const maxX = r.w <= view.w ? r.w / 2 : r.w - halfW;
      const minY = r.h <= view.h ? r.h / 2 : halfH;
      const maxY = r.h <= view.h ? r.h / 2 : r.h - halfH;
      const tx = utils.clamp(p.x + (mxw - p.x) * 0.32, minX, maxX);
      const ty = utils.clamp(p.y + (myw - p.y) * 0.32, minY, maxY);
      camera.x += (tx - camera.x) * Math.min(1, 8 * dt);
      camera.y += (ty - camera.y) * Math.min(1, 8 * dt);
      world.time += dt;
    }

    function fireOnce(g) {
      const p = world.player;
      const st = g.stats;
      const muzzleX = p.x + Math.cos(p.aimAngle) * 22;
      const muzzleY = p.y + Math.sin(p.aimAngle) * 22;
      const baseAngle = p.aimAngle + (Math.random() - 0.5) * 2 * st.spread;
      for (let i = 0; i < st.pellet; i++) {
        const a = baseAngle + (i - (st.pellet - 1) / 2) * 0.04;
        world.bullets.push({
          x: muzzleX, y: muzzleY,
          px: muzzleX, py: muzzleY,
          vx: Math.cos(a) * st.bulletSpeed,
          vy: Math.sin(a) * st.bulletSpeed,
          speed: st.bulletSpeed,
          damage: st.damage,
          pierce: st.pierce,
          friendly: true,
          life: 1.2 * ((PARTS.body[g.parts.body.id].base.lifeMul) || 1),
          color: '#ffd166',
          size: 3,
          kind: 'standard',
          split: st.splitCount,
          boomR: st.explosionRadius,
          homing: st.homing,
          chain: st.chain,
          fx: {
            critChance: st.critChance, critMult: st.critMult,
            burnDps: st.burnDps, burnT: st.burnT,
            slowPct: st.slowPct, slowT: st.slowT,
            vamp: st.vamp
          }
        });
      }
      fx.muzzle(muzzleX, muzzleY, p.aimAngle, '#ffd166');
      fx.casing(p.x, p.y, p.aimAngle);
      fx.smoke(muzzleX, muzzleY);
      world.tracers.push({
        x0: muzzleX, y0: muzzleY,
        x1: muzzleX + Math.cos(p.aimAngle) * 46,
        y1: muzzleY + Math.sin(p.aimAngle) * 46,
        life: 0.09, color: '#ffd166'
      });
      p.recoil = Math.min(1, p.recoil + (GUN_RECOIL[g.parts.body.id] || 0.35));
      audio.play(GUN_SOUNDS[g.parts.body.id] || 'pistol');
    }

    function updateGun(dt) {
      const p = world.player;
      if (input.wheelDelta !== 0) {
        world.activeGun = (world.activeGun + (input.wheelDelta > 0 ? 1 : -1) + 2) % 2;
        input.wheelDelta = 0;
      }

      const g = gun();
      g.cooldown -= dt;
      if (g.reloading) {
        g.reloadT -= dt;
        if (g.reloadT <= 0) {
          g.reloading = false;
          g.mag = g.stats.magSize;
          audio.play('reload_done');
        }
      }
      if ((input.pressedSet.has('KeyR') || input.keys.has('KeyR')) && !g.reloading && g.mag < g.stats.magSize) {
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
      }
      if (g.mag <= 0 && !g.reloading) { // 自动换弹
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
      }
      if (input.mouse.down && !world.dash.active && !g.reloading && g.mag > 0 && g.cooldown <= 0) {
        g.cooldown = 1 / g.stats.fireRate;
        g.mag--;
        fireOnce(g);
      }
      p.recoil *= Math.pow(0.0001, dt);
    }

    function updateBullets(dt) {
      const r = world.room;
      const p = world.player;
      for (let i = world.bullets.length - 1; i >= 0; i--) {
        const b = world.bullets[i];
        if (b.friendly && b.homing) {
          let nearest = null, nd = 1e9;
          for (const e of world.enemies) {
            if (e.dead) continue;
            const d = Math.hypot(e.x - b.x, e.y - b.y);
            if (d < nd) { nd = d; nearest = e; }
          }
          if (nearest) {
            const cur = Math.atan2(b.vy, b.vx);
            const want = Math.atan2(nearest.y - b.y, nearest.x - b.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const turn = utils.clamp(diff, -4 * dt, 4 * dt);
            const sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(cur + turn) * sp;
            b.vy = Math.sin(cur + turn) * sp;
          }
        }
        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < r.x - 40 || b.x > r.w + 40 || b.y < r.y - 40 || b.y > r.h + 40) {
          if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
          utils.swapRemove(world.bullets, i);
          continue;
        }
        const obs = world.room.obstacles || [];
        let hitObs = false;
        for (const o of obs) {
          if (utils.circleRectHit(b.x, b.y, b.size, o)) {
            fx.sparks(b.x, b.y, '#8fa6b8', 4);
            world.impactMarks.push({ x: b.x, y: b.y, life: 2.5, color: b.color });
            hitObs = true;
            break;
          }
        }
        if (hitObs) {
          if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
          utils.swapRemove(world.bullets, i);
          continue;
        }
        if (b.friendly) {
          const sn = world.startNpc;
          if (sn && sn.state === 'idle' && Math.hypot(sn.x - b.x, sn.y - b.y) < 18 + b.size) {
            promptNpcBattle();
            utils.swapRemove(world.bullets, i);
            continue;
          }
          for (let j = 0; j < world.enemies.length; j++) {
            const e = world.enemies[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.size) {
              const hitAngle = Math.atan2(b.vy, b.vx);
              damageEnemy(e, b.damage, hitAngle, b.fx);
              if (b.boomR > 0) {
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  if (Math.hypot(e2.x - b.x, e2.y - b.y) <= b.boomR + e2.radius) {
                    damageEnemy(e2, b.damage * 0.8, Math.atan2(e2.y - b.y, e2.x - b.x), b.fx);
                  }
                }
                fx.burst(b.x, b.y, '#ff8f3d', 14);
                fx.shake(5);
                audio.play('boom');
              }
              if (b.chain > 0) {
                let best = null, bd = 90;
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  const d = Math.hypot(e2.x - b.x, e2.y - b.y);
                  if (d < bd) { bd = d; best = e2; }
                }
                if (best) {
                  damageEnemy(best, b.damage * 0.5, Math.atan2(best.y - b.y, best.x - b.x), b.fx);
                  world.chains.push({ x1: b.x, y1: b.y, x2: best.x, y2: best.y, life: 0.12 });
                  audio.play('zap');
                }
              }
              if (b.split > 0) {
                for (let s = 0; s < b.split; s++) {
                  const a = hitAngle + (s - (b.split - 1) / 2) * 0.3;
                  world.bullets.push({
                    x: b.x, y: b.y,
                    px: b.x, py: b.y,
                    vx: Math.cos(a) * b.speed * 0.9,
                    vy: Math.sin(a) * b.speed * 0.9,
                    speed: b.speed * 0.9,
                    damage: b.damage * 0.4,
                    pierce: 0,
                    friendly: true,
                    life: 0.55,
                    color: b.color,
                    size: 2.2,
                    kind: 'fragment',
                    split: 0, boomR: 0, homing: false, chain: 0,
                    fx: b.fx
                  });
                }
              }
              if (b.pierce > 0) {
                b.pierce--;
              } else {
                utils.swapRemove(world.bullets, i);
              }
              break;
            }
          }
        } else {
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.size) {
            damagePlayer(b.damage, Math.atan2(b.vy, b.vx));
            if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
            utils.swapRemove(world.bullets, i);
          }
        }
      }
    }

    function updateParticles(dt) {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const q = world.particles[i];

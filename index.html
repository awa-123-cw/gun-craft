// ===== utils =====
const utils = (() => {
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function swapRemove(arr, i) {
    arr[i] = arr[arr.length - 1];
    arr.pop();
  }
  function circleRectHit(px, py, r, rect) {
    // 支持旋转障碍物：把点转到障碍物局部坐标系后再做 AABB 检测
    const rot = rect.rot || 0;
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    let lx = px - cx, ly = py - cy;
    if (rot) {
      const c = Math.cos(-rot), s = Math.sin(-rot);
      const rx = lx * c - ly * s;
      const ry = lx * s + ly * c;
      lx = rx; ly = ry;
    }
    const hw = rect.w / 2, hh = rect.h / 2;
    const nx = clamp(lx, -hw, hw);
    const ny = clamp(ly, -hh, hh);
    const dx = lx - nx, dy = ly - ny;
    return dx * dx + dy * dy < r * r;
  }
  function resolveCircleRect(px, py, r, rect) {
    // 支持旋转障碍物：在局部坐标解算后转回世界坐标
    const rot = rect.rot || 0;
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    let lx = px - cx, ly = py - cy;
    if (rot) {
      const c = Math.cos(-rot), s = Math.sin(-rot);
      const rx = lx * c - ly * s;
      const ry = lx * s + ly * c;
      lx = rx; ly = ry;
    }
    const hw = rect.w / 2, hh = rect.h / 2;
    const nx = clamp(lx, -hw, hw);
    const ny = clamp(ly, -hh, hh);
    const dx = lx - nx, dy = ly - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return { x: px, y: py };
    let ex, ey;
    if (d2 === 0) {
      const left = lx + hw, right = hw - lx, top = ly + hh, bottom = hh - ly;
      const m = Math.min(left, right, top, bottom);
      if (m === left) { ex = -hw - r; ey = ly; }
      else if (m === right) { ex = hw + r; ey = ly; }
      else if (m === top) { ex = lx; ey = -hh - r; }
      else { ex = lx; ey = hh + r; }
    } else {
      const d = Math.sqrt(d2);
      ex = nx + (dx / d) * r;
      ey = ny + (dy / d) * r;
    }
    if (rot) {
      const c = Math.cos(rot), s = Math.sin(rot);
      const wx = ex * c - ey * s;
      const wy = ex * s + ey * c;
      ex = wx; ey = wy;
    }
    return { x: cx + ex, y: cy + ey };
  }
  return { clamp, lerp, rand, randInt, distance, rectsOverlap, mulberry32, swapRemove, circleRectHit, resolveCircleRect };
})();

    rollRarity() {
      const weights = [40, 30, 18, 9, 3];
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return 0;
    },
    rollAffixes(rarity) {
      const n = 1 + Math.floor(rarity / 2);
      const pool = partsEngine.affixPool.slice();
      const out = [];
      for (let i = 0; i < n && pool.length; i++) {
        const src = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        out.push({
          stat: src.stat, label: src.label,
          pct: src.pct, flat: src.flat,
          value: src.pct !== undefined ? src.pct : src.flat,
          enhanced: false, rerolls: 0

      return out;

  const mapModule = {
    generate(seed, layer) {
      const rng = utils.mulberry32(seed || 1);
      const lv = layer || 1;
      const W = lv >= 2 ? 4 : 3;
      const H = lv >= 2 ? 4 : 3;
      const fillP = lv >= 2 ? 0.85 : 0.95;
      const minRooms = lv >= 2 ? 12 : 8;
      const cells = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (rng() < fillP) cells.push({ x, y });
        }
      }
      if (!cells.some(c => c.x === 0 && c.y === 0)) cells.push({ x: 0, y: 0 });
      if (cells.length < minRooms) {
        for (let y = 0; y < H && cells.length < minRooms; y++) {

            if (!cells.some(c => c.x === x && c.y === y)) cells.push({ x, y });
          }

      const cellSet = new Set(cells.map(c => key(c.x, c.y)));

        .map(([dx, dy]) => ({ x: c.x + dx, y: c.y + dy }))
        .filter(n => cellSet.has(key(n.x, n.y)));
      const addCell = (x, y) => {
        const k = key(x, y);
        if (!cellSet.has(k)) {
          cellSet.add(k);
          cells.push({ x, y });
        }
      };
      const connectedToStart = () => {
        const seen = new Set([key(0, 0)]);
        const q = [{ x: 0, y: 0 }];
        while (q.length) {
          const c = q.shift();
          for (const n of neighborsOf(c)) {
            const nk = key(n.x, n.y);
            if (!seen.has(nk)) { seen.add(nk); q.push(n); }
          }

        return seen;

      let seen = connectedToStart();
      for (let guard = 0; guard < 30 && seen.size < cellSet.size; guard++) {
        let best = null, bestD = 1e9;
        for (const c of cells) {
          if (seen.has(key(c.x, c.y))) continue;
          let dMin = 1e9, near = null;
          for (const sk of seen) {
            const [sx, sy] = sk.split(',').map(Number);
            const d = Math.abs(sx - c.x) + Math.abs(sy - c.y);
            if (d < dMin) { dMin = d; near = { x: sx, y: sy }; }
          }
          if (dMin < bestD) { bestD = dMin; best = { c, near }; }
        }
        if (!best) break;
        let cx = best.c.x, cy = best.c.y;
        while (cx !== best.near.x || cy !== best.near.y) {
          let sx = 0, sy = 0;
          if (cx > best.near.x) sx = -1;
          else if (cx < best.near.x) sx = 1;
          else if (cy > best.near.y) sy = -1;
          else if (cy < best.near.y) sy = 1;
          cx += sx;
          cy += sy;
          addCell(cx, cy);
        }
        seen = connectedToStart();
      }

        const doors = { n: false, e: false, s: false, w: false };
        if (cells.some(o => o.x === c.x && o.y === c.y - 1)) doors.n = true;
        if (cells.some(o => o.x === c.x + 1 && o.y === c.y)) doors.e = true;
        if (cells.some(o => o.x === c.x && o.y === c.y + 1)) doors.s = true;
        if (cells.some(o => o.x === c.x - 1 && o.y === c.y)) doors.w = true;
        return {
          x: c.x, y: c.y, w: ROOM_W, h: ROOM_H,
          type: 'combat', doors,
          spawned: false, cleared: false, depth: 0, forgeTalked: false
        };
      });
      const depthMap = { '0,0': 0 };
      const q = [rooms.find(r => r.x === 0 && r.y === 0)];
      while (q.length) {
        const r = q.shift();
        for (const d of ['n', 'e', 's', 'w']) {
          if (!r.doors[d]) continue;
          const nx = r.x + (d === 'e' ? 1 : d === 'w' ? -1 : 0);
          const ny = r.y + (d === 's' ? 1 : d === 'n' ? -1 : 0);
          const k = nx + ',' + ny;
          if (depthMap[k] === undefined) {
            const nr = rooms.find(ro => ro.x === nx && ro.y === ny);
            if (nr) {
              depthMap[k] = depthMap[r.x + ',' + r.y] + 1;
              q.push(nr);
            }
          }
        }
      }
      for (const r of rooms) r.depth = depthMap[r.x + ',' + r.y] || 0;
      const start = rooms.find(r => r.x === 0 && r.y === 0);
      start.type = 'start';
      start.cleared = true;
      start.spawned = true;
      let boss = rooms[0];
      for (const r of rooms) if (r.depth > boss.depth) boss = r;

    }

  // ---------- 音名 → 频率 ----------
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freqOf(name) {
    const m = /^([A-G])(\d)$/.exec(name);
    if (!m) return 0;
    const midi = (parseInt(m[2], 10) + 1) * 12 + SEMI[m[1]];
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // ---------- 引擎 ----------
  function createBossMusic(ctx, opts) {
    opts = opts || {};
    const ahead = Math.max(0.05, opts.scheduleAhead || 0.15);
    const masterGain = opts.masterGain || 0.22;
    const out = opts.output || (ctx ? ctx.destination : null);
    const D = BGM_DATA;
    // 曲目：boss（默认）| surprise（彩蛋 Boss：惊奇引子 + Boss 主循环）| room（敌人房间）
    const SONGS = {
      boss: {
        bars: D.bars, stepDur: D.stepDur, barDur: D.barDur, loopDur: D.loopDur,
        introBars: D.introBars, introDur: D.introDur,
        levels: D.levels, tracks: D.tracks,
        introTracks: D.introTracks, introRiserAtEnd: D.introRiserAtEnd,
        introTrackList: ['kick', 'snare', 'hat', 'klaxon']
      },
      surprise: {
        bars: D.bars, stepDur: D.stepDur, barDur: D.barDur, loopDur: D.loopDur,
        introBars: D.surpriseIntroBars, introDur: D.surpriseIntroBars * D.stepDur * 16,
        levels: D.levels, tracks: D.tracks,
        introTracks: D.surpriseIntroTracks, introRiserAtEnd: D.surpriseRiserAtEnd,
        introTrackList: ['kick', 'snare', 'hat', 'boing', 'scratch', 'boom']
      },
      room: {
        bars: D.room.bars, stepDur: D.room.stepDur, barDur: D.room.barDur, loopDur: D.room.loopDur,
        introBars: 0, introDur: 0,
        levels: D.room.levels, tracks: D.room.tracks,
        introTracks: null, introRiserAtEnd: false,
        introTrackList: []
      }
    };

    let state = 'idle';   // idle | intro | loop | stopped
    let phase = 1;
    let songKey = 'boss';
    let song = SONGS.boss;
    let startTime = 0;    // 引子开始时刻
    let loopStart = 0;    // 当前循环周期起始时刻
    let sAbs = 0;         // 循环内已调度步数
    let scheduledThrough = 0; // 循环内已调度到的时间点（绝对时间）
    let master = null;

    // 行数据可能是紧凑串（鼓点 1000100010001000）或空格分隔（音符行），统一展开
    const norm = row => (row.indexOf(' ') >= 0 ? row : row.split('').join(' '));
    const cache = {};
    function prepare(key) {
      if (cache[key]) return cache[key];
      const s = SONGS[key];
      const tracks = {};
      for (const k of Object.keys(s.tracks)) {
        const tr = s.tracks[k];
        tracks[k] = {
          rowMap: tr.rowMap,
          phaseRows: tr.phaseRows || null,
          rows: tr.rows.map(norm)
        };
      }
      const intro = {};
      if (s.introTracks) {
        for (const k of Object.keys(s.introTracks)) intro[k] = norm(s.introTracks[k]);
      }
      cache[key] = { tracks, intro };
      return cache[key];
    }

    if (ctx && out) {
      try {
        master = ctx.createGain();
        master.gain.value = masterGain;
        master.connect(out);
      } catch (e) { master = null; }
    }
    const canPlay = !!master;

    function activeTracks() {
      const lv = song.levels;
      const set = new Set(lv['1']);
      if (phase >= 2 && lv['2']) for (const t of lv['2']) set.add(t);
      if (phase >= 3 && lv['3']) for (const t of lv['3']) set.add(t);
      return set;
    }

    // ---------- 合成小工具（兼容无 createBiquadFilter 的测试环境） ----------
    function setFreq(node, v, t) {
      if (node.frequency && node.frequency.setValueAtTime) node.frequency.setValueAtTime(v, t);
    }
    function rampFreq(node, v, t) {
      const f = node.frequency;
      if (!f) return;
      if (f.exponentialRampToValueAtTime) f.exponentialRampToValueAtTime(Math.max(1, v), t);
      else if (f.linearRampToValueAtTime) f.linearRampToValueAtTime(v, t);
      else if (f.setValueAtTime) f.setValueAtTime(v, t);
    }
    function rampGain(g, v, t) {
      if (g.gain.exponentialRampToValueAtTime) g.gain.exponentialRampToValueAtTime(Math.max(0.0001, v), t);
      else if (g.gain.linearRampToValueAtTime) g.gain.linearRampToValueAtTime(v, t);
      else if (g.gain.setValueAtTime) g.gain.setValueAtTime(v, t);
    }
    function lowpass(t, cutoff) {
      const make = ctx.createFilter || ctx.createBiquadFilter;
      if (!make) return null;
      const f = make.call(ctx);
      f.type = 'lowpass';
      if (f.frequency && f.frequency.setValueAtTime) f.frequency.setValueAtTime(cutoff, t);
      return f;
    }

    function noteF(f0, t, dur, type, vol, cutoff) {
      if (!canPlay) return;
      const a = ctx.createOscillator();
      const g = ctx.createGain();
      a.type = type || 'sawtooth';
      setFreq(a, f0, t);
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, vol, t + 0.006);
      rampGain(g, 0.0001, t + dur);
      let node = a;
      if (cutoff) {
        const f = lowpass(t, cutoff);
        if (f) { a.connect(f); node = f; }
      }
      node.connect(g);
      g.connect(master);
      a.start(t);
      if (a.stop) a.stop(t + dur + 0.05);
    }

    function noteEcho(f0, t, dur, type, vol, cutoff, echoes) {
      noteF(f0, t, dur, type, vol, cutoff);
      (echoes || []).forEach(ed => {
        noteF(f0, t + ed.delay, dur, type, vol * ed.vol, cutoff * 0.7);
      });
    }

    function noiseAt(t, dur, vol, ftype, cutoff, cutoffEnd) {
      if (!canPlay) return;
      const sr = ctx.sampleRate || 44100;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, vol, t + 0.005);
      rampGain(g, 0.0001, t + dur);
      let node = src;
      if (cutoff && (ctx.createFilter || ctx.createBiquadFilter)) {
        const make = ctx.createFilter || ctx.createBiquadFilter;
        const f = make.call(ctx);
        f.type = ftype || 'lowpass';
        if (f.frequency && f.frequency.setValueAtTime) {
          f.frequency.setValueAtTime(cutoff, t);
          if (cutoffEnd && f.frequency.linearRampToValueAtTime) {
            f.frequency.linearRampToValueAtTime(cutoffEnd, t + dur);
          }
        }
        src.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(master);
      src.start(t);
      if (src.stop) src.stop(t + dur + 0.05);
    }

    // ---------- 乐器 ----------
    function kick(t) {
      if (!canPlay) return;
      const a = ctx.createOscillator();
      const g = ctx.createGain();
      a.type = 'sine';
      setFreq(a, 150, t);
      rampFreq(a, 44, t + 0.1);
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, 1.0, t + 0.004);
      rampGain(g, 0.0001, t + 0.12);
      a.connect(g);
      g.connect(master);
      a.start(t);
      if (a.stop) a.stop(t + 0.16);
      noiseAt(t, 0.03, 0.25, 'highpass', 4000);
    }
    function snare(t) {
      noiseAt(t, 0.1, 0.5, 'bandpass', 1900);
      noteF(220, t, 0.07, 'sine', 0.25, 0);
    }
    function hat(t) {
      noiseAt(t, 0.035, 0.2, 'highpass', 7500);
    }
    function bassNote(t, f0, accent) {
      noteF(f0, t, 0.085, 'sawtooth', accent ? 0.55 : 0.45, 700);
    }
    function riffNote(t, f0) {
      noteEcho(f0, t, 0.11, 'sawtooth', 0.3, 2200, [
        { delay: 0.3, vol: 0.4 },
        { delay: 0.6, vol: 0.16 }
      ]);
    }
    function arpNote(t, f0) {
      noteF(f0, t, 0.085, 'triangle', 0.3, 3500);
    }
    function stab(t, f0s) {
      for (const f0 of f0s) noteF(f0, t, 0.14, 'sawtooth', 0.2, 1500);
    }
    function leadNote(t, f0) {
      noteF(f0 * 1.006, t, 0.16, 'sawtooth', 0.2, 3200);
      noteF(f0 * 0.994, t, 0.16, 'sawtooth', 0.2, 3200);
      noteF(f0 * 1.006, t + 0.35, 0.14, 'sawtooth', 0.1, 2400);
      noteF(f0 * 0.994, t + 0.35, 0.14, 'sawtooth', 0.1, 2400);
    }
    function riser(t, dur) {
      if (!canPlay) return;
      noiseAt(t, dur, 0.35, 'bandpass', 350, 6000);
      const a = ctx.createOscillator();
      const g = ctx.createGain();
      a.type = 'sawtooth';
      setFreq(a, 160, t);
      rampFreq(a, 1400, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, 0.15, t + 0.02);
      rampGain(g, 0.0001, t + dur);
      a.connect(g);
      g.connect(master);
      a.start(t);
      if (a.stop) a.stop(t + dur + 0.05);
    }
    function klaxon(t, f0) {
      noteF(f0 * 1.02, t, 0.24, 'sawtooth', 0.4, 1400);
      noteF(f0 * 0.98, t, 0.24, 'sawtooth', 0.4, 1400);
    }
    function boing(t, f0) {
      if (!canPlay) return;
      const a = ctx.createOscillator();
      const g = ctx.createGain();
      a.type = 'square';
      setFreq(a, f0, t);
      rampFreq(a, f0 * 1.5, t + 0.16); // 上滑音 "boing"
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, 0.3, t + 0.01);
      rampGain(g, 0.0001, t + 0.2);
      a.connect(g);
      g.connect(master);
      a.start(t);
      if (a.stop) a.stop(t + 0.24);
    }
    function scratch(t) {
      noiseAt(t, 0.12, 0.3, 'bandpass', 900, 2600);
      noiseAt(t + 0.08, 0.08, 0.2, 'bandpass', 2200, 800);
    }
    function boom(t) {
      if (!canPlay) return;
      const a = ctx.createOscillator();
      const g = ctx.createGain();
      a.type = 'sine';
      setFreq(a, 100, t);
      rampFreq(a, 30, t + 0.5);
      g.gain.setValueAtTime(0.0001, t);
      rampGain(g, 0.9, t + 0.01);
      rampGain(g, 0.0001, t + 0.6);
      a.connect(g);
      g.connect(master);
      a.start(t);
      if (a.stop) a.stop(t + 0.65);
      noiseAt(t, 0.4, 0.4, 'lowpass', 300);
    }

    // ---------- 步进调度 ----------
    const BASS_BASE = new Set(['A1', 'F1', 'C2', 'G1']);
    function scheduleStep(t, token, trackName) {
      if (token === 'R' || token === '0') return;
      if (trackName === 'kick') { kick(t); return; }
      if (trackName === 'snare') { snare(t); return; }
      if (trackName === 'hat') { hat(t); return; }
      if (trackName === 'riser') { if (token === 'X') riser(t, 0.35); return; }
      if (trackName === 'klaxon') { klaxon(t, freqOf(token)); return; }
      if (trackName === 'boing') { boing(t, freqOf(token)); return; }
      if (trackName === 'scratch') { if (token === 'X') scratch(t); return; }
      if (trackName === 'boom') { if (token === '1') boom(t); return; }
      if (trackName === 'bass') {
        bassNote(t, freqOf(token), !BASS_BASE.has(token));
        return;
      }
      if (trackName === 'riff') { riffNote(t, freqOf(token)); return; }
      if (trackName === 'arp') { arpNote(t, freqOf(token)); return; }
      if (trackName === 'stab') {
        if (D.chords[token]) stab(t, D.chords[token].map(freqOf));
        return;
      }
      if (trackName === 'lead') { leadNote(t, freqOf(token)); return; }
    }

    function scheduleLoopRange(fromTime, toTime) {
      if (!canPlay) return;
      const prep = prepare(songKey);
      const active = [...activeTracks()];
      const steps = song.bars * 16;
      while (sAbs < steps) {
        const t = loopStart + sAbs * song.stepDur;
        if (t >= toTime) break;
        if (t >= fromTime - 1e-6) {
          const bar = Math.floor(sAbs / 16);
          const st = sAbs % 16;
          for (const trackName of active) {
            const tr = prep.tracks[trackName];
            let rowIdx = tr.rowMap[bar];
            if (tr.phaseRows && tr.phaseRows[String(phase)] !== undefined) {
              rowIdx = tr.phaseRows[String(phase)];
            }
            scheduleStep(t, tr.rows[rowIdx].split(' ')[st], trackName);
          }
        }
        sAbs++;
      }
      if (sAbs >= steps) {
        sAbs = 0;
        loopStart += song.loopDur;
        scheduledThrough = loopStart;
      }
    }

    function scheduleIntro() {
      const prep = prepare(songKey);
      for (const trackName of song.introTrackList) {
        const tokens = prep.intro[trackName].split(' ');
        for (let s = 0; s < tokens.length; s++) {
          scheduleStep(startTime + s * song.stepDur, tokens[s], trackName);
        }
      }

          if (dist > 240) {
            e.x += ux * e.speed * dt;
            e.y += uy * e.speed * dt;
          } else if (dist < 150) {
            e.x -= ux * e.speed * dt;
            e.y -= uy * e.speed * dt;
          } else {
            if (e.attackT <= 0) {
              e.state = 'telegraph';
              e.stateT = k.telegraphT;
            } else {
              e.attackT -= dt;
              const lat = Math.sin(world.time * 1.8 + e.id) * 0.6;
              e.x += (-uy) * e.speed * lat * dt;
              e.y += ux * e.speed * lat * dt;
            }
          }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            e.dashAngle = Math.atan2(dy, dx);
            e.state = 'dash';
            e.stateT = 0.25;
            for (let a2 = 0; a2 < Math.PI * 2; a2 += Math.PI / 3) {
              spawnEnemyBullet(e.x, e.y, a2, 240, e.dmg * 0.6, e.color, 'enemy', 6, { burn: 1.5, dps: 2 });
            }
            audio.play('zap');
          }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * 420 * dt;
          e.y += Math.sin(e.dashAngle) * 420 * dt;
          e.facing = e.dashAngle;
          enemyPushObstacles(e, e.dashAngle);
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle, { slow: 1.5, pct: 0.3 });
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.dashCooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'boss') {
        if (e.poison) {
          updatePoisonBoss(e, dt);
        } else {
        const def = ENEMY_KINDS[e.kind];
        e.rotation += def.rotSpeed * dt * (e.phase >= 3 ? 2 : 1);
        const pct = e.hp / e.maxHp;
        if (pct <= 0.3 && e.phase < 3) {
          e.phase = 3;
          setBossMusicPhase(3);
          fx.burst(e.x, e.y, '#ff4d5e', 20);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        } else if (pct <= 0.6 && e.phase < 2) {
          e.phase = 2;
          setBossMusicPhase(2);
          fx.burst(e.x, e.y, '#ffd166', 16);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        }
        e.x += ux * e.speed * dt;
        e.y += uy * e.speed * dt;
        e.burstCd -= dt;
        const interval = e.phase >= 3 ? 0.7 : e.phase === 2 ? 0.9 : 1.8;
        if (e.burstCd <= 0) {
          e.burstCd = interval;
          const count = e.phase >= 3 ? 24 : 12;
          const off = (e.phase >= 2 ? 15 : 0) * Math.PI / 180;
          for (let a2 = off; a2 < Math.PI * 2 + off; a2 += Math.PI * 2 / count) {
            spawnEnemyBullet(e.x, e.y, a2, 260, e.dmg, '#ff3d81', 'enemy', 6, { burn: 2, dps: 4 });
          }
          if (e.phase === 1 && Math.random() < 0.3) {
            for (let f = -1; f <= 1; f++) {
              spawnEnemyBullet(e.x, e.y, Math.atan2(dy, dx) + f * 0.22, 300, e.dmg, '#ff3d81', 'enemy', 6, { burn: 2, dps: 4 });
            }
          }
          audio.play('zap');
        }
        if (e.phase >= 2) {
          e.summonCd -= dt;
          const buzzers = world.enemies.filter(x => x.kind === 'buzzer').length;
          if (e.summonCd <= 0 && buzzers < 4) {
            e.summonCd = 10;
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
          }
        }
        if (e.phase >= 3) {
          e.dashCd -= dt;
          if (e.state === 'idle' && e.dashCd <= 0) {
            e.state = 'telegraph';
            e.stateT = 0.5;
          } else if (e.state === 'telegraph') {
            if (e.stateT <= 0) {
              e.dashAngle = Math.atan2(dy, dx);
              e.state = 'dash';
              e.stateT = 0.4;
            }
          } else if (e.state === 'dash') {
            e.x += Math.cos(e.dashAngle) * 520 * dt;
            e.y += Math.sin(e.dashAngle) * 520 * dt;
            if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
            if (e.stateT <= 0) {
              e.state = 'recover';
              e.stateT = 1.0;
              e.dashCd = 2.5;
            }
          } else if (e.state === 'recover') {
            if (e.stateT <= 0) e.state = 'idle';
          }
        }
        }
      }
    }

    function updatePoisonBoss(e, dt) {
      const p = world.player;
      const dx = p.x - e.x, dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const ux = dx / dist, uy = dy / dist;
      e.rotation += 0.8 * dt * (e.phase >= 3 ? 2 : 1);
      const pct = e.hp / e.maxHp;
      if (pct <= 0.3 && e.phase < 3) {
        e.phase = 3;
        setBossMusicPhase(3);
        fx.burst(e.x, e.y, '#7ef29a', 20);
        fx.shake(6);
        audio.play('roar');
        fx.slowmo(0.4, 0.3);
      } else if (pct <= 0.6 && e.phase < 2) {
        e.phase = 2;
        setBossMusicPhase(2);
        fx.burst(e.x, e.y, '#7ef29a', 16);
        fx.shake(6);
        audio.play('roar');
        fx.slowmo(0.4, 0.3);
      }
      e.x += ux * e.speed * dt;
      e.y += uy * e.speed * dt;
      e.burstCd -= dt;
      const interval = e.phase >= 3 ? 0.8 : e.phase === 2 ? 1.0 : 1.4;
      if (e.burstCd <= 0) {
        e.burstCd = interval;
        const count = e.phase >= 3 ? 18 : e.phase === 2 ? 12 : 8;
        for (let a2 = 0; a2 < Math.PI * 2; a2 += Math.PI * 2 / count) {
          spawnEnemyBullet(e.x, e.y, a2, 175, e.dmg * 0.7, '#7ef29a', 'poison', 2.6);
        }
        if (e.phase >= 2 && Math.random() < 0.6) {
          for (let i = 0; i < 4; i++) {
            spawnPoisonZone(
              utils.clamp(e.x + utils.rand(-280, 280), 60, ROOM_W - 60),
              utils.clamp(e.y + utils.rand(-280, 280), 60, ROOM_H - 60),
              62
            );
          }
        }
        audio.play('zap');
      }
      if (e.phase >= 2) {
        e.summonCd -= dt;
        const buzzers = world.enemies.filter(x => x.kind === 'buzzer').length;
        if (e.summonCd <= 0 && buzzers < 3) {
          e.summonCd = 8;
          world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
          world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
        }
      }
      if (e.phase >= 3) {
        e.attackT -= dt;
        if (e.attackT <= 0) {
          e.attackT = 1.6;
          const base = Math.atan2(dy, dx);
          for (let f = -2; f <= 2; f++) {
            spawnEnemyBullet(e.x, e.y, base + f * 0.16, 260, e.dmg, '#7ef29a', 'poison', 2.2);
          }
          audio.play('zap');
        }
      }
      if (dist < 130) {
        e.auraT = (e.auraT || 0) - dt;
        if (e.auraT <= 0) { e.auraT = 0.8; applyPlayerStatus('poison', 2.5, 4); }
        applyRawDamage(5 * dt, false);
      }
    }

    // ===== fx（粒子/弹壳/曳光，对象池）=====
    const fx = {
      poolLimit: 1500,
      spawn(o) {
        if (world.particles.length >= fx.poolLimit) world.particles.shift();
        world.particles.push(Object.assign({ maxLife: o.life, rot: 0, vr: 0 }, o));
      },
      muzzle(x, y, angle, color) {
        for (let i = 0; i < 5; i++) {
          const a = angle + (Math.random() - 0.5) * 0.9;
          const sp = 130 + Math.random() * 200;
          fx.spawn({
            kind: 'muzzle', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.05 + Math.random() * 0.045,
            color, size: 3 + Math.random() * 4
          });
        }
      },
      casing(x, y, angle) {
        world.casings.push({
          x, y,
          vx: Math.cos(angle + Math.PI / 2) * 130 + utils.rand(-40, 40),
          vy: Math.sin(angle + Math.PI / 2) * 130 - 90,
          rot: Math.random() * Math.PI * 2,
          vr: utils.rand(-12, 12),
          life: 1.4
        });
      },
      smoke(x, y) {
        fx.spawn({
          kind: 'smoke', x: x + utils.rand(-3, 3), y: y + utils.rand(-3, 3),
          vx: utils.rand(-15, 15), vy: utils.rand(-15, 15),
          life: 0.35 + Math.random() * 0.2,
          color: '#8fa6b8', size: 4
        });
      },
      sparks(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 90 + Math.random() * 190;
          fx.spawn({
            kind: 'spark', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.18 + Math.random() * 0.15,
            color, size: 1.5 + Math.random() * 2
          });
        }
      },
      burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 60 + Math.random() * 220;
          fx.spawn({
            kind: 'burst', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.5 + Math.random() * 0.4,
            color, size: 2.5 + Math.random() * 4,
            rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10
          });
        }
      },
      floater(x, y, text, kind) {
        world.floaters.push({
          x: x + utils.rand(-6, 6), y, text,
          kind: kind || 'normal', life: 0.7, maxLife: 0.7
        });
      },
      shake(power) {
        fx.shakePower = Math.min(12, Math.max(fx.shakePower || 0, power));
      },
      hitStop(ms) {
        fx.hitStopMs = Math.max(fx.hitStopMs || 0, ms);
      },
      slowmo(factor, sec) {
        fx.slowmoFactor = factor;
        fx.slowmoT = sec;
      }
    };
    fx.shakePower = 0;
    fx.hitStopMs = 0;
    fx.slowmoFactor = 1;
    fx.slowmoT = 0;

    // ===== 战斗结算 =====
    function damageEnemy(e, dmg, angle, opts) {
      if (!e || e.dead) return { died: false, crit: false };
      const o = opts || {};
      if (e.shield > 0) {
        e.shield -= dmg * (o.shieldDmg || 1);
        e.shieldDelay = 3;
        e.flash = 0.08;
        fx.sparks(e.x, e.y, '#b06cff', 4);
        fx.floater(e.x, e.y - e.radius - 8, '盾', 'normal');
        audio.play('hit');
        if (e.shield <= 0) {
          e.shield = 0;
          fx.burst(e.x, e.y, '#b06cff', 10);
          audio.play('kill');
          e.state = 'recover';
          e.stateT = 0.8;
        }
        return { died: false, crit: false };
      }
      const crit = !!o.critChance && Math.random() < o.critChance;
      const execMul = (o.execute && o.execute > 1 && e.hp <= e.maxHp * 0.15) ? o.execute : 1;
      const final = (crit ? dmg * (o.critMult || 2) : dmg) * execMul;
      e.hp -= final;
      e.flash = 0.08;
      if (e.kind !== 'boss') {
        const kb = (18 + Math.min(20, dmg * 0.25)) * (e.kind === 'elite' ? 0.3 : 1);
        e.kbvx = Math.cos(angle) * kb;
        e.kbvy = Math.sin(angle) * kb;
      }
      fx.sparks(e.x, e.y, e.color, 5);
      fx.floater(e.x, e.y - e.radius - 8, String(Math.round(final)), crit ? 'crit' : 'normal');
      if (o.burnDps) { e.burnDps = o.burnDps; e.burnT = o.burnT; }
      if (o.slowPct) { e.slowPct = o.slowPct; e.slowT = o.slowT; }
      if (o.frozenT) e.freezeT = o.frozenT;
      if (o.lifestealOnHit) world.player.hp = Math.min(world.player.maxHp, world.player.hp + o.lifestealOnHit);
      audio.play('hit');
      haptics.event(crit ? 'crit' : 'hit');
      if (e.hp <= 0) {
        if (o.vamp) world.player.hp = Math.min(world.player.maxHp, world.player.hp + o.vamp);
        killEnemy(e);
        return { died: true, crit };
      }
      return { died: false, crit };
    }

    function killEnemy(e) {
      if (e.dead) return;
      e.dead = true;
      if (e.kind === 'boss') {
        bossMusicVictory();
        fx.slowmo(0.3, 0.5);
        fx.hitStop(120);
        audio.play('roar');
        startBossCoinRain(e.x, e.y);
        if (e.specialNpc) {
          setScreen('win');
        } else if (world.layer >= world.maxLayers) {
          for (let i = 0; i < 4; i++) {
            spawnPickup('part', e.x + utils.rand(-70, 70), e.y + utils.rand(-70, 70), partsEngine.rollPart());
          }
          spawnPickup('medkit', e.x, e.y + 60, 0);
          spawnPickup('medkit', e.x, e.y - 60, 0);
          setScreen('win');
        } else {
          for (const rem of [...world.enemies]) {
            if (rem !== e && !rem.dead) {
              rem.dead = true;
              fx.burst(rem.x, rem.y, rem.color, 6);
            }
          }
          world.enemies.length = 0;
          world.portal = {
            x: ROOM_W / 2, y: ROOM_H / 2, t: 0, active: false,
            roomX: world.mapInfo.roomPos.x, roomY: world.mapInfo.roomPos.y
          };
          audio.play('door');
        }
      }
      const idx = world.enemies.indexOf(e);
      if (idx >= 0) utils.swapRemove(world.enemies, idx);
      const def = ENEMY_KINDS[e.kind];
      if (e.behavior === 'splitter' && def.splitKind && (e.extra.gen || 0) < (def.maxGen || 1)) {
        for (let s = 0; s < (def.splitCount || 2); s++) {
          const mini = spawnEnemy(def.splitKind, e.x + utils.rand(-12, 12), e.y + utils.rand(-12, 12), 1);
          mini.extra.gen = (e.extra.gen || 0) + 1;
          mini.hp = mini.maxHp;
          world.enemies.push(mini);
        }
      }
      fx.burst(e.x, e.y, e.color, 8);
      fx.hitStop(60);
      audio.play('kill');
      haptics.event(e.kind === 'boss' ? 'boss' : 'kill');
      world.stats.kills++;
      updateCombo();
      maybeDrop(e);
      world.dash.cd = 0;
      {
        const g = gun();
        if (g.stats.magRefund && g.mag < g.stats.magSize && Math.random() < g.stats.magRefund) g.mag++;
        const as = world.player.armorSpec || {};
        if (as.killGrowth > 0 && world.player.maxArmor < (world.player.armorCap || world.player.maxArmor)) {
          world.player.maxArmor = Math.min(world.player.armorCap, world.player.maxArmor + 1);
          world.player.armor = Math.min(world.player.maxArmor, world.player.armor + 1);
        }
        if (as.killHeal > 0) {
          world.player.hp = Math.min(world.player.maxHp, world.player.hp + as.killHeal);
          world.player.armor = Math.min(world.player.maxArmor, world.player.armor + as.killHeal);
        }
      }
      if (e.scale > 1) fx.slowmo(0.3, 0.25);
    }

    function applyPlayerStatus(kind, dur, value) {
      const p = world.player;
      if (kind === 'burn') { p.burnT = dur; p.burnDps = value; }
      else if (kind === 'poison') { p.poisonT = dur; p.poisonDps = value; }
      else if (kind === 'bleed') { p.bleedT = dur; p.bleedDps = value; }
      else if (kind === 'slow') { p.slowT = dur; p.slowPct = value; }
    }

    function damagePlayer(dmg, angle, el) {
      const p = world.player;
      if (p.invuln > 0) return;
      const as = p.armorSpec || {};
      if (as.dodge && Math.random() < as.dodge) {
        fx.floater(p.x, p.y - 24, '闪避', 'crit');
        return;
      }
      let d = dmg;
      if (p.armor > 0) {
        const absorbed = Math.min(p.armor, d);
        p.armor -= absorbed;
        d -= absorbed;
        fx.sparks(p.x, p.y, '#35e0ff', 3);
        if (absorbed > 0) fx.floater(p.x, p.y - 30, '-' + Math.round(absorbed), 'normal');
      }
      d *= (p.armorSpec ? p.armorSpec.dmgMul : 1);
      p.hp -= d;
      p.invuln = 0.4;
      if (el) {
        if (el.burn) { applyPlayerStatus('burn', el.burn, el.dps); fx.floater(p.x, p.y - 36, '燃烧', 'normal'); }
        if (el.slow) { applyPlayerStatus('slow', el.slow, el.pct); fx.floater(p.x, p.y - 36, '减速', 'normal'); }
        if (el.poison) { applyPlayerStatus('poison', el.poison, el.dps); fx.floater(p.x, p.y - 36, '中毒', 'normal'); }
        if (el.bleed) { applyPlayerStatus('bleed', el.bleed, el.dps); fx.floater(p.x, p.y - 36, '流血', 'normal'); }
      }
      if (d > 0) {
        if (as.echoSurge) as.echoSurgeT = 2;
        const th = gun().stats.thorns || 0;
        if (th > 0 && world.enemies.length) {
          let ne = null, nd = 1e9;
          for (const en of world.enemies) {
            if (en.dead) continue;
            const dd = Math.hypot(en.x - p.x, en.y - p.y);
            if (dd < nd) { nd = dd; ne = en; }
          }
          if (ne) damageEnemy(ne, d * th, Math.atan2(ne.y - p.y, ne.x - p.x), {});
        }
      }
      const kbMul = (p.armorSpec ? p.armorSpec.kbMul : 1);
      p.vx += Math.cos(angle) * 300 * kbMul;
      p.vy += Math.sin(angle) * 300 * kbMul;
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > 800) {
        p.vx = (p.vx / spd) * 800;
        p.vy = (p.vy / spd) * 800;
      }
      fx.shake(4);
      fx.sparks(p.x, p.y, '#ff4d5e', 6);
      fx.floater(p.x, p.y - 20, '-' + dmg, 'normal');
      audio.play('hit');
      haptics.event('playerHit', { angle: angle });
      if (p.hp <= 0) {
        p.hp = 0;
        if (world.fightNpc) restart();
        else setScreen('dead');
      }
    }

    function applyRawDamage(dmg, isBurn) {
      const p = world.player;
      let d = dmg;
      const as = p.armorSpec || {};
      if (isBurn && as.burnDmgMul) d *= as.burnDmgMul;
      if (p.armor > 0) {
        const absorbed = Math.min(p.armor, d);
        p.armor -= absorbed;
        d -= absorbed;
      }
      d *= (p.armorSpec ? p.armorSpec.dmgMul : 1);
      p.hp -= d;
      if (d >= 1) haptics.event('playerHit');
      if (p.hp <= 0) {
        p.hp = 0;
        if (world.fightNpc) restart();
        else setScreen('dead');
      }
    }

    function spawnPoisonZone(x, y, r) {
      world.poisonZones.push({ x, y, r, life: 4.5, maxLife: 4.5, dps: 7 });
    }

    function spawnFlameZone(x, y, r) {
      world.poisonZones.push({ x, y, r: r || 55, life: 4, maxLife: 4, dps: 6, flame: true });
    }

    function updatePoisonZones(dt) {
      const p = world.player;
      for (let i = world.poisonZones.length - 1; i >= 0; i--) {
        const z = world.poisonZones[i];
        z.life -= dt;
        if (z.life <= 0) { utils.swapRemove(world.poisonZones, i); continue; }
        if (Math.hypot(p.x - z.x, p.y - z.y) < z.r) {
          applyRawDamage(z.dps * dt, !!z.flame);
          if (Math.random() < dt * 8) {
            fx.spawn({
              kind: 'spark', x: p.x + utils.rand(-12, 12), y: p.y + utils.rand(-12, 12),
              vx: utils.rand(-15, 15), vy: utils.rand(-25, -5),
              life: 0.4, color: '#7ef29a', size: 2.5
            });
          }
        }
      }
    }

    function maybeDrop(e) {
      if (e.scale > 1.5) {
        spawnPickup('part', e.x, e.y, partsEngine.rollPart());
        return;
      }
      const r = Math.random();
      if (r < 0.021) spawnPickup('part', e.x, e.y, partsEngine.rollPart());
      else if (r < 0.041) {
        const weights = [10, 15, 20, 25, 30]; // 品质越高掉落概率越高
        const total = weights.reduce((a, b) => a + b, 0);
        let rr = Math.random() * total;
        let rarity = 0;
        for (let i = 0; i < weights.length; i++) {
          rr -= weights[i];
          if (rr <= 0) { rarity = i; break; }
        }
        const keys = Object.keys(PARTS.armor);
        const def = PARTS.armor[keys[Math.floor(Math.random() * keys.length)]];
        spawnPickup('part', e.x, e.y, {
          id: def.id, slot: 'armor', name: def.name, rarity,
          color: def.color, desc: def.desc || '',
          affixes: partsEngine.rollAffixes(rarity)
        });
      }
      else if (r < 0.09 && world.player.hp < world.player.maxHp * 0.5) spawnPickup('medkit', e.x, e.y, 0);
      else if (r < 0.336) {
        const def = ENEMY_KINDS[e.kind] || {};
        const tier = (def.coinTier || 1) + Math.max(0, Math.round(e.scale) - 1);
        spawnPickup('coin', e.x, e.y, utils.randInt(1, Math.max(1, tier)));
      }
    }

    function updateCombo() {
      const now = world.time;
      if (now - world.stats.comboT < 0.5) world.stats.combo++;
      else world.stats.combo = 1;
      world.stats.comboT = now;
      if (world.stats.combo >= 3) audio.play('combo', world.stats.combo);
    }

    function setScreen(name) {
      state.screen = name;
      state.paused = name === 'paused';
      if (name === 'dead' || name === 'start') stopBossMusic();
      if (name === 'win') haptics.event('victory');
      if (name === 'dead') haptics.event('death');
    }

    function resetState() {
      world.player = {
        x: ROOM_W / 2, y: ROOM_H / 2, vx: 0, vy: 0,
        hp: 100, maxHp: 100, radius: 14, speed: 260,
        aimAngle: 0, invuln: 0, recoil: 0,
        burnT: 0, burnDps: 0, poisonT: 0, poisonDps: 0, bleedT: 0, bleedDps: 0, slowT: 0, slowPct: 0,
        armor: 0, maxArmor: 0, armorCap: 0,
        armorSpec: { speedMul: 1, dmgMul: 1, kbMul: 1, regenMul: 1, regenFlat: 0, hpRegen: 0,
          killGrowth: 0, killHeal: 0, dodge: 0, echoSurge: 0, echoSurgeT: 0, burnDmgMul: 1, dashCdMul: 1 }
      };
      world.guns = [buildGun('pistol_body', 'standard_ammo', 'none_mod'), buildGun('pistol_body', 'standard_ammo', 'none_mod')];
      world.activeGun = 0;
      world.enemies.length = 0;
      world.bullets.length = 0;
      world.particles.length = 0;
      world.pickups.length = 0;
      world.casings.length = 0;
      world.floaters.length = 0;
      world.tracers.length = 0;
      world.impactMarks.length = 0;
      world.chains.length = 0;
      world.room = { id: 0, type: 'start', x: 0, y: 0, w: ROOM_W, h: ROOM_H, cleared: false, doors: { n: false, e: false, s: false, w: false } };
      world.map = null;
      world.coins = 0;
      world.time = 0;
      world.stats = { kills: 0, combo: 0, comboT: -9, score: 0 };
      world.inventory.length = 0;
      world.shopOffers.length = 0;
      world.shopPrices.length = 0;
      world.shopPos = null;
      world.chest = null;
      world.chestPart = null;
      world.coinPile = null;
      world.portal = null;
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: 0, clearedRooms: 0 };
      world.transition.active = false;
      world.hpDelay = 100;
      world.lowhpT = 0;
      world.armorTick = 0;
      world.dash = { cd: 0, active: false, t: 0, angle: 0, ghostT: 0 };
      world.dashGhosts.length = 0;
      world.layer = 1;
      world.maxLayers = 2;
      world.armor = null;
      world.startNpc = null;
      world.forgeNpc = null;
      world.fightNpc = false;
      world.poisonZones.length = 0;
      world.banner = { text: '', sub: '', t: 0, dur: 0 };
      world.coinRain = null;
      ui.chat = null;
      ui.forgeState = { mode: null, part: null };
      camera.x = ROOM_W / 2;
      camera.y = ROOM_H / 2;
      input.keys.clear();
      input.pressedSet.clear();
      input.mouse.down = false;
      input.mouseHard = false;
      input.wheelDelta = 0;
      input.tapQueue.clear();
      input.dashTap = false;
      input.gp = null;
      input.gpPrev = null;
      input.padInput = false;
      input.padLast = -1e9;
      input.touch.moveId = null;
      input.touch.moveVec = { x: 0, y: 0 };
      input.touch.aimId = null;
      input.touch.firing = false;
      ui.panel = 'none';
      ui.items = [];
      ui.title = '';
      fx.hitStopMs = 0;
      fx.shakePower = 0;
      fx.slowmoFactor = 1;
      fx.slowmoT = 0;
    }

    function beginRun() {
      resetState();
      startMap(Math.floor(Math.random() * 100000) + 1);
      setScreen('playing');
    }

    function restart() {
      resetState();
      setScreen('start');
    }

    // ---------- input ----------
    function onKeyDown(e) {
      const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyR', 'KeyE', 'KeyB', 'Digit1', 'Digit2', 'Escape', 'Enter', 'Tab'];
      if (GAME_KEYS.includes(e.code)) e.preventDefault();
      if (!e.repeat) { input.keys.add(e.code); input.pressedSet.add(e.code); }
    }
    function onKeyUp(e) { input.keys.delete(e.code); }
    function onMouseMove(e) {
      // 手柄最近 0.4 秒内有输入时忽略鼠标移动（防手柄自带鼠标模拟/误触把光标抢回来）
      if (nowMs() - (input.padLast || -1e9) > 400) {
        input.padInput = false; // 真正切回键鼠模式
        if (canvas.style) canvas.style.cursor = 'crosshair';
      }
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;
    }
    function onMouseDown(e) {
      if (e.button === 2) {
        if (ui.chat) {
          if (ui.chat.battle) declineBattle();
          else closeChat();
        }
        return;
      }
      if (e.button !== 0) return;
      if (canvas.focus) canvas.focus();
      const rect = canvas.getBoundingClientRect();
      handleClick(e.clientX - rect.left, e.clientY - rect.top);
    }

    function handleClick(mx, my) {
      if (ui.chat && ui.chat.buttons) {
        for (const b of ui.chat.buttons) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (b.action === 'acceptBattle') acceptBattle();
            else declineBattle();
            return true;
          }
        }
        if (ui.chat.battle) return true; // 战斗询问期间点击别处不触发开火
      }
      if (ui.panel !== 'none') {
        uiClick(mx, my);
        return true;
      }
      if (state.screen !== 'playing') {
        if (ui.hapticsPanel && state.screen === 'paused') {
          if (hapticsPanelClick(mx, my)) return true;
        }
        for (const b of overlayButtons()) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            b.action();
            return true;
          }
        }
        return false;
      }
      if (isTouchUI) {
        const btn = hitTouchButton(mx, my);
        if (btn) {
          if (btn.id === 'dash') input.dashTap = true;
          else if (btn.id === 'reload') input.tapQueue.add('reload');
          else if (btn.id === 'interact') input.tapQueue.add('interact');
          else if (btn.id === 'switch') input.tapQueue.add('switchR');
          else if (btn.id === 'panel') input.tapQueue.add('panel');
          else if (btn.id === 'pause') input.tapQueue.add('pause');
          return true;
        }
      }
      input.mouseHard = true;
      return true;
    }
    function onMouseUp(e) { if (e.button === 0) input.mouseHard = false; }
    function onWheel(e) {
      if (ui.panel === 'parts') {
        ui.scroll = utils.clamp((ui.scroll || 0) + (e.deltaY > 0 ? 30 : -30), 0, ui.maxScroll || 0);
        e.preventDefault();
        return;
      }
      input.wheelDelta += e.deltaY;
      e.preventDefault();
    }
    function onBlur() {
      input.keys.clear();
      input.pressedSet.clear();
      input.mouseHard = false;
      input.touch.firing = false;
      input.touch.moveId = null;
      input.touch.aimId = null;
    }
    function onResize() {
      const dpr = Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
      view.w = canvas.clientWidth || window.innerWidth || 960;
      view.h = canvas.clientHeight || window.innerHeight || 540;
      isTouchUI = touchMode || view.w < 780;
      canvas.width = Math.round(view.w * dpr);
      canvas.height = Math.round(view.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function touchButtons() {
      if (isTouchUI) {
        return [
          { id: 'dash', x: view.w - 132, y: view.h - 104, r: 34, label: '闪' },
          { id: 'interact', x: view.w - 56, y: view.h - 104, r: 30, label: 'E' },
          { id: 'reload', x: view.w - 56, y: view.h - 176, r: 30, label: 'R' },
          { id: 'switch', x: view.w - 56, y: view.h - 248, r: 30, label: '换' },
          { id: 'panel', x: view.w - 132, y: view.h - 176, r: 30, label: '包' },
          { id: 'pause', x: 40, y: 42, r: 22, label: 'II' }
        ];
      }
      return [
        { id: 'dash', x: 96, y: view.h - 150, r: 36, label: '闪' },
        { id: 'reload', x: view.w - 64, y: view.h - 64, r: 30, label: 'R' },
        { id: 'interact', x: view.w - 132, y: view.h - 118, r: 30, label: 'E' },
        { id: 'switch', x: view.w - 64, y: view.h - 140, r: 30, label: '换' },
        { id: 'panel', x: view.w - 132, y: view.h - 188, r: 30, label: '包' },
        { id: 'pause', x: view.w - 34, y: 42, r: 22, label: 'II' }
      ];
    }

    function hitTouchButton(x, y) {
      for (const b of touchButtons()) {
        if (Math.hypot(x - b.x, y - b.y) <= b.r) return b;
      }
      return null;
    }

    function onTouchStart(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        handleTouchPoint(x, y, t.identifier);
      }
    }

    function handleTouchPoint(x, y, id) {
      if (ui.chat) {
        if (ui.chat.buttons) handleClick(x, y);
        else closeChat(); // 普通聊天：点击任意处关闭（替代右键）
        return;
      }
      if (ui.panel !== 'none') {
        const btn = hitTouchButton(x, y);
        if (btn && (btn.id === 'panel' || btn.id === 'pause')) {
          if (btn.id === 'panel') closePanel();
          else setScreen('paused');
          return;
        }
        uiClick(x, y);
        return;
      }
      if (state.screen !== 'playing') {
        const acted = handleClick(x, y);
        if (!acted && state.screen === 'start') beginRun(); // 手机端点击任意处开始
        return;
      }
      const btn = hitTouchButton(x, y);
      if (btn) {
        if (btn.id === 'dash') input.dashTap = true;
        else if (btn.id === 'reload') input.tapQueue.add('reload');
        else if (btn.id === 'interact') input.tapQueue.add('interact');
        else if (btn.id === 'switch') input.tapQueue.add('switchR');
        else if (btn.id === 'panel') input.tapQueue.add('panel');
        else if (btn.id === 'pause') input.tapQueue.add('pause');
        return;
      }
      if (x < view.w * 0.5 && input.touch.moveId === null) {
        input.touch.moveId = id;
        input.touch.moveOrigin = { x, y };
        input.touch.moveVec = { x: 0, y: 0 };
      } else if (x >= view.w * 0.5 && input.touch.aimId === null) {
        input.touch.aimId = id;
        input.touch.aimPos = { x, y };
        input.touch.firing = true;
      }
    }

    function onTouchMove(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        updateTouchMove(t.identifier, t.clientX - rect.left, t.clientY - rect.top);
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        releaseTouch(t.identifier);
      }
    }

    function updateTouchMove(id, x, y) {
      if (id === input.touch.moveId) {
        let vx = x - input.touch.moveOrigin.x;
        let vy = y - input.touch.moveOrigin.y;
        const len = Math.hypot(vx, vy);
        const maxR = 60;
        if (len > maxR) { vx = (vx / len) * maxR; vy = (vy / len) * maxR; }
        input.touch.moveVec = { x: vx, y: vy };
      } else if (id === input.touch.aimId) {
        input.touch.aimPos = { x, y };
      }
    }

    function releaseTouch(id) {
      if (id === input.touch.moveId) {
        input.touch.moveId = null;
        input.touch.moveVec = { x: 0, y: 0 };
      } else if (id === input.touch.aimId) {
        input.touch.aimId = null;
        input.touch.firing = false;
      }
    }

    function onPointerDown(e) {
      if (e.pointerType === 'mouse') return; // 鼠标仍走原路径
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      handleTouchPoint(e.clientX - rect.left, e.clientY - rect.top, e.pointerId);
    }

    function onPointerMove(e) {
      if (e.pointerType === 'mouse') return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      updateTouchMove(e.pointerId, e.clientX - rect.left, e.clientY - rect.top);
    }

    function onPointerUp(e) {
      if (e.pointerType === 'mouse') return;
      e.preventDefault();
      releaseTouch(e.pointerId);
    }

    function pollGamepad() {
      if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
      const pads = navigator.getGamepads();
      const gp = pads && pads[0];
      const prev = input.gpPrev;
      if (!gp) { input.gp = null; input.gpPrev = null; input.padInput = false; input.padLast = -1e9; if (canvas.style) canvas.style.cursor = 'crosshair'; return; }
      const dead = 0.25;
      const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const cur = {
        lx: Math.abs(gp.axes[0]) > dead ? gp.axes[0] : 0,
        ly: Math.abs(gp.axes[1]) > dead ? gp.axes[1] : 0,
        ax: Math.abs(gp.axes[2]) > dead ? gp.axes[2] : 0,
        ay: Math.abs(gp.axes[3]) > dead ? gp.axes[3] : 0,
        fire: btn(7), dash: btn(0), interact: btn(2), reload: btn(3),
        panel: btn(8), pause: btn(9), switchR: btn(5), switchL: btn(4),
        cancel: btn(1), confirm: btn(0), aim: btn(6), trig: (gp.buttons[7] && gp.buttons[7].value) || 0, trigL: (gp.buttons[6] && gp.buttons[6].value) || 0,
        navUp: btn(12), navDown: btn(13), navLeft: btn(14), navRight: btn(15)
      };
      input.gp = cur;
      // 手柄有实际输入（按键/摇杆）才视为手柄模式并隐藏光标；
      // 鼠标一动（onMouseMove 置 padInput=false）光标立即恢复
      if (cur.fire || cur.dash || cur.interact || cur.reload || cur.panel || cur.pause ||
          cur.aim || cur.switchR || cur.switchL || cur.cancel || cur.navUp || cur.navDown || cur.navLeft || cur.navRight ||
          cur.lx !== 0 || cur.ly !== 0 || cur.ax !== 0 || cur.ay !== 0) {
        input.padInput = true;
        input.padLast = nowMs(); // 记录手柄最近输入时间
      }
      if (input.padInput && canvas.style) canvas.style.cursor = 'none';
      if (prev) {
        if (cur.dash && !prev.dash) {
          input.dashTap = true;
          input.tapQueue.add('confirm'); // 游戏中=瞬身，菜单/聊天=确认
        }
        if (cur.interact && !prev.interact) input.tapQueue.add('interact');
        if (cur.reload && !prev.reload) input.tapQueue.add('reload');
        if (cur.panel && !prev.panel) input.tapQueue.add('panel');
        if (cur.pause && !prev.pause) input.tapQueue.add('pause');
        if (cur.switchR && !prev.switchR) input.tapQueue.add('switchR');
        if (cur.switchL && !prev.switchL) input.tapQueue.add('switchL');
        if (cur.cancel && !prev.cancel) input.tapQueue.add('cancel');
        if (cur.navUp && !prev.navUp) input.tapQueue.add('navUp');
        if (cur.navDown && !prev.navDown) input.tapQueue.add('navDown');
        if (cur.navLeft && !prev.navLeft) input.tapQueue.add('navLeft');
        if (cur.navRight && !prev.navRight) input.tapQueue.add('navRight');
      }
      input.gpPrev = cur;
    }

    // ---------- update ----------
    function update(dt) {
      input.frameHandled = false;
      if (touchMode && view.h > view.w) return; // 手机端竖屏锁定，等待横屏
      if (input.tapQueue.size) {
        if (input.tapQueue.has('interact') && ui.panel === 'none' && !ui.chat) input.pressedSet.add('KeyE');
        if (input.tapQueue.has('panel')) input.pressedSet.add('KeyB');
        if (input.tapQueue.has('pause')) input.pressedSet.add('Escape');
        if (input.tapQueue.has('switchR') || input.tapQueue.has('switchL')) {
          world.activeGun = (world.activeGun + (input.tapQueue.has('switchR') ? 1 : -1) + 2) % 2;
          haptics.event('switchGun');
        }
        if (input.tapQueue.has('reload')) {
          const g = gun();
          if (!g.reloading && g.mag < g.stats.magSize) {
            g.reloading = true;
            g.reloadT = g.stats.reloadTime;
          }
        }
        // ===== 手柄：聊天/面板导航 =====
        if (ui.chat) {
          if ((input.tapQueue.has('navLeft') || input.tapQueue.has('navRight')) && ui.chat.buttons && ui.chat.buttons.length) {
            const n = ui.chat.buttons.length;
            ui.chatGp = (ui.chatGp + (input.tapQueue.has('navRight') ? 1 : -1) + n) % n;
          }
          if (input.tapQueue.has('confirm')) {
            if (ui.chat.buttons && ui.chat.buttons[ui.chatGp]) {
              const b = ui.chat.buttons[ui.chatGp];
              if (b.action === 'acceptBattle') acceptBattle();
              else declineBattle();
            } else {
              closeChat();
            }
          }
          if (input.tapQueue.has('cancel')) {
            if (ui.chat.battle) declineBattle();
            else closeChat();
          }
        } else if (ui.panel !== 'none') {
          if ((input.tapQueue.has('navUp') || input.tapQueue.has('navDown')) && ui.items.length) {
            const d = input.tapQueue.has('navDown') ? 1 : -1;
            ui.gpIndex = utils.clamp((ui.gpIndex || 0) + d, 0, ui.items.length - 1);
            if (ui.maxScroll > 0) {
              const row = ui.items[ui.gpIndex];
              const pm = panelMetrics();
              if (row && row.y > pm.py + pm.panelH - 60) ui.scroll = utils.clamp(ui.scroll + 52, 0, ui.maxScroll);
              else if (row && row.y < pm.py + 90) ui.scroll = utils.clamp(ui.scroll - 52, 0, ui.maxScroll);
              buildPanelRows();
            }
          }
          if (input.tapQueue.has('confirm') && ui.items[ui.gpIndex]) {
            const row = ui.items[ui.gpIndex];
            uiClick(row.x + row.w / 2, row.y + row.h / 2);
          }
          if (input.tapQueue.has('cancel')) closePanel();
        } else if (ui.hapticsPanel && state.screen === 'paused') {
          hapticsNav(input.tapQueue);
        } else if (input.tapQueue.has('confirm') && state.screen !== 'playing') {
          const bs = overlayButtons();
          if (bs[0]) { bs[0].action(); input.dashTap = false; } // 开始/暂停/结算界面按确认键启动
        }
        input.tapQueue.clear();
      }
      if (input.pressedSet.size) {
        if (input.pressedSet.has('Escape')) {
          if (ui.hapticsPanel) {
            ui.hapticsPanel = false;
          } else if (ui.panel !== 'none') {
            closePanel();
          } else if (state.screen === 'playing') {
            setScreen('paused');
          } else if (state.screen === 'paused') {
            setScreen('playing');
          }
        }
        if (input.pressedSet.has('Enter') &&
            (state.screen === 'start' || state.screen === 'dead' || state.screen === 'win')) {
          beginRun();
        }
        if (input.pressedSet.has('KeyB')) {
          if (ui.panel !== 'none') closePanel();
          else openPanel('parts');
        }
        if (input.pressedSet.has('KeyE')) {
          if (ui.panel !== 'none') {
            closePanel();
          } else {
            const p = world.player;
            if (world.startNpc &&
                utils.distance(p.x, p.y, world.startNpc.x, world.startNpc.y) < 100) {
              ui.chat = {
                name: '作者 awa_cw', color: '#ff4d5e',
                lines: ['感谢你游玩枪械工艺，我是作者awa_cw'],
                showOptions: false
              };
              state.paused = true;
              audio.play('ui');
            } else if (world.forgeNpc &&
                utils.distance(p.x, p.y, world.forgeNpc.x, world.forgeNpc.y) < 110) {
              if (world.room.forgeTalked) {
                openPanel('forgeMenu');
              } else {
                world.room.forgeTalked = true;
                ui.chat = {
                  name: '锻造师', color: '#b06cff',
                  lines: ['你好，我是这里唯一的锻造师，我可以为你物品进行"属性强化"、"属性重组"'],
                  showOptions: true
                };
                state.paused = true;
                audio.play('ui');
              }
            } else if (world.chest && !world.chest.opened &&
                utils.distance(p.x, p.y, world.chest.x, world.chest.y) < 100) {
              world.chestPart = world.chest.part;
              openPanel('chest');
            } else if (world.coinPile && !world.coinPile.collected &&
                utils.distance(p.x, p.y, world.coinPile.x, world.coinPile.y) < 90) {
              world.coins += world.coinPile.amount;
              world.coinPile.collected = true;
              fx.floater(p.x, p.y - 30, '+' + world.coinPile.amount + ' 金币', 'crit');
              audio.play('chest');
            } else if (portalVisible() && world.portal.active &&
                utils.distance(p.x, p.y, world.portal.x, world.portal.y) < 90) {
              world.portal = null;
              world.transition = { active: true, t: 0, rx: 'next', ry: 0 };
              audio.play('door');
            } else if (world.shopPos && world.shopOffers.length &&
                utils.distance(p.x, p.y, world.shopPos.x, world.shopPos.y) < 120) {
              openPanel('shop');
            }
          }
        }
        if (input.pressedSet.has('Digit1')) { world.activeGun = 0; haptics.event('switchGun'); }
        if (input.pressedSet.has('Digit2')) { world.activeGun = 1; haptics.event('switchGun'); }
        input.pressedSet.clear();
      }
      if (world.startNpc && world.startNpc.state === 'transform') {
        const n = world.startNpc;
        n.transformT += dt;
        n.scale = 1 + 2 * Math.min(1, n.transformT / 1.2);
        if (n.transformT >= 1.2) spawnAuthorBoss();
      }
      if (world.transition.active) {
        world.transition.t += dt;
        if (world.transition.t >= 0.6) {
          world.transition.active = false;
          if (world.transition.rx === 'next') advanceLayer();
          else enterRoom(world.transition.rx, world.transition.ry, world.transition.dir);
        }
        return;
      }
      if (state.paused || state.screen === 'dead' || state.screen === 'win') return;
      if (fx.hitStopMs > 0) {
        fx.hitStopMs -= dt * 1000;
        return;
      }
      if (fx.slowmoT > 0) {
        fx.slowmoT -= dt;
        dt *= fx.slowmoFactor;
      } else if ((input.keys.has('Space') || (input.gp && input.gp.aim)) && state.screen === 'playing' && !world.dash.active) {
        dt *= 0.35; // 按住空格进入慢动作瞄准
      }
      const p = world.player;
      const gp = input.gp;
      input.mouse.down = !!(input.mouseHard || input.touch.firing || (gp && gp.fire));
      if (input.touch.aimId !== null) {
        input.mouse.x = input.touch.aimPos.x;
        input.mouse.y = input.touch.aimPos.y;
      }
      const stickAim = gp && (Math.abs(gp.ax) > 0.2 || Math.abs(gp.ay) > 0.2);
      if (input.padInput && gp && (stickAim || gp.fire)) {
        // 手柄：右摇杆定方向，开火时辅助瞄准吸附（同手机端），平滑转向
        let desired = stickAim ? Math.atan2(gp.ay, gp.ax) : p.aimAngle;
        if (gp.fire) {
          const target = assistAim(p, p.x + Math.cos(p.aimAngle) * 220, p.y + Math.sin(p.aimAngle) * 220);
          if (target !== null) desired = target;
        }
        let diff = desired - p.aimAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        p.aimAngle += utils.clamp(diff, -8 * dt, 8 * dt); // 平滑转向，不生硬
      } else if (!input.padInput) {
        // 键鼠模式（含手柄仍连接但已切回键鼠）：面向鼠标
        const mx = sxToWx(input.mouse.x);
        const my = syToWy(input.mouse.y);
        const manualAngle = Math.atan2(my - p.y, mx - p.x);
        if (isTouchUI && input.touch.firing) {
          const target = assistAim(p, mx, my);
          const desired = target !== null ? target : manualAngle;
          let diff = desired - p.aimAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          p.aimAngle += utils.clamp(diff, -8 * dt, 8 * dt); // 平滑转向，不生硬
        } else {
          p.aimAngle = manualAngle;
        }
      }

      let dx = 0, dy = 0;
      if (input.keys.has('KeyW')) dy -= 1;
      if (input.keys.has('KeyS')) dy += 1;
      if (input.keys.has('KeyA')) dx -= 1;
      if (input.keys.has('KeyD')) dx += 1;
      if (gp) { dx += gp.lx; dy += gp.ly; }
      if (input.touch.moveId !== null) {
        dx += input.touch.moveVec.x / 60;
        dy += input.touch.moveVec.y / 60;
      }
      let moveX = 0, moveY = 0;
      if (dx || dy) {
        const l = Math.hypot(dx, dy);
        moveX = dx / l;
        moveY = dy / l;
      }
      // 惯性滑动：加速到上限，松键后自然衰减
      const ACCEL = 1500;
      p.vx += moveX * ACCEL * dt;
      p.vy += moveY * ACCEL * dt;
      const maxSpd = p.speed * ((p.armorSpec && p.armorSpec.speedMul) || 1) * (p.slowT > 0 ? (1 - (p.slowPct || 0)) : 1);
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > maxSpd) {
        p.vx = (p.vx / spd) * maxSpd;
        p.vy = (p.vy / spd) * maxSpd;
      }
      const damp = Math.exp(-5.5 * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);

      // 瞬身：空格+左键向准星方向短距离滑步
      const dash = world.dash;
      const dashPrevCd = dash.cd;
      dash.cd = Math.max(0, dash.cd - dt);
      if (dashPrevCd > 0 && dash.cd <= 0) haptics.event('dashReady');
      if (dash.active) {
        dash.t -= dt;
        p.x += Math.cos(dash.angle) * 1400 * dt;
        p.y += Math.sin(dash.angle) * 1400 * dt;
        for (let s = 0; s < 2; s++) {
          fx.spawn({
            kind: 'dash', x: p.x + utils.rand(-5, 5), y: p.y + utils.rand(-5, 5),
            vx: -Math.cos(dash.angle) * 240, vy: -Math.sin(dash.angle) * 240,
            life: 0.28, color: '#35e0ff', size: 7 + Math.random() * 6, angle: dash.angle
          });
        }
        pushObstaclesWithPlayer();
        dash.ghostT += dt;
        if (dash.ghostT > 0.02) {
          dash.ghostT = 0;
          world.dashGhosts.push({
            x: p.x, y: p.y, angle: p.aimAngle,
            life: 0.3, maxLife: 0.3, color: '#35e0ff'
          });
          if (world.dashGhosts.length > 12) world.dashGhosts.shift();
        }
        if (dash.t <= 0) dash.active = false;
      }
      if (((input.mouse.down && !input.mouse.downPrev && input.keys.has('Space')) || input.dashTap) &&
          dash.cd <= 0 && !dash.active && state.screen === 'playing') {
        if (input.padInput) {
          const gp2 = input.gp;
          if (gp2 && (gp2.lx !== 0 || gp2.ly !== 0)) {
            dash.angle = Math.atan2(gp2.ly, gp2.lx); // 手柄模式：瞬身朝左摇杆方向
          } else {
            dash.angle = p.aimAngle; // 左摇杆未推时退回准星方向
          }
        } else {
          const mxw = sxToWx(input.mouse.x);
          const myw = syToWy(input.mouse.y);
          dash.angle = Math.atan2(myw - p.y, mxw - p.x);
        }
        dash.active = true;
        dash.t = 0.13;
        dash.cd = 3 * ((p.armorSpec && p.armorSpec.dashCdMul) || 1);
        p.invuln = 0.25;
        audio.play('dash');
        haptics.event('dash', { angle: dash.angle });
      }
      input.dashTap = false;
      input.mouse.downPrev = input.mouse.down;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);
      const resP = resolveObstaclesFor(p.x, p.y, p.radius);
      p.x = resP.x;
      p.y = resP.y;

      updateGun(dt);
      updateBullets(dt);
      updateEnemies(dt);
      separateEnemies();
      checkRoomProgress();
      checkDoors(dt);
      const curRoom = world.room;
      if (curRoom.waveState === 'countdown') {
        curRoom.waveT -= dt;
        if (curRoom.waveT <= 0) {
          curRoom.waveState = 'active';
          haptics.event('wave');
          spawnWaveEnemies(curRoom, curRoom.waveCounts[curRoom.waveIndex], curRoom.waveSpawns);
          curRoom.waveSpawns = [];
          curRoom.waveIndex++;
          setBanner('第 ' + curRoom.waveIndex + ' 波 / 共 ' + curRoom.waveTotal + ' 波', 1.4);
        }
      }
      if (curRoom.alertT > 0) curRoom.alertT -= dt;
      if (curRoom.obstacleReveal !== undefined && curRoom.obstacleReveal < 999) curRoom.obstacleReveal += dt;
      world.banner.t += dt;
      updatePoisonZones(dt);
      updateParticles(dt);
      updateCasings(dt);
      updateTracers(dt);
      updateFloaters(dt);
      updatePickups(dt);
      if (world.coinRain && world.coinRain.active) {
        const cr = world.coinRain;
        cr.t -= dt;
        if (cr.t <= 0) {
          cr.t = 0.15;
          const n = Math.min(cr.batchSize, cr.pending);
          for (let i = 0; i < n; i++) {
            spawnPickup('coin', cr.x + utils.rand(-30, 30), cr.y + utils.rand(-30, 30), 1, 1.5, 1);
          }
          cr.pending -= n;
          if (cr.pending <= 0) cr.active = false;
        }
      }
      updateChains(dt);
      updateDashGhosts(dt);
      updateImpactMarks(dt);
      updateObstacles(dt);
      if (world.portal && !world.portal.active) {
        world.portal.t += dt;
        if (world.portal.t >= 1.2) world.portal.active = true;
      }

      p.invuln -= dt;
      fx.shakePower *= Math.exp(-6 * dt);
      if (p.hp < world.hpDelay) world.hpDelay = Math.max(p.hp, world.hpDelay - 26 * dt);
      else world.hpDelay = p.hp;
      if (p.maxArmor > 0) {
        const as = p.armorSpec || {};
        if (as.hpRegen) p.hp = Math.min(p.maxHp, p.hp + as.hpRegen * dt);
        let rm = as.regenMul || 1;
        if (as.echoSurge) {
          if (as.echoSurgeT > 0) { as.echoSurgeT -= dt; rm *= 2; }
        }
        world.armorTick += dt;
        if (world.armorTick >= 2.4999) { // 回复频率降低150%（间隔×2.5）
          world.armorTick -= 2.5;
          const amount = (6 * rm + (as.regenFlat || 0)) * 2.5 * 0.36; // 每次回复值再 -40%（累计 -64%）
          p.armor = Math.min(p.maxArmor, p.armor + amount);
        }
      }
      if (p.burnT > 0) { p.burnT -= dt; applyRawDamage(p.burnDps * dt, true); }
      if (p.poisonT > 0) { p.poisonT -= dt; applyRawDamage(p.poisonDps * dt, false); }
      if (p.bleedT > 0) {
        p.bleedT -= dt;
        p.hp -= p.bleedDps * dt; // 流血无视护甲
        if (p.hp <= 0) { p.hp = 0; if (world.fightNpc) restart(); else setScreen('dead'); }
      }
      if (p.slowT > 0) { p.slowT -= dt; }
      if (state.screen === 'playing' && p.hp > 0 && p.hp < p.maxHp * 0.3) {
        world.lowhpT -= dt;
        if (world.lowhpT <= 0) {
          world.lowhpT = 0.85;
          audio.play('lowhp');
          haptics.event('lowhp');
        }
      }

      // 视角：手柄模式始终以玩家为中心；键鼠模式随准星走（偏向鼠标方向 32%）
      const r = world.room;
      const halfW = view.w / 2 / ZOOM, halfH = view.h / 2 / ZOOM;
      const minX = halfW >= r.w / 2 ? r.w / 2 : halfW;
      const maxX = halfW >= r.w / 2 ? r.w / 2 : r.w - halfW;
      const minY = halfH >= r.h / 2 ? r.h / 2 : halfH;
      const maxY = halfH >= r.h / 2 ? r.h / 2 : r.h - halfH;
      let tx, ty;
      if (input.padInput) {
        tx = p.x; ty = p.y; // 手柄模式：视角固定在玩家身上
      } else {
        const mxw = sxToWx(input.mouse.x);
        const myw = syToWy(input.mouse.y);
        tx = utils.clamp(p.x + (mxw - p.x) * 0.32, minX, maxX);
        ty = utils.clamp(p.y + (myw - p.y) * 0.32, minY, maxY);
      }
      camera.x += (tx - camera.x) * Math.min(1, 8 * dt);
      camera.y += (ty - camera.y) * Math.min(1, 8 * dt);
      world.time += dt;
    }

    function assistAim(p, mx, my) {
      const aimDir = Math.atan2(my - p.y, mx - p.x);
      let best = null, bestScore = 1e9;
      for (const e of world.enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d > 900) continue;
        const ang = Math.atan2(e.y - p.y, e.x - p.x);
        let diff = Math.abs(ang - aimDir);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff < Math.PI / 3) {
          const score = d + diff * 250;
          if (score < bestScore) { bestScore = score; best = ang; }
        }
      }
      return best;
    }

    function fireOnce(g) {
      const p = world.player;
      const st = g.stats;
      const muzzleX = p.x + Math.cos(p.aimAngle) * 22;
      const muzzleY = p.y + Math.sin(p.aimAngle) * 22;
      const baseAngle = p.aimAngle + (Math.random() - 0.5) * 2 * st.spread;
      let shotDmg = st.damage;
      if (st.empower) {
        world.shotCounter = (world.shotCounter || 0) + 1;
        if (world.shotCounter % 4 === 0) shotDmg *= 2;
      }
      const burst = st.burst || 1;
      for (let bi = 0; bi < burst; bi++) {
      for (let i = 0; i < st.pellet; i++) {
        const a = baseAngle + (i - (st.pellet - 1) / 2) * 0.04 + (bi - (burst - 1) / 2) * 0.02;
        const bx = muzzleX + Math.cos(p.aimAngle) * bi * 9;
        const by = muzzleY + Math.sin(p.aimAngle) * bi * 9;
        world.bullets.push({
          x: bx, y: by,
          px: bx, py: by,
          vx: Math.cos(a) * st.bulletSpeed,
          vy: Math.sin(a) * st.bulletSpeed,
          speed: st.bulletSpeed,
          damage: shotDmg,
          pierce: st.pierce,
          friendly: true,
          life: 1.2 * ((PARTS.body[g.parts.body.id].base.lifeMul) || 1),
          color: '#ffd166',
          size: 3,
          kind: 'standard',
          split: st.splitCount,
          boomR: st.explosionRadius,
          homing: st.homing,
          chain: st.chain,
          fx: {
            critChance: st.critChance, critMult: st.critMult,
            burnDps: st.burnDps, burnT: st.burnT,
            slowPct: st.slowPct, slowT: st.slowT,
            vamp: st.vamp,
            shieldDmg: st.shieldDmg, lifestealOnHit: st.lifestealOnHit,
            frozenT: st.frozenT
          },
          bounce: st.bounce || 0,
          fireZone: !!st.fireZone
        });
      }
      }
      fx.muzzle(muzzleX, muzzleY, p.aimAngle, '#ffd166');
      fx.casing(p.x, p.y, p.aimAngle);
      fx.smoke(muzzleX, muzzleY);
      world.tracers.push({
        x0: muzzleX, y0: muzzleY,
        x1: muzzleX + Math.cos(p.aimAngle) * 46,
        y1: muzzleY + Math.sin(p.aimAngle) * 46,
        life: 0.09, color: '#ffd166'
      });
      p.recoil = Math.min(1, p.recoil + (GUN_RECOIL[g.parts.body.id] || 0.35) * (st.recoilMul || 1));
      audio.play(GUN_SOUNDS[g.parts.body.id] || 'pistol');
      haptics.fire(g.parts.body.id);
    }

    function updateGun(dt) {
      const p = world.player;
      if (input.wheelDelta !== 0) {
        world.activeGun = (world.activeGun + (input.wheelDelta > 0 ? 1 : -1) + 2) % 2;
        input.wheelDelta = 0;
        haptics.event('switchGun');
      }

      const g = gun();
      g.cooldown -= dt;
      if (g.reloading) {
        g.reloadT -= dt;
        if (g.reloadT <= 0) {
          g.reloading = false;
          g.mag = g.stats.magSize;
          audio.play('reload_done');
          haptics.event('reloadDone', { bodyId: g.parts.body.id });
        }
      }
      if ((input.pressedSet.has('KeyR') || input.keys.has('KeyR')) && !g.reloading && g.mag < g.stats.magSize) {
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
        haptics.event('reloadStart');
      }
      if (g.mag <= 0 && !g.reloading) { // 自动换弹
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
        haptics.event('reloadStart');
        if (input.mouse.down) haptics.event('dryfire');
      }
      if (input.mouse.down && !world.dash.active && !g.reloading && g.mag > 0 && g.cooldown <= 0) {
        g.cooldown = 1 / g.stats.fireRate;
        g.mag--;
        fireOnce(g);
      }
      p.recoil *= Math.pow(0.0001, dt);
    }

    function updateBullets(dt) {
      const r = world.room;
      const p = world.player;
      for (let i = world.bullets.length - 1; i >= 0; i--) {
        const b = world.bullets[i];
        if (b.friendly && b.homing) {
          let nearest = null, nd = 1e9;
          for (const e of world.enemies) {
            if (e.dead) continue;
            const d = Math.hypot(e.x - b.x, e.y - b.y);
            if (d < nd) { nd = d; nearest = e; }
          }
          if (nearest) {
            const cur = Math.atan2(b.vy, b.vx);
            const want = Math.atan2(nearest.y - b.y, nearest.x - b.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const turn = utils.clamp(diff, -4 * dt, 4 * dt);
            const sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(cur + turn) * sp;
            b.vy = Math.sin(cur + turn) * sp;
          }
        }
        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0) {
          if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
          if (b.fireZone) spawnFlameZone(b.x, b.y);
          utils.swapRemove(world.bullets, i);
          continue;
        }
        if (b.friendly && b.bounce > 0) {
          let bounced = false;
          if (b.x < r.x + 6 || b.x > r.w - 6) { b.vx *= -1; bounced = true; }
          if (b.y < r.y + 6 || b.y > r.h - 6) { b.vy *= -1; bounced = true; }
          if (bounced) b.bounce--;
        }
        if (b.x < r.x - 40 || b.x > r.w + 40 || b.y < r.y - 40 || b.y > r.h + 40) {
          if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
          if (b.fireZone) spawnFlameZone(b.x, b.y);
          utils.swapRemove(world.bullets, i);
          continue;
        }
        const obs = world.room.obstacles || [];
        let hitObs = false;
        let hitObj = null;
        for (const o of obs) {
          if (utils.circleRectHit(b.x, b.y, b.size, o)) {
            fx.sparks(b.x, b.y, '#8fa6b8', 4);
            world.impactMarks.push({ x: b.x, y: b.y, life: 2.5, color: b.color });
            hitObs = true;
            hitObj = o;
            break;
          }
        }
        if (hitObs) {
          if (hitObj) {
            const bd = b.damage || 1;
            hitObj.hp -= bd;
            const kx = Math.cos(Math.atan2(b.vy, b.vx));
            const ky = Math.sin(Math.atan2(b.vy, b.vx));
            const knock = bd < 30 ? 40 : 12;
            hitObj.kvx += kx * knock;
            hitObj.kvy += ky * knock;
            hitObj.vr += (Math.random() - 0.5) * (bd < 30 ? 10 : 4);
            if (hitObj.hp <= 0) splitObstacle(hitObj);
          }
          if (b.friendly && b.bounce > 0) {
            b.bounce--;
            b.vx = -b.vx;
            b.vy = -b.vy;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
          } else {
            if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
            if (b.fireZone) spawnFlameZone(b.x, b.y);
            utils.swapRemove(world.bullets, i);
          }
          continue;
        }
        if (b.friendly) {
          const sn = world.startNpc;
          if (sn && sn.state === 'idle' && Math.hypot(sn.x - b.x, sn.y - b.y) < 18 + b.size) {
            promptNpcBattle();
            utils.swapRemove(world.bullets, i);
            continue;
          }
          for (let j = 0; j < world.enemies.length; j++) {
            const e = world.enemies[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.size) {
              const hitAngle = Math.atan2(b.vy, b.vx);
              damageEnemy(e, b.damage, hitAngle, b.fx);
              if (b.boomR > 0) {
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  if (Math.hypot(e2.x - b.x, e2.y - b.y) <= b.boomR + e2.radius) {
                    damageEnemy(e2, b.damage * 0.8, Math.atan2(e2.y - b.y, e2.x - b.x), b.fx);
                  }
                }
                fx.burst(b.x, b.y, '#ff8f3d', 14);
                fx.shake(5);
                audio.play('boom');
              }
              if (b.chain > 0) {
                let best = null, bd = 90;
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  const d = Math.hypot(e2.x - b.x, e2.y - b.y);
                  if (d < bd) { bd = d; best = e2; }
                }
                if (best) {
                  damageEnemy(best, b.damage * 0.5, Math.atan2(best.y - b.y, best.x - b.x), b.fx);
                  world.chains.push({ x1: b.x, y1: b.y, x2: best.x, y2: best.y, life: 0.12 });
                  audio.play('zap');
                }
              }
              if (b.split > 0) {
                for (let s = 0; s < b.split; s++) {
                  const a = hitAngle + (s - (b.split - 1) / 2) * 0.3;
                  world.bullets.push({
                    x: b.x, y: b.y,
                    px: b.x, py: b.y,
                    vx: Math.cos(a) * b.speed * 0.9,
                    vy: Math.sin(a) * b.speed * 0.9,
                    speed: b.speed * 0.9,
                    damage: b.damage * 0.4,
                    pierce: 0,
                    friendly: true,
                    life: 0.55,
                    color: b.color,
                    size: 2.2,
                    kind: 'fragment',
                    split: 0, boomR: 0, homing: false, chain: 0,
                    fx: b.fx
                  });
                }
              }

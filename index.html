      for (let i = position; i <= 9; i++) {
        forceZones |= forceValue << (3 * i); // 3bit/区，uint32 累加可跨字节
        activeZones |= 1 << i;
      }
      b[1] = activeZones & 0xff;
      b[2] = (activeZones >> 8) & 0xff;
      b[3] = forceZones & 0xff;
      b[4] = (forceZones >> 8) & 0xff;
      b[5] = (forceZones >> 16) & 0xff;
      b[6] = (forceZones >> 24) & 0xff;
      return b;
    }
    function weaponBlock(start, end, strength) {
      const b = new Uint8Array(11);

      end = Math.max(start + 1, Math.min(8, end | 0));
      b[1] = (1 << start) & 0xff;
      b[2] = (1 << end) & 0xff;
      b[3] = Math.max(0, Math.min(7, (strength | 0) - 1));
      return b;
    }
    function vibrationBlock(position, amplitude, frequency) {

      let ampZones = 0, activeZones = 0;
      for (let i = position; i <= 9; i++) {

        activeZones |= 1 << i;
      }
      b[1] = activeZones & 0xff;
      b[2] = (activeZones >> 8) & 0xff;
      b[3] = ampZones & 0xff;
      b[4] = (ampZones >> 8) & 0xff;
      b[5] = (ampZones >> 16) & 0xff;

          if (!dev) {
            try {
              const picked = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x054c, productId: 0x0ce6 }, { vendorId: 0x054c, productId: 0x0df2 }] });
              dev = (picked && picked[0]) || null;
            } catch (e) {}
          }
          if (!dev) { mode = 'std'; return false; }
          const ok = await openDevice(dev);
          if (ok) {
            speakerSfx.init();
            haptics.event('connectOk');
          }
          return ok;
        } catch (e) { fallback(); return false; }
      }
      async function reconnect() {
        if (typeof navigator === 'undefined' || !navigator.hid || !navigator.hid.getDevices) return false;
        try {
          const devs = await navigator.hid.getDevices();
          const dev = (devs || []).find(isDS);
          if (dev) return await openDevice(dev);
        } catch (e) {}
        return false;
      }
      function frame(dt) {
        if (mode !== 'hid') return;
        if (reconnectT > 0) {
          reconnectT -= dt;
          if (reconnectT <= 0) {
            reconnectT = 0;
            reconnect();
          }
        }
        const g = gun();
        const feel = (g && TRIGGER_FEEL[g.parts.body.id]) || TRIGGER_FEEL.pistol_body;
        const gp = input.gp;
        const pull = gp ? clamp01(gp.trig || 0) : 0;
        const firing = !!(input.mouse.down || (gp && gp.fire) || input.touch.firing);
        let block = null;
        const pulse = haptics.pulse;
        if (pulse && pulse.block && pulse.t > 0) block = pulse.block;
        else if (pull <= 0.001) block = offBlock();
        else if (feel.fireSustain && firing) block = feel.fireSustain;
        else block = feel.rest(pull, firing);
        setTrigger('r2', block);
        setTrigger('l2', (gp && gp.aim) ? feedbackBlock(4, 2) : offBlock());
        write();
      }
      function zero() {
        r2Block = offBlock(); l2Block = offBlock();
        rumbleA = 0; rumbleB = 0;
        lastPayload = '';
        write();
      }
      function flush() { lastWriteAt = 0; lastPayload = ''; }
      return {
        connect: connect, reconnect: reconnect, frame: frame, zero: zero, flush: flush,
        setTrigger: setTrigger, setRumble: setRumble, setSpeaker: setSpeaker,
        channel: function () { return mode; },
        blocks: { feedbackBlock: feedbackBlock, weaponBlock: weaponBlock, vibrationBlock: vibrationBlock, offBlock: offBlock },
        btChecksum: crc32,
        getState: function () { return { mode: mode, r2: r2Block.slice(), l2: l2Block.slice(), rumbleA: rumbleA, rumbleB: rumbleB }; }
      };
    })();

    // ---- 事件震动管理器（优先级合并 / 方向偏置 / 低血量心跳 / 标准通道降级）----
    const haptics = (() => {
      const pending = [];
      const pulseBox = { block: null, t: 0 };
      let rumbleState = { s: 0, w: 0, t: 0, pri: 0 };
      let sustain = { active: false, lastAt: 0, s: 0, w: 0, trigger: 0.4 };
      let sustainLevel = 0;
      let stdSustainTimer = 0;
      function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
      function normAng(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
      function stdPad() {
        try {
          if (typeof navigator === 'undefined' || !navigator.getGamepads) return null;
          const gps = navigator.getGamepads();
          return (gps && gps[0]) || null;
        } catch (e) { return null; }
      }
      function stdRumble(s, w, dur) {
        const gp = stdPad();
        const act = gp && gp.vibrationActuator;
        if (!act || !act.playEffect) return;
        try { act.playEffect('dual-rumble', { duration: Math.max(20, dur | 0), strongMagnitude: clamp01(s), weakMagnitude: clamp01(w) }); } catch (e) {}
      }
      function stdTrigger(strength, dur) {
        const gp = stdPad();
        const act = gp && gp.vibrationActuator;
        if (!act || !act.playEffect) return;
        try { act.playEffect('trigger-rumble', { duration: Math.max(20, dur | 0), leftTrigger: 0, rightTrigger: clamp01(strength) }); } catch (e) {}
      }
      function rumbleForce(s, w, dur) {
        rumbleState.s = clamp01(s); rumbleState.w = clamp01(w);
        rumbleState.t = Math.max(20, dur | 0); rumbleState.pri = 0;
        if (dualsense.channel() !== 'hid') stdRumble(s, w, dur);
      }
      function rumble(s, w, dur, opts) {
        const o = opts || {};
        const pri = o.priority || 0;
        if (rumbleState.t > 0 && pri < rumbleState.pri) return;
        const mult = clamp01(hapticsSettings.vibration || 0.85);
        let s2 = clamp01(s * mult), w2 = clamp01(w * mult);
        if (o.mul) { s2 = clamp01(s2 * o.mul); w2 = clamp01(w2 * o.mul); }
        if (o.angle !== undefined) {
          const rel = normAng(o.angle - world.player.aimAngle);
          if (rel > 0) { s2 = clamp01(s2 * 0.7); w2 = clamp01(w2 * 1.25); }
          else { s2 = clamp01(s2 * 1.25); w2 = clamp01(w2 * 0.7); }
        }
        rumbleState.s = Math.max(rumbleState.s, s2);
        rumbleState.w = Math.max(rumbleState.w, w2);
        rumbleState.t = Math.max(rumbleState.t, Math.max(20, dur | 0));
        rumbleState.pri = Math.max(rumbleState.pri, pri);
        if (dualsense.channel() !== 'hid') stdRumble(s2, w2, dur);
      }
      function clear() { rumbleState.s = 0; rumbleState.w = 0; rumbleState.t = 0; rumbleState.pri = 0; pending.length = 0; pulseBox.block = null; pulseBox.t = 0; }
      function schedule(fn, delayMs) { pending.push({ fn: fn, t: delayMs }); }
      function fire(bodyId) {
        const feel = TRIGGER_FEEL[bodyId];
        if (!feel) return;
        const m = clamp01(hapticsSettings.vibration || 0.85);
        if (feel.rumblePulses) {
          for (const rp of feel.rumblePulses) {
            const s = clamp01(rp.s * m), w = clamp01(rp.w * m), d = rp.d, delay = rp.delay || 0;
            if (delay > 0) schedule(function () { rumbleForce(s, w, d); }, delay);
            else rumbleForce(s, w, d);
          }
        }
        if (feel.sustain) { sustain = { active: true, lastAt: now(), s: feel.sustain.s, w: feel.sustain.w, trigger: (feel.std && feel.std.trigger) || 0.4 }; }
        if (feel.firePulses) {
          for (const fp of feel.firePulses) {
            const delay = fp.delay || 0;
            if (delay > 0) schedule(function () { pulseBox.block = fp.block; pulseBox.t = fp.ms / 1000; }, delay);
            else { pulseBox.block = fp.block; pulseBox.t = fp.ms / 1000; }
          }
        }
        if (feel.std && dualsense.channel() !== 'hid') {
          if (feel.std.trigger && feel.std.ms) stdTrigger(feel.std.trigger, feel.std.ms);
        }
      }
      function pumpRack(bodyId) {
        const feel = TRIGGER_FEEL[bodyId];
        if (!feel || !feel.reloadPulses) return;
        for (const rp of feel.reloadPulses) {
          pulseBox.block = rp.block;
          pulseBox.t = rp.ms / 1000;
        }
        if (feel.std && dualsense.channel() !== 'hid') stdTrigger(feel.std.trigger, 120);
      }
      function event(name, o) {
        const opt = o || {};
        switch (name) {
          case 'hit': rumble(0.25, 0.10, 60, { priority: 1 }); break;
          case 'crit': {
            let mul = 1;
            try {
              const g = gun();
              const feel = g && TRIGGER_FEEL[g.parts.body.id];
              if (feel && feel.critMul) mul = feel.critMul;
            } catch (e) {}
            rumble(0.50, 0.30, 120, { priority: 2, mul: mul });
            schedule(function () { rumbleForce(clamp01(0.30 * mul), clamp01(0.18 * mul), 90); }, 60);
            break;
          }
          case 'kill':
            rumble(0.70, 0.50, 200, { priority: 4 });
            schedule(function () { rumbleForce(0.35, 0.25, 150); }, 110);
            speakerSfx.play('kill');
            break;
          case 'boss':
            rumble(0.90, 0.70, 600, { priority: 5 });
            speakerSfx.play('boss');
            break;
          case 'playerHit':
            rumble(0.80, 0.60, 350, { priority: 3, angle: opt.angle });
            break;
          case 'reloadStart':
            rumble(0.15, 0.00, 50, { priority: 1 });
            speakerSfx.play('reloadStart');
            break;
          case 'reloadDone':
            rumble(0.40, 0.25, 160, { priority: 1 });
            speakerSfx.play('reloadDone');
            if (opt.bodyId) pumpRack(opt.bodyId);
            break;
          case 'dryfire':
            rumble(0.08, 0.00, 30, { priority: 0 });
            speakerSfx.play('dryfire');
            break;
          case 'dash':
            rumble(0.50, 0.30, 200, { priority: 3, angle: opt.angle });
            speakerSfx.play('dash');
            break;
          case 'dashReady':
            if (hapticsSettings.dashReady) rumble(0.10, 0.00, 40, { priority: 0 });
            break;
          case 'lowhp':
            rumble(0.45, 0.30, 180, { priority: 2 });
            schedule(function () { rumbleForce(0.30, 0.20, 140); }, 260);
            speakerSfx.play('lowhp');
            break;
          case 'coin': rumble(0.08, 0.05, 40, { priority: 0 }); break;
          case 'buy': rumble(0.35, 0.20, 200, { priority: 2 }); break;
          case 'switchGun': rumble(0.12, 0.00, 60, { priority: 0 }); break;
          case 'wave':
            rumble(0.40, 0.20, 150, { priority: 2 });
            schedule(function () { rumbleForce(0.25, 0.12, 120); }, 140);
            break;
          case 'victory':
            rumble(0.50, 0.30, 300, { priority: 2 });
            schedule(function () { rumbleForce(0.60, 0.40, 300); }, 300);
            schedule(function () { rumbleForce(0.70, 0.50, 300); }, 600);
            break;
          case 'death':
            rumble(0.90, 0.80, 800, { priority: 5 });
            schedule(function () { rumbleForce(0.50, 0.40, 400); }, 400);
            break;
          case 'npcChallenge':
            rumble(0.90, 0.70, 500, { priority: 5 });
            speakerSfx.play('boss');
            break;
          case 'connectOk':
            rumble(0.50, 0.30, 200, { priority: 2 });
            speakerSfx.play('connect');
            break;
        }
      }
      function frame(dt) {
        if (rumbleState.t > 0) {
          rumbleState.t -= dt * 1000;
          if (rumbleState.t <= 0) { rumbleState.s = 0; rumbleState.w = 0; rumbleState.pri = 0; }
          else { const k = Math.exp(-2.2 * dt); rumbleState.s *= k; rumbleState.w *= k; }
        }
        if (sustain.active) {
          if (now() - sustain.lastAt > 120) sustain.active = false;
        }
        sustainLevel = sustain.active ? Math.min(1, sustainLevel + dt * 10) : Math.max(0, sustainLevel - dt * 8);
        if (pulseBox.block) {
          pulseBox.t -= dt;
          if (pulseBox.t <= 0) { pulseBox.block = null; pulseBox.t = 0; }
        }
        for (let i = pending.length - 1; i >= 0; i--) {
          pending[i].t -= dt * 1000;
          if (pending[i].t <= 0) {
            const fn = pending[i].fn;
            pending.splice(i, 1);
            try { fn(); } catch (e) {}
          }
        }
        if (dualsense.channel() === 'hid') {
          dualsense.setRumble(
            Math.round(clamp01(rumbleState.s + sustainLevel * sustain.s) * 255),
            Math.round(clamp01(rumbleState.w + sustainLevel * sustain.w) * 255)
          );
        } else if (sustain.active) {
          stdSustainTimer -= dt;
          if (stdSustainTimer <= 0) {
            stdSustainTimer = 0.4;
            stdRumble(clamp01(rumbleState.s + sustainLevel * sustain.s), clamp01(rumbleState.w + sustainLevel * sustain.w), 400);
            stdTrigger(sustain.trigger, 300);
          }
        } else if (stdSustainTimer !== 0) {
          stdSustainTimer = 0;
        }
      }
      return {
        event: event, fire: fire, frame: frame, rumble: rumble, schedule: schedule, clear: clear,
        pulse: pulseBox,
        get state() { return { s: rumbleState.s, w: rumbleState.w, t: rumbleState.t, pri: rumbleState.pri, sustainLevel: sustainLevel }; },
        settings: hapticsSettings
      };
    })();

    // ---- 手柄设置面板（暂停菜单）----
    const HAPTIC_UI = { sel: 0 };
    function hapticPanelBox() {
      const mobile = isTouchUI;
      const pw = Math.min(560, view.w - 40);
      const ph = mobile ? 356 : 344;
      return { pw: pw, ph: ph, px: view.w / 2 - pw / 2, py: view.h / 2 - ph / 2 };
    }
    function hapticRows() {
      const box = hapticPanelBox();
      const rows = [];
      const y0 = box.py + 96;
      const rowH = 32, gap = 8;
      const mk = (label, y, action, key) => rows.push({ label: label, x: box.px + 16, y: y, w: box.pw - 32, h: rowH, action: action, key: key });
      mk('震动强度   [ - ]   ' + Math.round(hapticsSettings.vibration * 100) + '%   [ + ]', y0, 'vib', 'vibration');
      mk('自适应扳机   [ ' + (hapticsSettings.trigger ? '开' : '关') + ' ]', y0 + rowH + gap, 'toggle', 'trigger');
      mk('手柄扬声器   [ ' + (hapticsSettings.speaker ? '开' : '关') + ' ]', y0 + (rowH + gap) * 2, 'toggle', 'speaker');
      mk('冷却提示震动   [ ' + (hapticsSettings.dashReady ? '开' : '关') + ' ]', y0 + (rowH + gap) * 3, 'toggle', 'dashReady');
      mk(dualsense.channel() === 'hid' ? 'PS5 增强已连接（点击重连）' : '连接 PS5 手柄（增强触觉）', y0 + (rowH + gap) * 4, 'connect', null);
      mk('关闭', y0 + (rowH + gap) * 5, 'close', null);
      return rows;
    }
    function drawHapticsPanel() {
      const box = hapticPanelBox();
      ctx.fillStyle = 'rgba(4, 8, 14, 0.6)';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.fillStyle = '#111827';
      ctx.strokeStyle = '#35e0ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#35e0ff';
      ctx.shadowBlur = 12;
      ctx.fillRect(box.px, box.py, box.pw, box.ph);
      ctx.shadowBlur = 0;
      ctx.strokeRect(box.px, box.py, box.pw, box.ph);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#35e0ff';
      ctx.font = 'bold 16px Consolas, monospace';
      ctx.fillText('手柄体验设置', view.w / 2, box.py + 30);
      ctx.font = '12px Consolas, monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('震动强度 · 自适应扳机 · 扬声器', view.w / 2, box.py + 48);
      ctx.strokeStyle = '#ff4d5e';
      ctx.lineWidth = 2.5;
      const cx = box.px + box.pw - 22, cy = box.py + 20;
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - 7); ctx.lineTo(cx + 7, cy + 7);
      ctx.moveTo(cx + 7, cy - 7); ctx.lineTo(cx - 7, cy + 7);
      ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '12px Consolas, monospace';
      const ch = dualsense.channel() === 'hid' ? '增强（WebHID 自适应扳机）' : dualsense.channel() === 'std' ? '标准震动（降级通道）' : '未连接手柄';
      ctx.fillText('设备通道：' + ch, box.px + 16, box.py + 84);
      const rows = hapticRows();
      rows.forEach((row, idx) => {
        const sel = input.padInput && idx === HAPTIC_UI.sel;
        ctx.fillStyle = sel ? 'rgba(53, 224, 255, 0.16)' : 'rgba(30, 41, 59, 0.9)';
        ctx.fillRect(row.x, row.y, row.w, row.h);
        if (sel) {
          ctx.strokeStyle = '#35e0ff';
          ctx.lineWidth = 1;
          ctx.strokeRect(row.x, row.y, row.w, row.h);
        }
        ctx.fillStyle = '#ffffff';
        ctx.font = '13px Consolas, monospace';
        ctx.fillText(row.label, row.x + 10, row.y + 22);
      });
      ctx.textAlign = 'left';
    }
    function hapticsPanelClick(x, y) {
      const box = hapticPanelBox();
      if (x < box.px || x > box.px + box.pw || y < box.py || y > box.py + box.ph) return false;
      if (x >= box.px + box.pw - 40 && x <= box.px + box.pw - 4 && y >= box.py + 4 && y <= box.py + 36) {
        ui.hapticsPanel = false;
        audio.play('ui');
        return true;
      }
      const rows = hapticRows();
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (x >= row.x && x <= row.x + row.w && y >= row.y && y <= row.y + row.h) {
          HAPTIC_UI.sel = i;
          if (row.action === 'vib') {
            if (x < row.x + row.w / 2) hapticsSettings.vibration = Math.max(0, Math.round((hapticsSettings.vibration - 0.05) * 100) / 100);
            else hapticsSettings.vibration = Math.min(1, Math.round((hapticsSettings.vibration + 0.05) * 100) / 100);
          } else if (row.action === 'toggle') {
            hapticsSettings[row.key] = !hapticsSettings[row.key];
          } else if (row.action === 'connect') {
            dualsense.connect();
            speakerSfx.init();
          } else if (row.action === 'close') {
            ui.hapticsPanel = false;
          }
          saveHapticsSettings();
          audio.play('ui');
          return true;
        }
      }
      return false;
    }
    function hapticsNav(tq) {
      const rows = hapticRows();
      const keys = ['vibration', 'trigger', 'speaker', 'dashReady'];
      if (tq.has('navUp')) HAPTIC_UI.sel = Math.max(0, HAPTIC_UI.sel - 1);
      if (tq.has('navDown')) HAPTIC_UI.sel = Math.min(rows.length - 1, HAPTIC_UI.sel + 1);
      if (tq.has('navLeft') && HAPTIC_UI.sel === 0) hapticsSettings.vibration = Math.max(0, Math.round((hapticsSettings.vibration - 0.05) * 100) / 100);
      if (tq.has('navRight') && HAPTIC_UI.sel === 0) hapticsSettings.vibration = Math.min(1, Math.round((hapticsSettings.vibration + 0.05) * 100) / 100);
      if (tq.has('confirm')) {
        if (HAPTIC_UI.sel === 0) { /* 强度用左右键调整 */ }
        else if (HAPTIC_UI.sel <= 3) hapticsSettings[keys[HAPTIC_UI.sel]] = !hapticsSettings[keys[HAPTIC_UI.sel]];
        else if (HAPTIC_UI.sel === 4) { dualsense.connect(); speakerSfx.init(); }
        else if (HAPTIC_UI.sel === 5) ui.hapticsPanel = false;
      }
      if (tq.has('cancel')) ui.hapticsPanel = false;
      saveHapticsSettings();
      audio.play('ui');
    }


    return {
      world, state, camera, input, fx, ui,
      haptics, dualsense, speakerSfx, TRIGGER_FEEL,
      gun, rebuildGun,
      spawnEnemy, damageEnemy, damagePlayer, killEnemy, maybeDrop,
      equipPart, pushPart, spawnPickup,
      openPanel, closePanel, uiClick, panelMetrics, buildPanelRows, closeChat,
      handleClick, handleTouchPoint, portalVisible, pollGamepad, onMouseMove,
      isTouchUI: () => isTouchUI,
      touchButtons,
      audioDebug: () => audio.sounds(),
      musicStatus: () => {
        if (!bossMusic) return { state: 'idle', song: null };
        const st = bossMusic.getState();
        return { state: st, song: (st === 'intro' || st === 'loop') ? bossMusic.getSong() : null };
      },
      debugSetView(w, h, forceTouch) {
        view.w = w;
        view.h = h;
        if (forceTouch !== undefined) touchMode = !!forceTouch;
        isTouchUI = touchMode || view.w < 780;
      },
      startMap, enterRoom,
      update, render, start, setScreen, restart, beginRun, hudData,
      VERSION
    };
  }

  return { createGame, PARTS, partsEngine, map: mapModule, VERSION };
})();

if (typeof window !== 'undefined') window.Game = Game;

if (typeof window !== 'undefined' && window.document && window.document.body && window.document.body.appendChild) {
  const canvas = window.document.getElementById('game');
  if (canvas) {
    const g = Game.createGame(canvas);
    g.start();
    window.game = g;
  }
}
</script>

              if (b.pierce > 0) {
                b.pierce--;
              } else {
                if (b.fireZone) spawnFlameZone(b.x, b.y);
                utils.swapRemove(world.bullets, i);
              }
              break;
            }
          }
        } else {
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.size) {
            damagePlayer(b.damage, Math.atan2(b.vy, b.vx), b.el);
            if (b.kind === 'poison') spawnPoisonZone(b.x, b.y, 46);
            if (b.fireZone) spawnFlameZone(b.x, b.y);
            utils.swapRemove(world.bullets, i);
          }
        }
      }
    }

    function updateParticles(dt) {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const q = world.particles[i];
        q.life -= dt;
        if (q.life <= 0) { utils.swapRemove(world.particles, i); continue; }
        const damp = Math.exp(-3 * dt);
        q.vx *= damp;
        q.vy *= damp;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        if (q.kind === 'smoke') q.size += 30 * dt;
      }
    }

    function updateCasings(dt) {
      const r = world.room;
      for (let i = world.casings.length - 1; i >= 0; i--) {
        const c = world.casings[i];
        c.life -= dt;
        if (c.life <= 0) { utils.swapRemove(world.casings, i); continue; }
        c.vy += 620 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= Math.exp(-2 * dt);
        if (c.y > r.h - 4) {
          c.y = r.h - 4;
          c.vy *= -0.35;
          c.vx *= 0.7;
        }
        c.rot += c.vr * dt;
      }
    }

    function updateTracers(dt) {
      for (let i = world.tracers.length - 1; i >= 0; i--) {
        world.tracers[i].life -= dt;
        if (world.tracers[i].life <= 0) utils.swapRemove(world.tracers, i);
      }
    }

    function updateFloaters(dt) {
      for (let i = world.floaters.length - 1; i >= 0; i--) {
        const f = world.floaters[i];
        f.life -= dt;
        f.y -= 42 * dt;
        if (f.life <= 0) utils.swapRemove(world.floaters, i);
      }
    }

    function updatePickups(dt) {
      const p = world.player;
      for (let i = world.pickups.length - 1; i >= 0; i--) {
        const k = world.pickups[i];
        k.life -= dt;
        if (k.life <= 0) { utils.swapRemove(world.pickups, i); continue; }
        const d = Math.hypot(p.x - k.x, p.y - k.y);
        if (k.magnetDelay) k.magnetDelay -= dt;
        const clearedM = !!(world.room && world.room.cleared);
        const magnet = k.kind === 'part'
          ? (clearedM && world.inventory.length < 10)
          : k.kind === 'coin'
            ? ((d < 260 || clearedM) && (k.magnetDelay || 0) <= 0)
            : clearedM;
        if (magnet) {
          k.vx += (p.x - k.x) / (d || 1) * 700 * dt;
          k.vy += (p.y - k.y) / (d || 1) * 700 * dt;
          if (Math.random() < dt * 30) {
            fx.spawn({
              kind: 'spark', x: k.x, y: k.y,
              vx: utils.rand(-25, 25), vy: utils.rand(-25, 25),
              life: 0.25, color: k.kind === 'coin' ? '#ffd166' : '#7ef29a', size: 2
            });
          }
        }
        k.vx *= Math.exp(-3 * dt);
        k.vy *= Math.exp(-3 * dt);
        k.x += k.vx * dt;
        k.y += k.vy * dt;
        const obs = world.room.obstacles || [];
        for (const o of obs) {
          const res = utils.resolveCircleRect(k.x, k.y, 6, o);
          k.x = res.x;
          k.y = res.y;
        }
        if (d < p.radius + 12) {
          if (k.kind === 'coin') {
            world.coins += k.value;
            audio.play('pickup');
            haptics.event('coin');
          } else if (k.kind === 'medkit') {
            p.hp = Math.min(p.maxHp, p.hp + 25);
            fx.floater(p.x, p.y - 24, '+25', 'crit');
            audio.play('pickup');
          } else if (k.kind === 'part') {
            if (world.inventory.length >= 10) {
              if (!k.notified) {
                k.notified = true;
                fx.floater(p.x, p.y - 24, '背包已满', 'normal');
              }
              continue; // 满包不拾取
            }
            pushPart(k.part);
            fx.floater(p.x, p.y - 24, '获得 ' + k.part.name, 'normal');
            audio.play('pickup');
          }
          utils.swapRemove(world.pickups, i);
        }
      }
    }

    function updateChains(dt) {
      for (let i = world.chains.length - 1; i >= 0; i--) {
        world.chains[i].life -= dt;
        if (world.chains[i].life <= 0) utils.swapRemove(world.chains, i);
      }
    }

    function updateDashGhosts(dt) {
      for (let i = world.dashGhosts.length - 1; i >= 0; i--) {
        world.dashGhosts[i].life -= dt;
        if (world.dashGhosts[i].life <= 0) utils.swapRemove(world.dashGhosts, i);
      }
    }

    function updateImpactMarks(dt) {
      for (let i = world.impactMarks.length - 1; i >= 0; i--) {
        world.impactMarks[i].life -= dt;
        if (world.impactMarks[i].life <= 0) utils.swapRemove(world.impactMarks, i);
      }
    }

    function pushObstaclesWithPlayer() {
      const p = world.player;
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        if (!isPushableObstacle(o)) continue;
        if (utils.circleRectHit(p.x, p.y, p.radius, o)) {
          if (world.time - (o.knockT || -9) > 0.3) {
            o.knockT = world.time;
            o.kvx += Math.cos(world.dash.angle) * 700;
            o.kvy += Math.sin(world.dash.angle) * 700;
            o.vr += utils.rand(-4, 4);
            o.pushedBy = 'player'; // 撞击伤害改为障碍物实际撞到目标时结算
            audio.play('boom');
          }
        }
      }
    }

    function enemyPushObstacles(e, dirAngle) {
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        if (!isPushableObstacle(o)) continue;
        if (Math.hypot(o.x + o.w / 2 - e.x, o.y + o.h / 2 - e.y) < e.radius + Math.max(o.w, o.h) / 2 + 6) {
          if (world.time - (o.knockT || -9) > 0.3) {
            o.knockT = world.time;
            o.kvx += Math.cos(dirAngle) * 550;
            o.kvy += Math.sin(dirAngle) * 550;
            o.vr += utils.rand(-4, 4);
            o.pushedBy = 'enemy'; // 撞击伤害改为障碍物实际撞到目标时结算
            audio.play('boom');
          }
        }
      }
    }

    function isPushableObstacle(o) {
      return (o.w * o.h) < 3500;
    }

    function updateObstacles(dt) {
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        o.x += o.kvx * dt;
        o.y += o.kvy * dt;
        o.kvx *= Math.exp(-4 * dt);
        o.kvy *= Math.exp(-4 * dt);
        o.rot += o.vr * dt;
        o.vr *= Math.exp(-4 * dt);
        o.x = utils.clamp(o.x, 20, ROOM_W - o.w - 20);
        o.y = utils.clamp(o.y, 20, ROOM_H - o.h - 20);
      }
      separateObstacles();
      // 被推飞的障碍物撞到目标才结算伤害（不再“推开即伤”）
      const pl = world.player;
      for (const o of obs) {
        if (!o.pushedBy) continue;
        if (Math.hypot(o.kvx, o.kvy) < 120) continue; // 子弹击飞(40)不算撞击
        const dmg = Math.round(Math.min(50, (o.w * o.h) / 80));
        if (o.pushedBy === 'player') {
          for (const e of world.enemies) {
            if (e.dead) continue;
            if (utils.circleRectHit(e.x, e.y, e.radius, o)) {
              if (world.time - (o.hitT || -9) > 0.15) {
                o.hitT = world.time;
                damageEnemy(e, dmg, Math.atan2(e.y - o.y, e.x - o.x), {});
                o.kvx *= -0.3;
                o.kvy *= -0.3;
              }
            }
          }
        } else if (o.pushedBy === 'enemy') {
          if (utils.circleRectHit(pl.x, pl.y, pl.radius, o)) {
            if (world.time - (o.hitT || -9) > 0.15) {
              o.hitT = world.time;
              damagePlayer(dmg, Math.atan2(pl.y - o.y, pl.x - o.x));
              o.kvx *= -0.3;
              o.kvy *= -0.3;
            }
          }
        }
      }
    }

    function separateObstacles() {
      // 多趟分离 + 每趟回界：靠墙时不会再被 clamp 弹回导致持续重叠
      const obs = world.room.obstacles || [];
      for (let pass = 0; pass < 6; pass++) {
        let moved = false;
        for (let i = 0; i < obs.length; i++) {
          for (let j = i + 1; j < obs.length; j++) {
            const a = obs[i], b = obs[j];
            if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
              const ox = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
              const oy = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);
              if (ox < oy) {
                const push = ox / 2;
                if (a.x < b.x) { a.x -= push; b.x += push; } else { a.x += push; b.x -= push; }
              } else {
                const push = oy / 2;
                if (a.y < b.y) { a.y -= push; b.y += push; } else { a.y += push; b.y -= push; }
              }
              moved = true;
            }
          }
        }
        if (!moved) break;
        for (const o of obs) {
          o.x = utils.clamp(o.x, 20, ROOM_W - o.w - 20);
          o.y = utils.clamp(o.y, 20, ROOM_H - o.h - 20);
        }
      }
    }

    function splitObstacle(o) {
      const list = world.room.obstacles;
      const idx = list.indexOf(o);
      if (idx >= 0) utils.swapRemove(list, idx);
      const isLarge = (o.w * o.h) >= 3500;
      const maxSplits = isLarge ? 2 : 1;
      if ((o.splits || 0) >= maxSplits) {
        fx.burst(o.x + o.w / 2, o.y + o.h / 2, '#ff8f3d', 12);
        audio.play('boom');
        return;
      }
      const pieces = isLarge ? (2 + Math.floor(Math.random() * 3)) : (2 + Math.floor(Math.random() * 2)); // 2~4 / 2~3
      fx.burst(o.x + o.w / 2, o.y + o.h / 2, '#8fa6b8', 10);
      audio.play('boom');
      for (let i = 0; i < pieces; i++) {
        const nw = Math.max(18, o.w * 0.45);
        const nh = Math.max(14, o.h * 0.45);
        const ang = Math.random() * Math.PI * 2;
        const sp = 90 + Math.random() * 160;
        const spread = (i - (pieces - 1) / 2) * (o.w * 0.35);
        list.push({
          x: o.x + (o.w - nw) / 2 + spread, y: o.y + (o.h - nh) / 2 + utils.rand(-10, 10),
          w: nw, h: nh, delay: 0, hp: 80, maxHp: 80,
          kvx: Math.cos(ang) * sp, kvy: Math.sin(ang) * sp,
          rot: Math.random() * 0.5, vr: (Math.random() - 0.5) * 8,
          splits: (o.splits || 0) + 1, knockT: -9,
          pushedBy: null, hitT: -9
        });
      }
    }

    // ===== 房间流程 =====
    function startMap(seed, layer) {
      world.layer = layer || 1;
      world.map = mapModule.generate(seed, world.layer);
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: world.map.rooms.length, clearedRooms: 0 };
      enterRoom(0, 0);
    }

    function advanceLayer() {
      world.layer++;
      world.map = mapModule.generate(Math.floor(Math.random() * 100000) + 1, world.layer);
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: world.map.rooms.length, clearedRooms: 0 };
      enterRoom(0, 0);
      world.player.hp = Math.min(world.player.maxHp, world.player.hp + 30);
      world.player.invuln = 1;
      fx.floater(world.player.x, world.player.y - 40, '进入第 ' + world.layer + ' 层', 'crit');
      audio.play('door');
    }

    function randSpawnPos() {
      for (let tries = 0; tries < 30; tries++) {
        const x = utils.rand(120, world.room.w - 120);
        const y = utils.rand(120, world.room.h - 120);
        const obs = world.room.obstacles || [];
        let ok = true;
        for (const o of obs) {
          if (utils.rectsOverlap(o.x - 40, o.y - 40, o.w + 80, o.h + 80, x - 20, y - 20, 40, 40)) { ok = false; break; }
        }
        if (ok) return { x, y };
      }
      return { x: utils.rand(120, world.room.w - 120), y: utils.rand(120, world.room.h - 120) };
    }

    function genObstacles(room) {
      const count = room.type === 'boss' ? 12 : room.type === 'elite' ? 8 : 5;
      const list = [];
      for (let i = 0; i < count; i++) {
        for (let tries = 0; tries < 24; tries++) {
          const w = utils.randInt(90, 195);
          const h = utils.randInt(60, 135);
          const x = utils.rand(140, ROOM_W - 140 - w);
          const y = utils.rand(140, ROOM_H - 140 - h);
          const rect = { x, y, w, h };
          const cx = ROOM_W / 2, cy = ROOM_H / 2;
          if (utils.rectsOverlap(rect.x, rect.y, rect.w, rect.h, cx - 100, cy - 100, 200, 200)) continue;
          if (room.doors.n && rect.y < 80) continue;
          if (room.doors.s && rect.y + rect.h > ROOM_H - 80) continue;
          if (room.doors.w && rect.x < 80) continue;
          if (room.doors.e && rect.x + rect.w > ROOM_W - 80) continue;
          if (list.some(o => utils.rectsOverlap(o.x - 30, o.y - 30, o.w + 60, o.h + 60, rect.x, rect.y, rect.w, rect.h))) continue;
          rect.delay = list.length * 0.18;
          rect.hp = 200; rect.maxHp = 200;
          rect.kvx = 0; rect.kvy = 0; rect.rot = 0; rect.vr = 0;
          rect.splits = 0; rect.knockT = -9;
          rect.pushedBy = null; rect.hitT = -9;
          list.push(rect);
          break;
        }
      }
      return list;
    }

    function resolveObstaclesFor(x, y, r) {
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        const res = utils.resolveCircleRect(x, y, r, o);
        x = res.x;
        y = res.y;
      }
      return { x, y };
    }

    function setBanner(text, dur, sub) {
      world.banner = { text, sub: sub || '', t: 0, dur };
    }

    function waveCountFor(room) {
      const layerBonus = (world.layer - 1) * 2;
      return Math.min(26, (4 + Math.floor(room.depth * 0.7) + layerBonus) * 3);
    }

    function pickEnemyKind() {
      const rr = Math.random();
      return rr < 0.4 ? 'chaser' : rr < 0.7 ? 'shooter' : rr < 0.9 ? 'splitter' : 'buzzer';
    }

    function spawnWaveEnemies(room, count, positions) {
      for (let i = 0; i < count; i++) {
        const pos = positions ? positions[i] : randSpawnPos();
        const kind = positions ? positions[i].kind : pickEnemyKind();
        const sc = positions ? (positions[i].scale || 1) :
          (1 + room.depth * 0.12 + (world.layer - 1) * 0.2 + (Math.random() < 0.2 ? 1 : 0));
        world.enemies.push(spawnEnemy(kind, pos.x, pos.y, sc));
      }
    }

    function enterRoom(rx, ry, fromDir) {
      const room = world.map.rooms.find(r => r.x === rx && r.y === ry);
      if (!room) return;
      stopBossMusic(); // 离开当前房间：先停掉上一首 BGM（含彩蛋 Boss 战未结束的情况）
      room.visited = true;
      world.room = room;
      world.mapInfo.roomPos = { x: rx, y: ry };
      world.enemies.length = 0;
      world.bullets.length = 0;
      world.pickups.length = 0;
      world.chains.length = 0;
      world.casings.length = 0;
      world.tracers.length = 0;
      world.chest = null;
      world.chestPart = null;
      world.coinPile = null;
      world.poisonZones.length = 0;
      world.shopOffers = [];
      world.shopPrices = [];
      world.shopPos = null;
      world.startNpc = null;
      world.forgeNpc = null;
      let px = ROOM_W / 2, py = ROOM_H / 2;
      if (fromDir === 'n') { px = ROOM_W / 2; py = ROOM_H - 130; }
      else if (fromDir === 's') { px = ROOM_W / 2; py = 130; }
      else if (fromDir === 'w') { px = ROOM_W - 130; py = ROOM_H / 2; }
      else if (fromDir === 'e') { px = 130; py = ROOM_H / 2; }
      world.player.x = px;
      world.player.y = py;
      camera.x = px;
      camera.y = py;
      if (room.type === 'start' && !world.fightNpc) world.startNpc = { x: ROOM_W / 2 - 220, y: ROOM_H / 2, state: 'idle', scale: 1, transformT: 0 };
      else if (room.type === 'forge') world.forgeNpc = { x: ROOM_W / 2 - 200, y: ROOM_H / 2 };
      if (room.spawned || room.cleared) return;
      room.spawned = true;
      room.obstacles = genObstacles(room);
      room.obstacleReveal = 0;
      if (room.type === 'combat') {
        room.waveTotal = utils.randInt(1, 3);
        room.waveIndex = 1;
        room.waveState = 'active';
        room.waveT = 0;
        room.waveSpawns = [];
        const total = waveCountFor(room);
        const base = Math.floor(total / room.waveTotal);
        const rem = total % room.waveTotal;
        room.waveCounts = [];
        for (let i = 0; i < room.waveTotal; i++) {
          room.waveCounts.push(base + (i < rem ? 1 : 0));
        }
        spawnWaveEnemies(room, room.waveCounts[0], null);
        room.alertT = 1.5;
        setBanner('第 1 波 / 共 ' + room.waveTotal + ' 波', 2.2, '敌人 1.5 秒后开始行动');
        startBossMusic('room');
      } else if (room.type === 'elite') {
        room.waveTotal = 1;
        room.waveIndex = 1;
        room.waveState = 'active';
        room.waveSpawns = [];
        const pos = randSpawnPos();
        const es = 1 + (world.layer - 1) * 0.35;
        world.enemies.push(spawnEnemy('elite', pos.x, pos.y, es));
        world.enemies.push(spawnEnemy('shooter', pos.x - 240, pos.y, 1.3 + (world.layer - 1) * 0.3));
        world.enemies.push(spawnEnemy('shooter', pos.x + 240, pos.y, 1.3 + (world.layer - 1) * 0.3));
        room.alertT = 1.5;
        startBossMusic('room');
      } else if (room.type === 'boss') {
        room.waveTotal = 1;
        room.waveIndex = 1;
        room.waveState = 'active';
        room.waveSpawns = [];
        const boss = spawnEnemy('boss', ROOM_W / 2, ROOM_H / 2 - 160, 1 + (world.layer - 1) * 0.4);
        world.enemies.push(boss);
        if (world.layer >= 2) {
          boss.poison = true; // 第二层 Boss：毒系（血量 +200%）
          boss.hp = Math.round(boss.hp * 3);
          boss.maxHp = boss.hp;
        }
        room.alertT = 1.5;
        startBossMusic('boss');
      } else if (room.type === 'treasure') {
        world.chest = { x: ROOM_W / 2, y: ROOM_H / 2, opened: false, part: partsEngine.rollPart() };
      } else if (room.type === 'coin') {
        world.coinPile = {
          x: ROOM_W / 2, y: ROOM_H / 2,
          amount: utils.randInt(1, Math.max(1, world.stats.kills)),
          collected: false
        };
      } else if (room.type === 'shop') {
        world.shopPos = { x: ROOM_W / 2 + 260, y: ROOM_H / 2 };
        world.shopOffers = [partsEngine.rollPart(), partsEngine.rollPart(), partsEngine.rollPart()];
        const PRICES = [10, 20, 40, 80, 150];
        world.shopPrices = world.shopOffers.map(o => PRICES[o.rarity] || 40);
      }
    }

    function startBossCoinRain(x, y) {
      const total = utils.randInt(40, 100);
      world.coinRain = { pending: total, batchSize: Math.max(1, Math.round(total / 4)), t: 0, x, y, active: true };
      audio.play('chest');
    }

    function checkRoomProgress() {
      const room = world.room;
      if (!room || room.cleared) return;
      const needsClear = room.type === 'combat' || room.type === 'elite' || room.type === 'boss';
      if (needsClear && world.enemies.length > 0) return;
      if (room.type === 'combat' && room.waveState === 'countdown') return; // 倒计时期间不算清房
      if (room.type === 'combat' && room.waveState === 'active' && room.waveIndex < room.waveTotal) {
        room.waveState = 'countdown';
        room.waveT = 3;
        room.waveSpawns = [];
        for (let i = 0; i < room.waveCounts[room.waveIndex]; i++) {
          const pos = randSpawnPos();
          room.waveSpawns.push({
            x: pos.x, y: pos.y,
            kind: pickEnemyKind(),
            scale: 1 + room.depth * 0.12 + (world.layer - 1) * 0.2
          });
        }
        audio.play('ui');
        return; // 尚未清房，进入下一波倒计时
      }
      room.cleared = true;
      world.mapInfo.clearedRooms++;
      if (needsClear) {
        setBanner('成功击败', 1.6, '门已开启');
        audio.play('door');
        if (room.type !== 'boss') {
          audio.play('victory');
          stopBossMusic(); // 清房：胜利音效与战斗 BGM 停止同时发生
        }
        fx.floater(world.player.x, world.player.y - 40, '门已开启', 'normal');
      }
    }

    function portalVisible() {
      return !!(world.portal &&
        world.mapInfo.roomPos.x === world.portal.roomX &&
        world.mapInfo.roomPos.y === world.portal.roomY);
    }

    function checkDoors(dt) {
      const p = world.player;
      const r = world.room;
      if (!r || !r.cleared) return;
      const zone = 70;
      let dir = null;
      if (r.doors.n && p.y < zone) dir = { dx: 0, dy: -1 };
      else if (r.doors.s && p.y > r.h - zone) dir = { dx: 0, dy: 1 };
      else if (r.doors.w && p.x < zone) dir = { dx: -1, dy: 0 };
      else if (r.doors.e && p.x > r.w - zone) dir = { dx: 1, dy: 0 };
      if (dir) {
        const dirName = dir.dy === -1 ? 'n' : dir.dy === 1 ? 's' : dir.dx === -1 ? 'w' : 'e';
        world.transition = { active: true, t: 0, rx: r.x + dir.dx, ry: r.y + dir.dy, dir: dirName };
        audio.play('door');
      }
    }

    // ===== 面板 UI =====
    function nowMs() {
      return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    }

    function openPanel(name) {
      ui.panel = name;
      ui.scroll = 0;
      ui.gpIndex = 0;
      ui.openAt = nowMs();
      state.paused = true;
      buildPanelRows();
      audio.play('ui');
    }

    function closePanel() {
      ui.panel = 'none';
      ui.items = [];
      ui.loadout = [];
      ui.loadoutChips = [];
      ui.forgeState = { mode: null, part: null };
      ui.gpIndex = 0;
      ui.chatGp = 0;
      state.paused = false;
      audio.play('ui');
    }

    function closeChat() {
      const showOpts = ui.chat && ui.chat.showOptions;
      ui.chat = null;
      state.paused = false;
      audio.play('ui');
      if (showOpts) openPanel('forgeMenu');
    }

    function promptNpcBattle() {
      if (!world.startNpc || world.startNpc.state !== 'idle') return;
      world.startNpc.state = 'asked';
      state.paused = true;
      const bw = Math.min(720, view.w - 60);
      const bx = (view.w - bw) / 2;
      const by = view.h - 112;
      ui.chat = {
        name: '作者 awa_cw', color: '#ff4d5e',
        lines: ['你想与我为战？'],
        showOptions: false, battle: true,
        buttons: [
          { x: bx + bw - 216, y: by + 22, w: 92, h: 40, label: '战', action: 'acceptBattle' },
          { x: bx + bw - 108, y: by + 22, w: 92, h: 40, label: '不战', action: 'declineBattle' }
        ]
      };
      audio.play('roar');
    }

    function acceptBattle() {
      const n = world.startNpc;
      if (!n || n.state !== 'asked') return;
      ui.chat = null;
      const p = world.player;
      const a = Math.atan2(p.y - n.y, p.x - n.x);
      p.vx = Math.cos(a) * 900;
      p.vy = Math.sin(a) * 900;
      p.invuln = 1.2;
      fx.shake(8);
      spawnAuthorBoss();
      audio.play('roar');
      haptics.event('npcChallenge');
      startBossMusic('surprise');
    }

    function declineBattle() {
      ui.chat = null;
      if (world.startNpc) world.startNpc.state = 'idle';
      state.paused = false;
      audio.play('ui');
    }

    function spawnAuthorBoss() {
      const n = world.startNpc;
      if (!n) return;
      const boss = spawnEnemy('boss', n.x, n.y, 1);
      boss.specialNpc = true;
      boss.scale = 3; // 保持 NPC 造型放大 300%
      boss.maxHp = 13440; // 血量 = Boss 的 1000%（Boss 已 +60%）
      boss.hp = 13440;
      boss.renderScale = 0.1;
      boss.growT = 0;
      world.enemies.push(boss);
      world.startNpc = null;
      world.fightNpc = true;
      state.paused = false;
      fx.burst(boss.x, boss.y, '#ff4d5e', 24);
      audio.play('roar');
    }

    function panelMetrics(rowCountOverride) {
      const panelW = 460;
      const header = 60;
      const loadoutH = ui.panel === 'parts' ? 124 : 0;
      const n = rowCountOverride !== undefined ? rowCountOverride : ui.items.length;
      const panelH = Math.min(
        header + loadoutH + n * 52 + 30,
        Math.max(120, view.h - 40)
      );
      return {
        panelW,
        panelH,
        px: view.w / 2 - panelW / 2,
        py: view.h / 2 - panelH / 2
      };
    }

    function buildPanelRows() {
      const rows = [];
      ui.title = ui.panel === 'parts' ? '部件背包（点击装备，旧件自动卸下回背包）' :
        ui.panel === 'shop' ? '武器商店' :
        ui.panel === 'forgeMenu' ? '锻造师菜单' :
        ui.panel === 'forgeList' ? (ui.forgeState.mode === 'enhance' ? '属性强化 · 选择部件' : '属性重组 · 选择部件') :
        ui.panel === 'forgeAffix' ? (ui.forgeState.mode === 'enhance' ? '属性强化 · 选择词条' : '属性重组 · 选择词条') :
        '宝箱';
      const rowCount = ui.panel === 'parts' ? world.inventory.length :
        ui.panel === 'shop' ? world.shopOffers.length :
        ui.panel === 'forgeMenu' ? 2 :
        ui.panel === 'forgeList' ? (world.inventory.length + (world.armor ? 1 : 0) + 3) :
        ui.panel === 'forgeAffix' ? Math.max(1, (ui.forgeState.part && ui.forgeState.part.affixes.length) || 0) :
        (world.chestPart ? 1 : 0);
      const { panelW, py } = panelMetrics(rowCount);
      const x0 = view.w / 2 - panelW / 2 + 16;
      if (ui.panel === 'parts') {
        const g = gun();
        const SLOT_NAMES = { body: '枪身', ammo: '弹药', mod: '配件', armor: '护甲' };
        ui.loadout = ['body', 'ammo', 'mod', 'armor'].map(slot => ({
          slot, slotName: SLOT_NAMES[slot],
          part: slot === 'armor'
            ? (world.armor || { id: 'none', name: '空', color: '#888888' })
            : g.parts[slot],
          defId: PART_DEFAULTS[slot]
        }));
        ui.loadoutChips = ui.loadout.map((entry, idx) => {
          const cw2 = 98, ch2 = 28;
          const cx2 = x0 + idx * (cw2 + 8);
          const cy2 = py + 92;
          return { x: cx2, y: cy2, w: cw2, h: ch2, slot: entry.slot };
        });
        let y = py + 128;
        for (const part of world.inventory) {
          const equipped = part.slot === 'armor' ? world.armor : g.parts[part.slot];
          const denied = equipped && equipped.id !== 'none_mod' && equipped.id === part.id;
          rows.push({
            x: x0, y, w: panelW - 32, h: 44,
            part, price: null, action: 'equip',
            denied, slotName: SLOT_NAMES[part.slot],
            discardX: x0 + panelW - 32 - 22, discardY: y + 22, discardR: 12
          });
          y += 52;
        }
      } else if (ui.panel === 'shop') {
        let y = py + 96;
        for (let i = 0; i < world.shopOffers.length; i++) {
          rows.push({ x: x0, y, w: panelW - 32, h: 44, part: world.shopOffers[i], price: world.shopPrices[i], action: 'buy' });
          y += 52;
        }
      } else if (ui.panel === 'chest') {
        const part = world.chestPart;
        if (part) rows.push({ x: x0, y: py + 96, w: panelW - 32, h: 44, part, price: null, action: 'take' });
      } else if (ui.panel === 'forgeMenu') {
        rows.push({ x: x0, y: py + 96, w: panelW - 32, h: 44, part: null, price: null, action: 'enhanceMenu', label: '属性强化 · 按品质扣金币' });
        rows.push({ x: x0, y: py + 152, w: panelW - 32, h: 44, part: null, price: null, action: 'rerollMenu', label: '属性重组 · 免费，每词条限 2 次' });
      } else if (ui.panel === 'forgeList') {
        const g = gun();
        const parts = [];
        for (const it of world.inventory) parts.push(it);
        for (const s of ['body', 'ammo', 'mod']) parts.push(g.parts[s]);
        if (world.armor) parts.push(world.armor);
        let y = py + 96;
        for (const part of parts) {
          rows.push({
            x: x0, y, w: panelW - 32, h: 44, part,
            price: ui.forgeState.mode === 'enhance' ? (partsEngine.enhancePrices[part.rarity] || 30) : 0,
            action: 'forgePickPart'
          });
          y += 52;
        }
      } else if (ui.panel === 'forgeAffix') {
        const part = ui.forgeState.part;
        let y = py + 96;
        if (!part || !part.affixes.length) {
          rows.push({ x: x0, y, w: panelW - 32, h: 44, part: null, price: null, action: 'none', label: '该部件没有词条' });
        } else {
          for (const aff of part.affixes) {
            rows.push({
              x: x0, y, w: panelW - 32, h: 44, part,
              affix: aff, price: null,
              action: ui.forgeState.mode === 'enhance' ? 'enhanceAffix' : 'rerollAffix'
            });
            y += 52;
          }
        }
      }
      ui.items = rows;
      ui.maxScroll = Math.max(0, rowCount * 52 - (panelMetrics(rowCount).panelH - 158));
      ui.scroll = utils.clamp(ui.scroll || 0, 0, ui.maxScroll);
      for (const row of rows) row.y -= ui.scroll;
      ui.gpIndex = utils.clamp(ui.gpIndex || 0, 0, Math.max(0, rows.length - 1));
    }

    function enhanceAffix(part, aff) {
      const qualityMul = [1, 0.85, 0.7, 0.55, 0.4][part.rarity] || 1;
      const boost = (0.25 + Math.random() * 0.2) * qualityMul;
      aff.value = aff.value * (1 + boost);
      aff.enhanced = true;
    }

    function rerollAffix(part, aff) {
      const pool = partsEngine.affixPool.filter(a => a.stat !== aff.stat);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      const factor = 0.8 + Math.random() * 0.7; // 原词条强度的 80%~150%
      const oldValue = aff.value;
      aff.stat = pick.stat;
      aff.label = pick.label;
      aff.pct = pick.pct;
      aff.flat = pick.flat;
      aff.value = Math.max(0.05, oldValue * factor);
      aff.rerolls++;
    }

    function rebuildAfterForge(part) {
      if (!part) return;
      if (part.slot === 'armor') { applyArmor(); return; }
      for (let i = 0; i < world.guns.length; i++) {
        const gp = world.guns[i].parts;
        if (gp.body === part || gp.ammo === part || gp.mod === part) rebuildGun(i);
      }
    }

    function discardPart(part) {
      const idx = world.inventory.indexOf(part);
      if (idx >= 0) utils.swapRemove(world.inventory, idx);
      audio.play('deny');
    }

    function uiClick(x, y) {
      if (ui.chat && ui.chat.buttons) {
        for (const b of ui.chat.buttons) {
          if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            if (b.action === 'acceptBattle') acceptBattle();
            else declineBattle();
            return;
          }
        }
      }
      const m = panelMetrics();
      if (m.panelW && x >= m.px + m.panelW - 40 && x <= m.px + m.panelW - 4 &&
          y >= m.py + 4 && y <= m.py + 36) {
        closePanel(); // 面板右上角 X 关闭
        return;
      }
      for (const chip of ui.loadoutChips || []) {
        if (x >= chip.x && x <= chip.x + chip.w && y >= chip.y && y <= chip.y + chip.h) {
          unequipPart(chip.slot);
          buildPanelRows();
          return;
        }
      }
      for (const row of ui.items) {
        if (x >= row.x && x <= row.x + row.w && y >= row.y && y <= row.y + row.h) {
          if (row.action === 'equip') {
            if (row.denied) {
              audio.play('deny');
              return;
            }
            if (x >= row.discardX - row.discardR && x <= row.discardX + row.discardR &&
                y >= row.discardY - row.discardR && y <= row.discardY + row.discardR) {
              discardPart(row.part);
              buildPanelRows();
              return;
            }
            equipPart(row.part);
            buildPanelRows();
            if (!world.inventory.length) closePanel();
          } else if (row.action === 'buy') {
            if (world.coins >= row.price) {
              world.coins -= row.price;
              pushPart(row.part);
              const idx = world.shopOffers.indexOf(row.part);
              if (idx >= 0) { world.shopOffers.splice(idx, 1); world.shopPrices.splice(idx, 1); }
              audio.play('buy');
              haptics.event('buy');
              buildPanelRows();
            } else {
              audio.play('deny');
            }
          } else if (row.action === 'take') {
            pushPart(row.part);
            world.coins += 3;
            world.chestPart = null;
            if (world.chest) world.chest.opened = true;
            audio.play('chest');
            haptics.event('buy');
            closePanel();
          } else if (row.action === 'enhanceMenu') {
            ui.forgeState = { mode: 'enhance', part: null };
            ui.panel = 'forgeList';
            buildPanelRows();
          } else if (row.action === 'rerollMenu') {
            ui.forgeState = { mode: 'reroll', part: null };
            ui.panel = 'forgeList';
            buildPanelRows();
          } else if (row.action === 'forgePickPart') {
            ui.forgeState.part = row.part;
            ui.panel = 'forgeAffix';
            buildPanelRows();
          } else if (row.action === 'enhanceAffix') {
            const aff = row.affix;
            if (aff.enhanced) { audio.play('deny'); return; }
            const price = partsEngine.enhancePrices[row.part.rarity] || 30;
            if (world.coins < price) { audio.play('deny'); return; }
            world.coins -= price;
            enhanceAffix(row.part, aff);
            rebuildAfterForge(row.part);
            audio.play('buy');
            ui.panel = 'forgeList';
            buildPanelRows();
          } else if (row.action === 'rerollAffix') {
            const aff = row.affix;
            if (aff.rerolls >= 2) { audio.play('deny'); return; }
            rerollAffix(row.part, aff);
            rebuildAfterForge(row.part);
            audio.play('ui');
            ui.panel = 'forgeList';
            buildPanelRows();
          }
          return;
        }
      }
    }

    // ---------- render ----------
    function render(alpha) {
      ctx.clearRect(0, 0, view.w, view.h);
      ctx.fillStyle = '#0a0e16';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.save();
      const shx = (Math.random() * 2 - 1) * fx.shakePower;
      const shy = (Math.random() * 2 - 1) * fx.shakePower;
      const p = world.player;
      const kickX = -Math.cos(p.aimAngle) * p.recoil * 9;
      const kickY = -Math.sin(p.aimAngle) * p.recoil * 9;
      ctx.translate(view.w / 2 + shx, view.h / 2 + shy);
      ctx.scale(ZOOM, ZOOM);
      ctx.translate(-camera.x + kickX, -camera.y + kickY);
      drawRoom();
      drawScanline();
      drawDoors();
      drawObstacles();
      drawPoisonZones();
      drawBullets();
      drawCasings();
      drawImpactMarks();
      drawParticles();
      drawTracers();
      drawChains();
      drawPickups();
      drawMarkers();
      drawNpcs();
      drawPortal();
      drawWavePreview();
      drawEnemies();
      drawFloaters();
      drawDashGhosts();
      drawPlayer();
      ctx.restore();
      drawHUD();
      drawTouchUI();
      drawAlert();
      drawBanner();
      drawPanel();
      drawChat();
      drawOverlay();
      if (touchMode && view.h > view.w) {
        ctx.fillStyle = 'rgba(4,8,14,0.92)';
        ctx.fillRect(0, 0, view.w, view.h);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#35e0ff';
        ctx.font = 'bold 26px Consolas, monospace';
        ctx.fillText('请横屏游玩', view.w / 2, view.h / 2 - 10);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '14px Consolas, monospace';
        ctx.fillText('旋转设备至横向', view.w / 2, view.h / 2 + 24);
      }
      drawLowHpVignette();
      if (state.screen === 'playing' && (input.keys.has('Space') || (input.gp && input.gp.aim)) && !world.dash.active) {
        ctx.fillStyle = 'rgba(53, 224, 255, 0.06)';
        ctx.fillRect(0, 0, view.w, view.h);
      }
      if (world.transition.active) {
        ctx.fillStyle = 'rgba(4, 8, 14, ' + (world.transition.t / 0.6) + ')';
        ctx.fillRect(0, 0, view.w, view.h);
      }
    }

    function drawRoom() {
      const r = world.room;
      const ac = accent();
      ctx.fillStyle = 'rgba(14, 20, 32, 0.92)';
      ctx.fillRect(r.x, r.y, r.w, r.h);

      ctx.strokeStyle = ac;
      ctx.globalAlpha = 0.08;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = r.x; gx <= r.w; gx += 80) { ctx.moveTo(gx, r.y); ctx.lineTo(gx, r.h); }
      for (let gy = r.y; gy <= r.h; gy += 80) { ctx.moveTo(r.x, gy); ctx.lineTo(r.w, gy); }
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.shadowColor = ac;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.shadowBlur = 0;

      // 四角装饰
      ctx.fillStyle = ac;
      ctx.globalAlpha = 0.55;
      const c = 14;
      ctx.fillRect(r.x, r.y, c, c); ctx.fillRect(r.w - c, r.y, c, c);
      ctx.fillRect(r.x, r.h - c, c, c); ctx.fillRect(r.w - c, r.h - c, c, c);
      ctx.globalAlpha = 1;
    }

    function drawBullets() {
      for (const b of world.bullets) {
        const t = b.trail || [];
        if (t.length > 1) {
          ctx.lineCap = 'round';
          for (let pass = 0; pass < 2; pass++) {
            const maxW = pass === 0 ? b.size * 2.6 : b.size * 1.1;
            const alphaMul = pass === 0 ? 0.22 : 0.5;
            for (let i = 0; i < t.length - 1; i++) {
              const f = (i + 1) / t.length;
              ctx.strokeStyle = b.color;
              ctx.globalAlpha = alphaMul * f;
              ctx.lineWidth = Math.max(0.5, maxW * f);
              ctx.beginPath();
              ctx.moveTo(t[i].x, t[i].y);
              ctx.lineTo(t[i + 1].x, t[i + 1].y);
              ctx.stroke();
            }
          }
          ctx.lineCap = 'butt';
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCasings() {
      for (const c of world.casings) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = utils.clamp(c.life / 0.4, 0, 1);
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(-3, -1.5, 6, 3);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      for (const q of world.particles) {
        const a = utils.clamp(q.life / q.maxLife, 0, 1);
        if (q.kind === 'muzzle') {
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'smoke') {
          ctx.globalAlpha = a * 0.16;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'spark') {
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'burst') {
          ctx.save();
          ctx.translate(q.x, q.y);
          ctx.rotate(q.rot);
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size);
          ctx.restore();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'dash') {
          const streak = Math.max(1, q.size * (1.4 - a * 0.8));
          ctx.globalAlpha = a * 0.55;
          ctx.strokeStyle = q.color;
          ctx.lineWidth = streak;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(q.x, q.y);
          ctx.lineTo(
            q.x - Math.cos(q.angle || 0) * streak * 2.6,
            q.y - Math.sin(q.angle || 0) * streak * 2.6
          );
          ctx.stroke();
          ctx.lineCap = 'butt';
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawFacingMark(e, radius) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.facing || 0);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(radius + 14, 0);
      ctx.lineTo(radius + 7, -4.5);
      ctx.lineTo(radius + 7, 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawEnemies() {
      for (const e of world.enemies) {
        const flash = e.flash > 0;
        ctx.save();
        if (e.kind === 'boss') {
          const phaseColor = e.poison ? '#7ef29a' : (e.phase >= 3 ? '#ff4d5e' : e.phase === 2 ? '#ffd166' : '#35e0ff');
          const rr = e.radius * (e.renderScale || 1);
          if (e.specialNpc) {
            // 作者 NPC 变身后的外观：保持 NPC 彩虹三角造型，放大 300%
            const hue = (world.time * 90) % 360;
            const col = 'hsl(' + hue + ',85%,60%)';
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.facing || 0);
            ctx.shadowColor = col;
            ctx.shadowBlur = 22;
            ctx.fillStyle = flash ? '#ffffff' : col;
            ctx.beginPath();
            ctx.moveTo(rr, 0);
            ctx.lineTo(-rr * 0.6, rr * 0.7);
            ctx.lineTo(-rr * 0.35, 0);
            ctx.lineTo(-rr * 0.6, -rr * 0.7);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
            drawFacingMark(e, rr);
            // 血条
            const bw = 300, bh = 10;
            const by = e.y - rr - 34;
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            ctx.fillRect(e.x - bw / 2, by, bw, bh);
            ctx.fillStyle = '#ff3d81';
            ctx.fillRect(e.x - bw / 2, by, bw * utils.clamp(e.hp / e.maxHp, 0, 1), bh);
            ctx.restore();
            continue;
          }
          ctx.shadowColor = e.color;
          ctx.shadowBlur = 20;
          ctx.fillStyle = flash ? '#ffffff' : e.color;
          ctx.beginPath();
          ctx.arc(e.x, e.y, rr, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          // 内层同心环
          ctx.strokeStyle = phaseColor;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, rr * 0.62, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(e.x, e.y, rr * 0.36, 0, Math.PI * 2);
          ctx.stroke();
          // 旋转外环 14 块
          ctx.fillStyle = phaseColor;
          const seg = Math.PI * 2 / Math.max(1, e.ringSegs);
          for (let i = 0; i < e.ringSegs; i++) {
            const a = e.rotation + i * seg;
            const rx = e.x + Math.cos(a) * rr;
            const ry = e.y + Math.sin(a) * rr;
            ctx.fillRect(rx - 4, ry - 4, 8, 8);
          }
          // 核心
          ctx.fillStyle = flash ? '#ffffff' : e.coreColor;
          ctx.beginPath();
          ctx.arc(e.x, e.y, rr * 0.18, 0, Math.PI * 2);
          ctx.fill();
          // 血条
          const bw = 300, bh = 10;
          const by = e.y - rr - 34;
          ctx.fillStyle = 'rgba(0,0,0,0.65)';
          ctx.fillRect(e.x - bw / 2, by, bw, bh);
          ctx.fillStyle = '#ff3d81';
          ctx.fillRect(e.x - bw / 2, by, bw * utils.clamp(e.hp / e.maxHp, 0, 1), bh);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(e.x - bw / 2 + bw * 0.4, by - 3, 2, bh + 6);
          ctx.fillRect(e.x - bw / 2 + bw * 0.7, by - 3, 2, bh + 6);
          drawFacingMark(e, rr);
          ctx.restore();
          continue;
        }
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = flash ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = flash ? '#ffffff' : e.coreColor;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        if (e.state === 'telegraph') {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(world.time * 30);
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        if (e.shield > 0) {
          ctx.strokeStyle = '#b06cff';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#b06cff';
          ctx.shadowBlur = 10;
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(world.time * 6);
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
        }
        if (e.hp < e.maxHp) {
          const bw = e.radius * 2, bh = 4;
          const bx = e.x - bw / 2, by = e.y - e.radius - 10;
          const frac = utils.clamp(e.hp / e.maxHp, 0, 1);
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = frac > 0.5 ? '#7ef29a' : frac > 0.25 ? '#ffd166' : '#ff4d5e';
          ctx.fillRect(bx, by, bw * frac, bh);
          if (e.maxShield > 0) {
            const sfrac = utils.clamp(e.shield / e.maxShield, 0, 1);
            ctx.fillStyle = 'rgba(176,108,255,0.8)';
            ctx.fillRect(bx, by - 6, bw * sfrac, 3);
          }
        }
        if (e.freezeT > 0) {
          ctx.strokeStyle = 'rgba(120, 220, 255, 0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
          ctx.stroke();
        }
        drawFacingMark(e, e.radius);
        ctx.restore();
      }
    }

    function drawFloaters() {
      ctx.textAlign = 'center';
      for (const f of world.floaters) {
        const a = utils.clamp(f.life / f.maxLife, 0, 1);
        ctx.globalAlpha = a;
        if (f.kind === 'crit') {
          ctx.fillStyle = '#ffd166';
          ctx.font = 'bold 20px Consolas, monospace';
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px Consolas, monospace';
        }
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawDashGhosts() {
      for (const g of world.dashGhosts) {
        const a = utils.clamp(g.life / g.maxLife, 0, 1);
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.angle);
        ctx.globalAlpha = a * 0.4;
        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-10, 11);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, -11);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawTracers() {
      for (const t of world.tracers) {
        const a = utils.clamp(t.life / 0.09, 0, 1);
        ctx.globalAlpha = a;
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(t.x0, t.y0);
        ctx.lineTo(t.x1, t.y1);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x1, t.y1, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawChains() {
      for (const c of world.chains) {
        const a = utils.clamp(c.life / 0.12, 0, 1);
        ctx.globalAlpha = a;
        ctx.strokeStyle = '#35e0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c.x1, c.y1);
        const steps = 5;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const jx = (Math.random() - 0.5) * 18;
          const jy = (Math.random() - 0.5) * 18;
          ctx.lineTo(c.x1 + (c.x2 - c.x1) * t + jx, c.y1 + (c.y2 - c.y1) * t + jy);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawPickups() {
      for (const k of world.pickups) {
        if (k.kind === 'coin') {
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(k.x, k.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#8a6d1a';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(k.x, k.y, 5, 0.4, 1.2);
          ctx.stroke();
        } else if (k.kind === 'medkit') {
          ctx.fillStyle = '#7ef29a';
          ctx.fillRect(k.x - 6, k.y - 2, 12, 4);
          ctx.fillRect(k.x - 2, k.y - 6, 4, 12);
        } else if (k.kind === 'part') {
          const p = k.part;
          const pulse = 0.7 + 0.3 * Math.sin(world.time * 6);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10 * pulse;
          ctx.save();
          ctx.translate(k.x, k.y);
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-6, -6, 12, 12);
          ctx.restore();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#0a0e16';
          ctx.beginPath();
          ctx.arc(k.x, k.y, 3, 0, Math.PI * 2);
          ctx.fill();
          if (world.inventory.length >= 10) {
            ctx.fillStyle = '#ff4d5e';
            ctx.font = '10px Consolas, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('满', k.x, k.y - 12);
          }
        }
      }
    }

    function drawMarkers() {
      const p = world.player;
      if (world.chest && !world.chest.opened) {
        const c = world.chest;
        ctx.fillStyle = '#b06cff';
        ctx.fillRect(c.x - 10, c.y - 8, 20, 16);
        ctx.strokeStyle = '#35e0ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x - 10, c.y - 8, 20, 16);
        if (utils.distance(p.x, p.y, c.x, c.y) < 100) drawHint(c.x, c.y - 26, 'E 开箱');
      }
      if (world.shopPos && world.shopOffers.length) {
        const s = world.shopPos;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(world.time * 1.5);
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(12, 8);
        ctx.lineTo(-12, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        if (utils.distance(p.x, p.y, s.x, s.y) < 120) drawHint(s.x, s.y - 26, 'E 商店');
      }
      if (world.coinPile && !world.coinPile.collected) {
        const c = world.coinPile;
        ctx.fillStyle = 'rgba(255,225,77,0.25)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + 8, 22, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + world.time * 1.2;
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(c.x + Math.cos(a) * 16, c.y + Math.sin(a) * 7, 3.4, 0, Math.PI * 2);
          ctx.fill();
        }
        if (utils.distance(p.x, p.y, c.x, c.y) < 90) drawHint(c.x, c.y - 30, 'E 收集金币');
      }
    }

    function drawNpcs() {
      const p = world.player;
      if (world.startNpc) {
        const n = world.startNpc;
        const hue = (world.time * 90) % 360;
        const col = 'hsl(' + hue + ',85%,60%)';
        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.scale(n.scale || 1, n.scale || 1);
        ctx.shadowColor = col;
        ctx.shadowBlur = 14;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-10, 11);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, -11);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (n.state === 'asked') {
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(world.time * 8);
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
        if (utils.distance(p.x, p.y, n.x, n.y) < 100) drawHint(n.x, n.y - 26, 'E 对话');
      }
      if (world.forgeNpc) {
        const n = world.forgeNpc;
        const t = (Math.sin(world.time * 2.4) + 1) / 2;
        const h1 = [176, 108, 255], h2 = [255, 209, 102];
        const col = 'rgb(' + Math.round(h1[0] + (h2[0] - h1[0]) * t) + ',' +
          Math.round(h1[1] + (h2[1] - h1[1]) * t) + ',' +
          Math.round(h1[2] + (h2[2] - h1[2]) * t) + ')';
        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.shadowColor = col;
        ctx.shadowBlur = 16;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-10, 11);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, -11);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
        if (utils.distance(p.x, p.y, n.x, n.y) < 110) drawHint(n.x, n.y - 26, 'E 锻造');
      }
    }

    function drawHint(x, y, text) {
      ctx.font = '12px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(text, x, y);
    }

    function drawPortal() {
      if (!portalVisible()) return;
      const pr = world.portal;
      const t = Math.min(1, pr.t / 1.2);
      const radius = 30 + 34 * t;
      const cx = pr.x, cy = pr.y;
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(world.time * 5);
      const grad = ctx.createRadialGradient
        ? ctx.createRadialGradient(cx, cy, 2, cx, cy, radius)
        : null;
      if (grad && grad.addColorStop) {
        grad.addColorStop(0, 'rgba(53, 224, 255, ' + (0.4 * t) + ')');
        grad.addColorStop(1, 'rgba(53, 224, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (let ring = 0; ring < 2; ring++) {
        ctx.strokeStyle = ring === 0 ? '#35e0ff' : '#b06cff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const rot = world.time * (ring === 0 ? 2.2 : -1.6);
        ctx.arc(cx, cy, radius * (0.55 + ring * 0.3), rot, rot + Math.PI * 1.4);
        ctx.stroke();
      }
      ctx.restore();
      if (pr.active) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#35e0ff';
        ctx.font = '13px Consolas, monospace';
        ctx.fillText('传送门已开启', cx, cy - radius - 18);
        const p = world.player;
        if (utils.distance(p.x, p.y, cx, cy) < 110) drawHint(cx, cy - radius - 36, 'E 进入下一层');
      }
    }

    function drawPanel() {
      if (ui.panel === 'none') return;
      ctx.fillStyle = 'rgba(4, 8, 14, 0.82)';
      ctx.fillRect(0, 0, view.w, view.h);
      const { panelW, panelH, px, py } = panelMetrics();
      const openT = utils.clamp((nowMs() - (ui.openAt || 0)) / 160, 0, 1);
      const sc = 0.92 + 0.08 * openT;
      ctx.save();
      ctx.globalAlpha = openT;
      ctx.translate(view.w / 2, view.h / 2);
      ctx.scale(sc, sc);
      ctx.translate(-view.w / 2, -view.h / 2);
      ctx.fillStyle = '#111827';
      ctx.strokeStyle = '#35e0ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#35e0ff';
      ctx.shadowBlur = 12;
      ctx.fillRect(px, py, panelW, panelH);
      ctx.shadowBlur = 0;
      ctx.strokeRect(px, py, panelW, panelH);

      ctx.fillStyle = '#35e0ff';
      ctx.font = 'bold 16px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ui.title, view.w / 2, py + 30);
      ctx.font = '12px Consolas, monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('ESC / B 关闭', view.w / 2, py + 48);

      // 右上角关闭 X
      ctx.strokeStyle = '#ff4d5e';
      ctx.lineWidth = 2.5;
      const cx = px + panelW - 22, cy = py + 20;
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - 7);
      ctx.lineTo(cx + 7, cy + 7);
      ctx.moveTo(cx + 7, cy - 7);
      ctx.lineTo(cx - 7, cy + 7);
      ctx.stroke();

      if (ui.panel === 'parts' && ui.loadout) {
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '12px Consolas, monospace';
        ctx.fillText('当前武器（点击槽位可卸下）', px + 16, py + 70);
        ui.loadout.forEach((entry, idx) => {
          const chip = ui.loadoutChips[idx];
          if (!chip) return;
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fillRect(chip.x, chip.y, chip.w, chip.h);
          ctx.fillStyle = entry.part.color;
          ctx.fillRect(chip.x, chip.y, 4, chip.h);
          ctx.fillStyle = '#ffffff';
          ctx.font = '12px Consolas, monospace';
          ctx.fillText(
            entry.slotName + ': ' + (entry.part.id === 'none_mod' ? '空' : entry.part.name),
            chip.x + 10, chip.y + 18
          );
        });
      }

      for (const row of ui.items) {
        ctx.globalAlpha = row.denied ? 0.4 : 1;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
        ctx.fillRect(row.x, row.y, row.w, row.h);
        ctx.fillStyle = row.affix ? '#ffb347' : (row.part ? row.part.color : '#35e0ff');
        ctx.fillRect(row.x, row.y, 4, row.h);
        ctx.font = '13px Consolas, monospace';
        ctx.textAlign = 'left';
        if (row.label) {
          ctx.fillStyle = '#ffffff';
          ctx.fillText(row.label, row.x + 14, row.y + 27);
        } else if (row.affix) {
          const aff = row.affix;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(partsEngine.affixLabel(aff), row.x + 14, row.y + 18);
          const marks = [];
          if (aff.enhanced) marks.push('已强化');
          if (aff.rerolls > 0) marks.push('已重组 ' + aff.rerolls + '/2');
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.font = '11px Consolas, monospace';
          ctx.fillText(marks.join('  '), row.x + 14, row.y + 34);
          ctx.fillStyle = aff.enhanced ? '#ff8f3d' : aff.rerolls >= 2 ? '#ff4d5e' : 'rgba(53,224,255,0.8)';
          ctx.textAlign = 'right';
          ctx.fillText(
            aff.enhanced ? '已强化' : aff.rerolls >= 2 ? '次数已满' :
              (ui.forgeState.mode === 'enhance' ? '强化' : '重组'),
            row.x + row.w - 14, row.y + 26
          );
        } else if (row.part) {
          ctx.fillStyle = '#ffffff';
          ctx.fillText('[' + (row.slotName || '') + '] ' + row.part.name, row.x + 14, row.y + 18);
          const rc = partsEngine.rarityColors[row.part.rarity];
          ctx.fillStyle = rc;
          ctx.fillText(partsEngine.rarityNames[row.part.rarity], row.x + 14, row.y + 34);
          let affText = row.part.affixes.map(a => partsEngine.affixLabel(a)).join('  ');
          if (!affText) affText = row.part.desc;
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          ctx.fillText(affText, row.x + 110, row.y + 18);
          if (row.price !== null) {
            ctx.fillStyle = '#ffd166';
            ctx.textAlign = 'right';
            ctx.fillText(row.price > 0 ? '◆ ' + row.price : '免费', row.x + row.w - 14, row.y + 26);
          } else if (row.action === 'equip') {
            ctx.fillStyle = row.denied ? '#ff4d5e' : 'rgba(53,224,255,0.8)';
            ctx.textAlign = 'right';
            ctx.fillText(row.denied ? '已装备同类' : '装备', row.x + row.w - 52, row.y + 26);
          } else if (row.action === 'take') {
            ctx.fillStyle = '#7ef29a';
            ctx.textAlign = 'right';
            ctx.fillText('领取', row.x + row.w - 14, row.y + 26);
          }
          if (row.action === 'equip') {
            ctx.strokeStyle = '#ff4d5e';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            const dx = row.discardX, dy = row.discardY, dr = 7;
            ctx.moveTo(dx - dr, dy - dr);
            ctx.lineTo(dx + dr, dy + dr);
            ctx.moveTo(dx + dr, dy - dr);
            ctx.lineTo(dx - dr, dy + dr);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }
      if (ui.panel === 'parts' && ui.maxScroll > 0) {
        const trackX = px + panelW - 10;
        const trackY = py + 128;
        const trackH = Math.max(10, panelH - 158);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(trackX, trackY, 4, trackH);
        const thumbH = Math.max(20, trackH * (trackH / (trackH + ui.maxScroll)));
        const thumbY = trackY + (trackH - thumbH) * (ui.scroll / ui.maxScroll);
        ctx.fillStyle = '#35e0ff';
        ctx.fillRect(trackX, thumbY, 4, thumbH);
      }
      if (ui.items.length && ui.gpIndex >= 0 && ui.gpIndex < ui.items.length && ui.items[ui.gpIndex]) {
        const sel = ui.items[ui.gpIndex];
        ctx.strokeStyle = '#35e0ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(sel.x - 2, sel.y - 2, sel.w + 4, sel.h + 4);
      }
      ctx.textAlign = 'left';
      ctx.restore();
    }

    function drawChat() {
      if (!ui.chat) return;
      const c = ui.chat;
      const bw = Math.min(720, view.w - 60);
      const bx = (view.w - bw) / 2;
      const bh = 96;
      const by = view.h - bh - 16;
      ctx.fillStyle = 'rgba(4, 8, 14, 0.92)';
      ctx.strokeStyle = c.color || '#35e0ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = c.color || '#35e0ff';
      ctx.shadowBlur = 8;
      ctx.fillRect(bx, by, bw, bh);
      ctx.shadowBlur = 0;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.textAlign = 'left';
      ctx.fillStyle = c.color || '#35e0ff';
      ctx.font = 'bold 14px Consolas, monospace';
      ctx.fillText(c.name, bx + 16, by + 24);
      ctx.fillStyle = '#ffffff';
      ctx.font = '13px Consolas, monospace';
      (c.lines || []).forEach((ln, i) => ctx.fillText(ln, bx + 16, by + 50 + i * 18));
      if (c.buttons) {
        ctx.textAlign = 'center';
        for (const b of c.buttons) {
          ctx.fillStyle = 'rgba(30,41,59,0.95)';
          ctx.strokeStyle = b.action === 'acceptBattle' ? '#ff4d5e' : '#35e0ff';
          ctx.lineWidth = 2;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px Consolas, monospace';
          ctx.fillText(b.label, b.x + b.w / 2, b.y + 27);
          if (c.buttons && c.buttons[ui.chatGp] === b) {
            ctx.strokeStyle = '#35e0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
          }
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('右键关闭', bx + bw - 14, by + bh - 12);
      ctx.textAlign = 'left';
    }

    function drawScanline() {
      const r = world.room;
      const y = ((world.time * 140) % (r.h)) + r.y;
      ctx.fillStyle = accent();
      ctx.globalAlpha = 0.05;
      ctx.fillRect(r.x, y, r.w, 2);
      ctx.globalAlpha = 1;
    }

    function drawDoors() {
      const r = world.room;
      if (!r.cleared) return;
      const dw = 80, dh = 14;
      const ac = accent();
      ctx.fillStyle = ac;
      ctx.shadowColor = ac;
      ctx.shadowBlur = 10;
      if (r.doors.n) ctx.fillRect(r.w / 2 - dw / 2, r.y, dw, dh);
      if (r.doors.s) ctx.fillRect(r.w / 2 - dw / 2, r.h - dh, dw, dh);
      if (r.doors.w) ctx.fillRect(r.x, r.h / 2 - dw / 2, dh, dw);
      if (r.doors.e) ctx.fillRect(r.w - dh, r.h / 2 - dw / 2, dh, dw);
      ctx.shadowBlur = 0;
    }

    function drawObstacles() {
      const obs = world.room.obstacles || [];
      const ac = accent();
      const reveal = world.room.obstacleReveal !== undefined ? world.room.obstacleReveal : 999;
      for (const o of obs) {
        const local = reveal - (o.delay || 0);
        if (local < 0) {
          // 扫描光束：障碍物随扫描逐渐显现
          const remaining = -local;
          const progress = utils.clamp(1 - remaining / 0.28, 0, 1);
          const beamX = o.x + progress * o.w;
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = ac;
          ctx.fillRect(beamX - 2, o.y, 4, o.h);
          ctx.globalAlpha = 0.12;
          ctx.fillStyle = ac;
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.globalAlpha = 1;
          continue;
        }
        const alpha = Math.min(1, local / 0.15);
        ctx.save();
        ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
        ctx.rotate(o.rot || 0);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#101826';
        ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
        ctx.strokeStyle = ac;
        ctx.lineWidth = 2;
        ctx.shadowColor = ac;
        ctx.shadowBlur = 8;
        ctx.strokeRect(-o.w / 2, -o.h / 2, o.w, o.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-o.w / 2 + 5, -o.h / 2 + 5, o.w - 10, o.h - 10);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(-o.w / 2 + 3, -o.h / 2 + 3, o.w - 6, 5);
        if (o.hp !== undefined && o.hp < (o.maxHp || 200)) {
          const dmgPct = utils.clamp(1 - o.hp / (o.maxHp || 200), 0, 1);
          const red = 0.7 * dmgPct;
          const flash = 0.55 + 0.45 * Math.sin(world.time * (4 + 14 * dmgPct));
          ctx.fillStyle = 'rgba(255, 40, 60, ' + (red * flash).toFixed(3) + ')';
          ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    function drawPoisonZones() {
      for (const z of world.poisonZones) {
        const a = utils.clamp(z.life / z.maxLife, 0, 1);
        const zc = z.flame ? '#ff8f3d' : '#7ef29a';
        ctx.globalAlpha = a * 0.35;
        ctx.fillStyle = zc;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = a * 0.5;
        ctx.strokeStyle = zc;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r * (0.8 + 0.2 * Math.sin(world.time * 3 + z.x)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawWavePreview() {
      const room = world.room;
      if (!room || room.waveState !== 'countdown') return;
      for (const s of room.waveSpawns) {
        const def = ENEMY_KINDS[s.kind] || ENEMY_KINDS.chaser;
        const pulse = 0.8 + 0.2 * Math.sin(world.time * 5);
        ctx.globalAlpha = 0.8 * pulse;
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, def.radius * (s.scale || 1), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 18px Consolas, monospace';
      ctx.fillText('下一波 ' + Math.ceil(room.waveT), ROOM_W / 2, ROOM_H / 2 - 40);
    }

    function drawImpactMarks() {
      for (const m of world.impactMarks) {
        const a = utils.clamp(m.life / 2.5, 0, 1);
        ctx.globalAlpha = a * 0.5;
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawPlayer() {
      const p = world.player;
      const g = gun();
      const bodyColor = PARTS.body[g.parts.body.id] ? PARTS.body[g.parts.body.id].color : '#35e0ff';
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.aimAngle);
      ctx.translate(-p.recoil * 8, 0);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1d3a52';
      ctx.strokeStyle = '#35e0ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-10, 11);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, -11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = bodyColor;
      ctx.fillRect(10, -2.5, 16, 5);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(12, -1, 12, 2);
      ctx.restore();
    }

    function drawHUD() {
      const g = gun();
      const p = world.player;
      const mobile = isTouchUI;
      ctx.fillStyle = 'rgba(53, 224, 255, 0.7)';
      ctx.font = (mobile ? 11 : 14) + 'px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('T ' + world.time.toFixed(1) + 's', 14, 24);

      // 生命格子条
      const cells = 10, cw = mobile ? 20 : 26, ch = mobile ? 10 : 12, gap = 2;
      const cellHp = p.maxHp / cells;
      const hx = 14, hy = view.h - 34;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(hx - 2, hy - 2, cells * (cw + gap) + 2, ch + 4);
      for (let i = 0; i < cells; i++) {
        const x = hx + i * (cw + gap);
        ctx.fillStyle = 'rgba(4, 8, 14, 0.9)';
        ctx.fillRect(x, hy, cw, ch);
        if (p.hp > i * cellHp) {
          ctx.fillStyle = '#35e0ff';
          ctx.fillRect(x, hy, cw, ch);
        } else if (world.hpDelay > i * cellHp) {
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(x, hy, cw, ch);
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = (mobile ? 11 : 13) + 'px Consolas, monospace';
      ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, hx, hy - 6);

      if (p.maxArmor > 0) {
        const aw = mobile ? 200 : 260;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(hx, hy - 18, aw, 7);
        ctx.fillStyle = '#35e0ff';
        ctx.fillRect(hx, hy - 18, aw * utils.clamp(p.armor / p.maxArmor, 0, 1), 7);
        ctx.fillStyle = 'rgba(180,230,255,0.85)';
        ctx.font = (mobile ? 9 : 10) + 'px Consolas, monospace';
        ctx.fillText('护甲 ' + Math.ceil(p.armor) + '/' + p.maxArmor, hx, hy - 22);
      }

      ctx.textAlign = 'right';
      ctx.fillStyle = g.mag === 0 ? '#ff4d5e' : '#ffd166';
      ctx.globalAlpha = g.mag === 0 ? 0.6 + 0.4 * Math.sin(world.time * 8) : 1;
      if (mobile) {
        ctx.font = 'bold 13px Consolas, monospace';
        ctx.fillText(g.mag + ' / ' + g.stats.magSize, view.w - 14, 64);
        if (g.reloading) {
          ctx.fillStyle = 'rgba(255, 209, 102, 0.7)';
          const w = 90 * (1 - g.reloadT / g.stats.reloadTime);
          ctx.fillRect(view.w - 14 - w, 72, w, 4);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '9px Consolas, monospace';
        ctx.fillText(g.parts.body.name + '·' + g.parts.ammo.name, view.w - 14, 84);
        ctx.fillStyle = 'rgba(255, 77, 94, 0.8)';
        ctx.font = '11px Consolas, monospace';
        ctx.fillText('击杀 ' + world.stats.kills + '  ◆ ' + world.coins, view.w - 14, 24);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillText(g.mag + ' / ' + g.stats.magSize, view.w - 14, view.h - 18);
        if (g.reloading) {
          ctx.fillStyle = 'rgba(255, 209, 102, 0.7)';
          const w = 120 * (1 - g.reloadT / g.stats.reloadTime);
          ctx.fillRect(view.w - 14 - w, view.h - 12, w, 4);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '12px Consolas, monospace';
        ctx.fillText(g.parts.body.name + ' · ' + g.parts.ammo.name + ' · ' + g.parts.mod.name, view.w - 14, view.h - 42);
        ctx.fillStyle = 'rgba(255, 77, 94, 0.7)';
        ctx.font = '14px Consolas, monospace';
        ctx.fillText('击杀 ' + world.stats.kills + '  ◆ ' + world.coins, view.w - 14, 24);
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = accent();
      ctx.font = (mobile ? 11 : 14) + 'px Consolas, monospace';
      ctx.fillText('第 ' + world.layer + ' 层 · 房间 ' + world.mapInfo.clearedRooms + '/' + world.mapInfo.totalRooms, view.w / 2, 24);

      if (world.stats.combo > 1 && world.time - world.stats.comboT < 0.5) {
        ctx.fillStyle = '#ffd166';
        ctx.font = 'bold ' + (mobile ? 18 : 22) + 'px Consolas, monospace';
        ctx.fillText('x' + world.stats.combo, view.w / 2, mobile ? view.h - 120 : view.h - 100);
      }
      const dash = world.dash;
      const dBarW = mobile ? 150 : 190, dBarH = 10;
      const dBarX = view.w / 2 - dBarW / 2;
      const dBarY = view.h - 64;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(dBarX - 2, dBarY - 2, dBarW + 4, dBarH + 4);
      if (dash.cd > 0) {
        const frac = 1 - dash.cd / 3;
        const pulse = 0.6 + 0.4 * Math.sin(world.time * 6);
        const col = 'rgb(' + Math.round(255 + (53 - 255) * frac) + ',' +
          Math.round(77 + (224 - 77) * frac) + ',' +
          Math.round(94 + (255 - 94) * frac) + ')';
        ctx.fillStyle = 'rgba(255,77,94,0.25)';
        ctx.fillRect(dBarX, dBarY, dBarW, dBarH);
        ctx.fillStyle = col;
        ctx.fillRect(dBarX, dBarY, dBarW * frac, dBarH);
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.strokeRect(dBarX - 2, dBarY - 2, dBarW + 4, dBarH + 4);
        ctx.fillStyle = col;
        ctx.font = 'bold ' + (mobile ? 12 : 14) + 'px Consolas, monospace';
        ctx.fillText('瞬身冷却 ' + dash.cd.toFixed(1) + 's', view.w / 2, dBarY - 8);
      } else {
        ctx.fillStyle = '#35e0ff';
        ctx.fillRect(dBarX, dBarY, dBarW, dBarH);
        ctx.strokeStyle = '#35e0ff';
        ctx.strokeRect(dBarX - 2, dBarY - 2, dBarW + 4, dBarH + 4);
        ctx.fillStyle = '#9adcff';
        ctx.font = 'bold ' + (mobile ? 12 : 14) + 'px Consolas, monospace';
        ctx.fillText('瞬身就绪（空格+左键）', view.w / 2, dBarY - 8);
      }
      drawMinimap();
    }

    function drawTouchUI() {
      if (!isTouchUI || state.screen !== 'playing') return;
      const t = input.touch;
      if (t.moveId !== null) {
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = '#35e0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.moveOrigin.x, t.moveOrigin.y, 52, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#35e0ff';
        ctx.beginPath();
        ctx.arc(t.moveOrigin.x + t.moveVec.x, t.moveOrigin.y + t.moveVec.y, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (t.aimId !== null) {
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.aimPos.x, t.aimPos.y, 14, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(t.aimPos.x - 6, t.aimPos.y);
        ctx.lineTo(t.aimPos.x + 6, t.aimPos.y);
        ctx.moveTo(t.aimPos.x, t.aimPos.y - 6);
        ctx.lineTo(t.aimPos.x, t.aimPos.y + 6);
        ctx.stroke();
      }
      for (const b of touchButtons()) {
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = b.id === 'dash' ? 'rgba(53,224,255,0.25)' : 'rgba(30,41,59,0.7)';
        ctx.strokeStyle = b.id === 'dash' ? '#35e0ff' : 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(b.label, b.x, b.y + 5);
      }
    }

    function drawAlert() {
      const room = world.room;
      if (!room || room.alertT == null || room.alertT <= 0 || world.enemies.length === 0) return;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255, 77, 94, 0.9)';
      ctx.font = 'bold ' + (isTouchUI ? 16 : 20) + 'px Consolas, monospace';
      ctx.fillText('敌人尚未察觉 · ' + Math.ceil(room.alertT), view.w / 2, 90);
    }

    function drawBanner() {
      const b = world.banner;
      if (!b.text || b.dur <= 0) return;
      const t = b.t / b.dur;
      if (t > 1) return;
      const alpha = utils.clamp(Math.min(t * 3, (1 - t) * 3), 0, 1);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#35e0ff';
      ctx.font = 'bold ' + (isTouchUI ? 32 : 46) + 'px Consolas, monospace';
      ctx.shadowColor = '#35e0ff';
      ctx.shadowBlur = 16;
      ctx.fillText(b.text, view.w / 2, view.h * 0.32);
      ctx.shadowBlur = 0;
      if (b.sub) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = (isTouchUI ? 12 : 16) + 'px Consolas, monospace';
        ctx.fillText(b.sub, view.w / 2, view.h * 0.32 + 32);
      }
      ctx.globalAlpha = 1;
    }

    function drawMinimap() {
      if (!world.map) return;
      const mobile = isTouchUI;
      const cell = mobile ? 30 : 42, gap = 3;
      const gw = world.map.gridW || 3;
      const gh = world.map.gridH || 3;
      const mx = view.w - 14 - gw * (cell + gap);
      const my = mobile ? 100 : 40;
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = (mobile ? 9 : 10) + 'px Consolas, monospace';
      ctx.fillText('第' + world.layer + '层', view.w - 14, my - 6);
      for (const room of world.map.rooms) {
        const px = mx + room.x * (cell + gap);
        const py = my + room.y * (cell + gap);
        if (room.type === 'boss' && !room.visited) {
          const pulse = 0.5 + 0.5 * Math.sin(world.time * 4);
          ctx.fillStyle = 'rgba(255, 61, 129, ' + (0.2 + 0.25 * pulse) + ')';
          ctx.fillRect(px, py, cell, cell);
          ctx.strokeStyle = '#ff3d81';
          ctx.lineWidth = 2;
          ctx.strokeRect(px - 1.5, py - 1.5, cell + 3, cell + 3);
          continue;
        }
        const color = room.type === 'start' ? accent() : (MINIMAP_COLORS[room.type] || '#666666');
        ctx.fillStyle = room.visited ? color : 'rgba(255,255,255,0.14)';
        ctx.fillRect(px, py, cell, cell);
        if (!room.visited && ['treasure', 'shop', 'coin', 'forge'].includes(room.type)) {
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.font = 'bold ' + (mobile ? 12 : 18) + 'px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('?', px + cell / 2, py + cell / 2 + (mobile ? 3 : 4));
        }
        if (world.mapInfo.roomPos.x === room.x && world.mapInfo.roomPos.y === room.y) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(px - 1.5, py - 1.5, cell + 3, cell + 3);
        }
      }
      ctx.textAlign = 'left';
    }

    function drawLowHpVignette() {
      if (state.screen !== 'playing' || world.player.hp >= world.player.maxHp * 0.3) return;
      const a = 0.18 + 0.12 * Math.sin(world.time * 4);
      const grad = ctx.createRadialGradient
        ? ctx.createRadialGradient(view.w / 2, view.h / 2, view.h * 0.35, view.w / 2, view.h / 2, view.h * 0.72)
        : null;
      if (grad && grad.addColorStop) {
        grad.addColorStop(0, 'rgba(255, 0, 0, 0)');
        grad.addColorStop(1, 'rgba(255, 40, 60, ' + a.toFixed(3) + ')');
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = 'rgba(255, 40, 60, ' + (a * 0.5).toFixed(3) + ')';
      }
      ctx.fillRect(0, 0, view.w, view.h);
    }

    function overlayButtons() {
      const mobile = isTouchUI;
      const bw = mobile ? 200 : 220, bh = mobile ? 42 : 46;
      const cx = view.w / 2;
      const list = [];
      if (state.screen === 'start') {
        list.push({ x: cx - bw / 2, y: view.h / 2 + 70, w: bw, h: bh, label: '开始游戏', action: beginRun });
        list.push({
          x: cx - bw / 2, y: view.h / 2 + 130, w: bw, h: bh,
          label: dualsense.channel() === 'hid' ? 'PS5 增强已连接' : '连接 PS5 手柄（增强触觉）',
          action: () => { dualsense.connect(); speakerSfx.init(); }
        });
      } else if (state.screen === 'paused') {
        list.push({ x: cx - bw / 2, y: view.h / 2 + 10, w: bw, h: bh, label: '继续', action: () => setScreen('playing') });
        list.push({ x: cx - bw / 2, y: view.h / 2 + 70, w: bw, h: bh, label: '重新开始', action: restart });
        list.push({ x: cx - bw / 2, y: view.h / 2 + 130, w: bw, h: bh, label: '手柄设置', action: () => { ui.hapticsPanel = true; HAPTIC_UI.sel = 0; audio.play('ui'); } });

          x: cx - bw / 2, y: view.h / 2 + 80, w: bw, h: bh,
          label: state.screen === 'dead' ? '重新开始' : '再来一局',

        });

      return list;

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = (mobile ? 12 : 15) + 'px Consolas, monospace';
        ctx.fillText('存活 ' + world.time.toFixed(1) + 's · 击杀 ' + world.stats.kills + ' · 金币 ' + world.coins,
          view.w / 2, view.h / 2 - (mobile ? 32 : 40));
      } else if (state.screen === 'win') {

    function feedbackBlock(position, strength) {
      const b = new Uint8Array(11);
      b[0] = 0x21;

      strength = Math.max(1, Math.min(8, strength | 0));

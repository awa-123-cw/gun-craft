<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枪械工艺 GUNSMITH</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e16;
    font-family: "Consolas", "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script id="game-script">
'use strict';

// ===== utils =====
const utils = (() => {
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  return { clamp, lerp, rand, randInt, distance, rectsOverlap, mulberry32 };
})();

// ===== world =====
const Game = (() => {
  const VERSION = '0.1.0';

  function createGame(canvas) {
    const world = {
      player: { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, radius: 14, speed: 260 },
      enemies: [],
      bullets: [],
      particles: [],
      pickups: [],
      casings: [],
      floaters: [],
      tracers: [],
      impactMarks: [],
      room: { id: 0, type: 'start', x: 0, y: 0, w: 1500, h: 1100, cleared: false, doors: { n: false, e: false, s: false, w: false } },
      map: null,
      coins: 0,
      time: 0
    };
    const state = { screen: 'start', paused: false };
    const camera = { x: 0, y: 0 };
    const input = { keys: new Set(), pressedSet: new Set(), mouse: { x: 0, y: 0, down: false }, wheelDelta: 0 };

    function setScreen(name) { state.screen = name; }

    function update(dt) {
      world.time += dt;
    }

    function render(alpha) {
      // 渲染在后续任务实现
    }

    function start() {
      // 事件监听与 RAF 循环在后续任务实现
    }

    return {
      world, state, camera, input,
      update, render, start, setScreen,
      VERSION
    };
  }

  return { createGame, VERSION };
})();

if (typeof window !== 'undefined') window.Game = Game;

if (typeof window !== 'undefined' && window.document && window.document.body) {
  const canvas = window.document.getElementById('game');
  if (canvas) {
    const g = Game.createGame(canvas);
    g.start();
    window.game = g;
  }
}
</script>
</body>
</html>

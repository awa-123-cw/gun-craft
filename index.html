'use strict';

// ===== utils =====
const utils = (() => {
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function swapRemove(arr, i) {
    arr[i] = arr[arr.length - 1];
    arr.pop();
  }
  function circleRectHit(px, py, r, rect) {
    const nx = clamp(px, rect.x, rect.x + rect.w);
    const ny = clamp(py, rect.y, rect.y + rect.h);
    const dx = px - nx, dy = py - ny;
    return dx * dx + dy * dy < r * r;
  }
  function resolveCircleRect(px, py, r, rect) {
    const nx = clamp(px, rect.x, rect.x + rect.w);
    const ny = clamp(py, rect.y, rect.y + rect.h);
    const dx = px - nx, dy = py - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return { x: px, y: py };
    if (d2 === 0) {
      const left = px - rect.x, right = rect.x + rect.w - px;
      const top = py - rect.y, bottom = rect.y + rect.h - py;
      const m = Math.min(left, right, top, bottom);
      if (m === left) px = rect.x - r;
      else if (m === right) px = rect.x + rect.w + r;
      else if (m === top) py = rect.y - r;
      else py = rect.y + rect.h + r;
      return { x: px, y: py };
    }
    const d = Math.sqrt(d2);
    return { x: nx + (dx / d) * r, y: ny + (dy / d) * r };
  }
  return { clamp, lerp, rand, randInt, distance, rectsOverlap, mulberry32, swapRemove, circleRectHit, resolveCircleRect };
})();

// ===== world =====
const Game = (() => {

  const PARTS = {

        base: { pellet: 1, pierce: 2, bulletSpeedMul: 1.2 } },
      split_ammo: { id: 'split_ammo', slot: 'ammo', name: '分裂弹', rarity: 1, color: '#7ef29a', desc: '命中分裂为 3',

        base: {} },

        base: { spreadMul: 0.5, reloadMul: 0.8 } }

  // ===== partsEngine（词条/稀有度/掉落）=====
  const partsEngine = {
    rarityNames: ['普通', '优秀', '稀有', '史诗', '传说'],
    rarityColors: ['#cfd8d8', '#7ef29a', '#4dc9ff', '#b06cff', '#ff8f3d'],
    affixPool: [
      { stat: 'fireRate', label: '射速', pct: 0.08 },
      { stat: 'damage', label: '伤害', pct: 0.12 },
      { stat: 'magSize', label: '弹容', flat: 4 },
      { stat: 'reloadTime', label: '换弹', pct: -0.12 },
      { stat: 'pierce', label: '穿透', flat: 1 },
      { stat: 'critChance', label: '暴击率', flat: 0.06 },
      { stat: 'spread', label: '散布', pct: -0.20 }
    ],
    rollRarity() {
      const weights = [40, 30, 18, 9, 3];
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return 0;
    },
    rollAffixes(rarity) {
      const n = 1 + Math.floor(rarity / 2);
      const pool = partsEngine.affixPool.slice();
      const out = [];
      for (let i = 0; i < n && pool.length; i++) {
        out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      return out;
    },
    rollPart() {
      const slots = ['body', 'ammo', 'mod'];
      const slot = slots[Math.floor(Math.random() * slots.length)];
      const keys = Object.keys(PARTS[slot]).filter(id => id !== 'none_mod');
      const def = PARTS[slot][keys[Math.floor(Math.random() * keys.length)]];
      return {
        id: def.id, slot, name: def.name, rarity: def.rarity,
        color: def.color, desc: def.desc || '',
        affixes: partsEngine.rollAffixes(def.rarity)
      };
    },
    affixLabel(aff) {
      if (aff.pct) return aff.label + (aff.pct > 0 ? ' +' : ' ') + Math.round(aff.pct * 100) + '%';
      return aff.label + (aff.flat > 0 ? ' +' : ' ') + aff.flat;
    }
  };

  function makePart(id) {
    let slot = null, target = null;
    for (const s of ['body', 'ammo', 'mod']) {
      if (PARTS[s][id]) { slot = s; target = PARTS[s][id]; break; }
    }
    if (!target) throw new Error('未知部件: ' + id);
    return {
      id, slot, name: target.name, rarity: target.rarity,
      color: target.color, desc: target.desc || '', affixes: []
    };
  }

  function buildGun(bodyId, ammoId, modId) {
    const gun = {
      parts: { body: makePart(bodyId), ammo: makePart(ammoId), mod: makePart(modId) },
      stats: null,
      mag: 0,
      reloading: false,
      reloadT: 0,
      cooldown: 0
    };
    applyParts(gun);
    gun.mag = gun.stats.magSize;
    return gun;
  }

  function applyParts(gun) {
    const b = PARTS.body[gun.parts.body.id];
    const a = PARTS.ammo[gun.parts.ammo.id];
    const m = PARTS.mod[gun.parts.mod.id];
    const st = {
      fireRate: b.base.fireRate,
      damage: b.base.damage,
      magSize: b.base.magSize,
      reloadTime: b.base.reloadTime,
      spread: b.base.spread,
      pellet: (b.base.pellet || 1) * (a.base.pellet || 1),
      pierce: (b.base.pierce || 0) + (a.base.pierce || 0),
      bulletSpeed: 750 * (a.base.bulletSpeedMul || 1),
      critChance: 0.1,
      critMult: 2,
      splitCount: a.base.splitCount || 0,
      homing: !!a.base.homing,
      explosionRadius: a.base.explosionRadius || 0,
      chain: a.base.chain || 0,
      burnDps: 0, burnT: 0, slowPct: 0, slowT: 0, vamp: 0
    };
    if (m.base.critChance) st.critChance += m.base.critChance;
    if (m.base.critMult) st.critMult = m.base.critMult;
    if (m.base.fireRateMul) st.fireRate *= m.base.fireRateMul;
    if (m.base.vamp) st.vamp = m.base.vamp;
    if (m.base.burnDps) { st.burnDps = m.base.burnDps; st.burnT = m.base.burnT; }
    if (m.base.slowPct) { st.slowPct = m.base.slowPct; st.slowT = m.base.slowT; }
    if (m.base.spreadMul) st.spread *= m.base.spreadMul;
    if (m.base.reloadMul) st.reloadTime *= m.base.reloadMul;

    for (const s of ['body', 'ammo', 'mod']) {
      const part = gun.parts[s];
      for (const aff of part.affixes) {
        if (aff.pct) st[aff.stat] *= (1 + aff.pct);
        else st[aff.stat] += aff.flat;
      }
    }

    st.fireRate = utils.clamp(st.fireRate, 1, 25);
    st.damage = utils.clamp(st.damage, 1, 120);
    st.magSize = utils.clamp(Math.round(st.magSize), 1, 60);
    st.reloadTime = Math.max(0.2, st.reloadTime);
    st.pierce = Math.min(3, st.pierce);
    st.critChance = Math.min(0.5, st.critChance);
    st.spread = Math.max(0.001, st.spread);
    gun.stats = st;
  }

  // ===== map（房间地图生成）=====
  const mapModule = {
    generate(seed, layer) {
      const rng = utils.mulberry32(seed || 1);
      const lv = layer || 1;
      const W = lv >= 2 ? 4 : 3;
      const H = lv >= 2 ? 4 : 3;
      const fillP = lv >= 2 ? 0.85 : 0.95;
      const minRooms = lv >= 2 ? 12 : 8;
      const cells = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (rng() < fillP) cells.push({ x, y });
        }
      }
      if (!cells.some(c => c.x === 0 && c.y === 0)) cells.push({ x: 0, y: 0 });
      if (cells.length < minRooms) {
        for (let y = 0; y < H && cells.length < minRooms; y++) {
          for (let x = 0; x < W && cells.length < minRooms; x++) {
            if (!cells.some(c => c.x === x && c.y === y)) cells.push({ x, y });
          }
        }
      }
      const key = (x, y) => x + ',' + y;
      const cellSet = new Set(cells.map(c => key(c.x, c.y)));
      const neighborsOf = c => [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .map(([dx, dy]) => ({ x: c.x + dx, y: c.y + dy }))
        .filter(n => cellSet.has(key(n.x, n.y)));
      const addCell = (x, y) => {
        const k = key(x, y);
        if (!cellSet.has(k)) {
          cellSet.add(k);
          cells.push({ x, y });
        }
      };
      const connectedToStart = () => {
        const seen = new Set([key(0, 0)]);
        const q = [{ x: 0, y: 0 }];
        while (q.length) {
          const c = q.shift();
          for (const n of neighborsOf(c)) {
            const nk = key(n.x, n.y);
            if (!seen.has(nk)) { seen.add(nk); q.push(n); }
          }
        }
        return seen;
      };
      // 连通化：把所有房间格连到起点（必要时补中间格）
      let seen = connectedToStart();
      for (let guard = 0; guard < 30 && seen.size < cellSet.size; guard++) {
        let best = null, bestD = 1e9;
        for (const c of cells) {
          if (seen.has(key(c.x, c.y))) continue;
          let dMin = 1e9, near = null;
          for (const sk of seen) {
            const [sx, sy] = sk.split(',').map(Number);
            const d = Math.abs(sx - c.x) + Math.abs(sy - c.y);
            if (d < dMin) { dMin = d; near = { x: sx, y: sy }; }
          }
          if (dMin < bestD) { bestD = dMin; best = { c, near }; }
        }
        if (!best) break;
        let cx = best.c.x, cy = best.c.y;
        while (cx !== best.near.x || cy !== best.near.y) {
          let sx = 0, sy = 0;
          if (cx > best.near.x) sx = -1;
          else if (cx < best.near.x) sx = 1;
          else if (cy > best.near.y) sy = -1;
          else if (cy < best.near.y) sy = 1;
          cx += sx;
          cy += sy;
          addCell(cx, cy);
        }
        seen = connectedToStart();
      }
      const rooms = cells.map(c => {
        const doors = { n: false, e: false, s: false, w: false };
        if (cells.some(o => o.x === c.x && o.y === c.y - 1)) doors.n = true;
        if (cells.some(o => o.x === c.x + 1 && o.y === c.y)) doors.e = true;
        if (cells.some(o => o.x === c.x && o.y === c.y + 1)) doors.s = true;
        if (cells.some(o => o.x === c.x - 1 && o.y === c.y)) doors.w = true;
        return {
          x: c.x, y: c.y, w: ROOM_W, h: ROOM_H,
          type: 'combat', doors,
          spawned: false, cleared: false, depth: 0
        };
      });
      const depthMap = { '0,0': 0 };
      const q = [rooms.find(r => r.x === 0 && r.y === 0)];
      while (q.length) {
        const r = q.shift();
        for (const d of ['n', 'e', 's', 'w']) {
          if (!r.doors[d]) continue;
          const nx = r.x + (d === 'e' ? 1 : d === 'w' ? -1 : 0);
          const ny = r.y + (d === 's' ? 1 : d === 'n' ? -1 : 0);
          const k = nx + ',' + ny;
          if (depthMap[k] === undefined) {
            const nr = rooms.find(ro => ro.x === nx && ro.y === ny);
            if (nr) {
              depthMap[k] = depthMap[r.x + ',' + r.y] + 1;
              q.push(nr);
            }
          }
        }
      }
      for (const r of rooms) r.depth = depthMap[r.x + ',' + r.y] || 0;
      const start = rooms.find(r => r.x === 0 && r.y === 0);
      start.type = 'start';
      start.cleared = true;
      start.spawned = true;
      let boss = rooms[0];
      for (const r of rooms) if (r.depth > boss.depth) boss = r;
      boss.type = 'boss';
      const others = rooms.filter(r => r !== start && r !== boss);
      for (let i = others.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const t = others[i]; others[i] = others[j]; others[j] = t;
      }
      let ti = 0;
      if (others[ti]) { others[ti].type = 'treasure'; ti++; }
      if (others[ti]) { others[ti].type = 'shop'; ti++; }
      if (others[ti]) { others[ti].type = 'coin'; ti++; }
      if (others[ti]) { others[ti].type = 'elite'; ti++; }
      return { rooms, start: { x: 0, y: 0 }, boss: { x: boss.x, y: boss.y }, gridW: W, gridH: H };
    }
  };

  const GUN_SOUNDS = { pistol_body: 'pistol', smg_body: 'smg', shotgun_body: 'shotgun', sniper_body: 'sniper', heavy_body: 'heavy' };
  const GUN_RECOIL = { pistol_body: 0.35, smg_body: 0.22, shotgun_body: 0.75, sniper_body: 0.9, heavy_body: 0.85 };
  const PART_DEFAULTS = { body: 'pistol_body', ammo: 'standard_ammo', mod: 'none_mod' };
  const MINIMAP_COLORS = {
    start: '#35e0ff', combat: 'rgba(122, 152, 178, 0.75)',
    treasure: '#b06cff', shop: '#ffd166', coin: '#ffe14d',
    elite: '#ff9f43', boss: '#ff3d81'
  };
  const LAYER_ACCENTS = ['#35e0ff', '#ffb347'];

  // ===== ENEMY_KINDS =====
  const ENEMY_KINDS = {
    chaser: {
      name: '冲锋者', color: '#ff4d5e', coreColor: '#7a0d1e',

    },
    shooter: {

    },
    splitter: {

    },
    splitter_mini: {

    },
    buzzer: {
      name: '穿梭者', color: '#4dc9ff', coreColor: '#0b3d5e',
      hp: 12, radius: 12, speed: 0, dmg: 10,
      behavior: 'buzzer', dashSpeed: 600, dashT: 0.7, waitT: 0.35,
      dashShots: 2, dashShotSpeed: 360
    },
    elite: {
      name: '护卫精英', color: '#b06cff', coreColor: '#3d0f73',
      hp: 90, radius: 30, speed: 55, dmg: 20,
      behavior: 'elite', shield: 40, maxShield: 40, shieldRegen: 30,
      dashCooldown: 2.2, telegraphT: 0.35
    },
    boss: {
      name: '机械核心', color: '#ff3d81', coreColor: '#5c0a2e',

      behavior: 'boss', ringSegs: 14, rotSpeed: 0.6,
      burstCd: 1.8, summonCd: 10
    }
  };

  // ===== audio（WebAudio 合成）=====
  const audio = (() => {
    let actx = null;
    function ac() {
      if (!actx && typeof AudioContext !== 'undefined') {
        try { actx = new AudioContext(); } catch (e) { actx = null; }
      }
      return actx;
    }
    function tone(f0, f1, dur, type, vol, delay) {
      const a = ac();
      if (!a) return;
      const t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(1, f0), t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(t0);
      o.stop(t0 + dur);
    }
    function noise(dur, vol, cutoff) {
      const a = ac();
      if (!a) return;
      const sr = a.sampleRate || 44100;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = a.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource();
      src.buffer = buf;
      const g = a.createGain();
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      let node = src;
      if (cutoff && a.createFilter) {
        const f = a.createFilter();
        f.frequency.setValueAtTime(cutoff, a.currentTime);
        src.connect(f);
        node = f;
      }
      node.connect(g);
      g.connect(a.destination);
      src.start();
    }
    function play(name, opt) {
      const a = ac();
      if (!a) return;
      if (a.state === 'suspended') { try { a.resume(); } catch (e) {} }
      switch (name) {
        case 'pistol':

        case 'door':

          {
            const c = Math.min(8, opt || 1);
            tone(500 + c * 70, 700 + c * 90, 0.09, 'square', 0.12);
          }
          break;
        case 'lowhp':
          tone(72, 54, 0.15, 'sine', 0.24);
          tone(60, 46, 0.12, 'sine', 0.18, 0.17);
          break;
        case 'reload_done':
          tone(520, 900, 0.05, 'square', 0.14);
          tone(900, 1350, 0.06, 'square', 0.11, 0.05);
          break;
        case 'dash':

    }
    return { play };
  })();

  function createGame(canvas) {
    const world = {
      player: {
        x: ROOM_W / 2, y: ROOM_H / 2, vx: 0, vy: 0,
        hp: 100, maxHp: 100, radius: 14, speed: 260,
        aimAngle: 0, invuln: 0, recoil: 0
      },
      guns: [buildGun('pistol_body', 'standard_ammo', 'none_mod'), buildGun('pistol_body', 'standard_ammo', 'none_mod')],
      activeGun: 0,
      enemies: [],
      bullets: [],
      particles: [],
      pickups: [],
      casings: [],
      floaters: [],
      tracers: [],
      impactMarks: [],
      room: { id: 0, type: 'start', x: 0, y: 0, w: ROOM_W, h: ROOM_H, cleared: false, doors: { n: false, e: false, s: false, w: false } },
      map: null,
      coins: 0,
      time: 0,
      stats: { kills: 0, combo: 0, comboT: -9, score: 0 },
      enemySeq: 0,
      inventory: [],
      chains: [],
      shopOffers: [],
      shopPrices: [],
      shopPos: null,
      chest: null,
      coinPile: null,
      mapInfo: { roomPos: { x: 0, y: 0 }, totalRooms: 0, clearedRooms: 0 },
      transition: { active: false, t: 0, rx: 0, ry: 0 },
      hpDelay: 100,
      lowhpT: 0,
      dash: { cd: 0, active: false, t: 0, angle: 0, ghostT: 0 },
      dashGhosts: [],
      layer: 1,
      maxLayers: 2
    };
    const state = { screen: 'start', paused: false };
    const ui = { panel: 'none', title: '', items: [], loadout: [], loadoutChips: [], scroll: 0, maxScroll: 0 };
    const camera = { x: world.player.x, y: world.player.y };
    const input = { keys: new Set(), pressedSet: new Set(), mouse: { x: 0, y: 0, down: false, downPrev: false }, wheelDelta: 0, frameHandled: false };
    const view = { w: canvas.clientWidth || canvas.width || 960, h: canvas.clientHeight || canvas.height || 540 };
    const ctx = canvas.getContext('2d');
    let acc = 0, last = 0, raf = 0;

    function gun() { return world.guns[world.activeGun]; }
    function accent() {
      return LAYER_ACCENTS[Math.min(world.layer, LAYER_ACCENTS.length) - 1] || '#35e0ff';
    }
    function rebuildGun(i) {
      const g = world.guns[i];
      applyParts(g);
      g.mag = Math.min(g.mag, g.stats.magSize);
    }

    function pushPart(part) {
      if (world.inventory.length >= 12) world.inventory.shift();
      world.inventory.push(part);
    }

    function equipPart(part) {
      const g = gun();
      const old = g.parts[part.slot];
      g.parts[part.slot] = part;
      rebuildGun(world.activeGun);
      const idx = world.inventory.indexOf(part);
      if (idx >= 0) utils.swapRemove(world.inventory, idx);
      if (old && old !== part && old.id !== 'none_mod') pushPart(old);
      audio.play('ui');
      return old;
    }

    function unequipPart(slot) {
      const g = gun();
      const old = g.parts[slot];
      const defId = PART_DEFAULTS[slot];
      if (old.id === defId) return;
      g.parts[slot] = makePart(defId);
      rebuildGun(world.activeGun);
      pushPart(old);
      audio.play('ui');
    }

    function spawnPickup(kind, x, y, payload) {
      world.pickups.push({
        kind, x, y,
        vx: utils.rand(-40, 40), vy: utils.rand(-40, 40),
        life: 30,
        part: kind === 'part' ? payload : null,
        value: kind === 'coin' ? payload : 0
      });
    }

    // ===== 敌人 =====
    function spawnEnemy(kind, x, y, scale) {
      const k = ENEMY_KINDS[kind];
      const s = scale || 1;
      const hpScale = 1 + (s - 1) * 0.6;
      return {
        id: world.enemySeq++,
        kind, x, y, vx: 0, vy: 0,
        hp: k.hp * hpScale, maxHp: k.hp * hpScale,
        radius: k.radius * s, color: k.color, coreColor: k.coreColor,
        scale: s, speed: k.speed, dmg: k.dmg,
        behavior: k.behavior,
        state: 'idle', stateT: 0, flash: 0,
        kbvx: 0, kbvy: 0, hitCd: 0, dead: false,
        dashAngle: 0, fireT: k.fireInterval || 0, attackT: 0,
        shield: k.shield || 0, maxShield: k.maxShield || (k.shield || 0),
        shieldRegen: k.shieldRegen || 0, shieldDelay: 0,
        extra: { gen: 0, target: null, waitT: 0, dashT: 0, dashDirX: 0, dashDirY: 0 },
        phase: 1, rotation: 0, rotSpeed: k.rotSpeed || 0,
        ringSegs: k.ringSegs || 0,
        burstCd: k.burstCd || 0, summonCd: k.summonCd || 0, dashCd: 0
      };
    }

    function spawnEnemyBullet(x, y, angle, speed, damage, color) {
      world.bullets.push({
        x, y, px: x, py: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage, pierce: 0, friendly: false,
        life: 6, color: color || '#ff9f43', size: 4, kind: 'enemy'
      });
    }

    function updateEnemies(dt) {
      for (let i = world.enemies.length - 1; i >= 0; i--) {
        const e = world.enemies[i];
        e.flash -= dt;
        e.hitCd -= dt;
        if (e.shieldRegen && e.shield < e.maxShield) {
          e.shieldDelay -= dt;
          if (e.shieldDelay <= 0) e.shield = Math.min(e.maxShield, e.shield + e.shieldRegen * dt);
        }
        if (e.burnT > 0) {
          e.burnT -= dt;
          e.hp -= (e.burnDps || 0) * dt;
          if (Math.random() < dt * 8) {
            fx.spawn({
              kind: 'spark', x: e.x + utils.rand(-e.radius * 0.5, e.radius * 0.5),
              y: e.y + utils.rand(-e.radius * 0.5, e.radius * 0.5),
              vx: utils.rand(-30, 30), vy: utils.rand(-50, -10),
              life: 0.25, color: '#ff9f43', size: 2
            });
          }
          if (e.hp <= 0) { killEnemy(e); continue; }
        }
        if (e.slowT > 0) e.slowT -= dt;
        e.x += e.kbvx * dt;
        e.y += e.kbvy * dt;
        const kbDamp = Math.exp(-10 * dt);
        e.kbvx *= kbDamp;
        e.kbvy *= kbDamp;
        updateEnemyAI(e, dt);
        e.x = utils.clamp(e.x, e.radius, world.room.w - e.radius);
        e.y = utils.clamp(e.y, e.radius, world.room.h - e.radius);
        const resE = resolveObstaclesFor(e.x, e.y, e.radius);
        e.x = resE.x;
        e.y = resE.y;
      }
    }

    function updateEnemyAI(e, dt) {
      const p = world.player;
      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const ux = dx / dist;
      const uy = dy / dist;
      const k = ENEMY_KINDS[e.kind];

      e.stateT -= dt;
      if (e.behavior === 'chase_telegraph_dash') {
        const spd = e.speed * (e.slowT > 0 ? (1 - (e.slowPct || 0)) : 1);
        if (e.state === 'idle') {
          e.x += ux * spd * dt;
          e.y += uy * spd * dt;
          if (dist < (k.engageRange || 260)) { e.state = 'telegraph'; e.stateT = k.telegraphT; }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            e.state = 'dash';
            e.dashAngle = Math.atan2(dy, dx);
            e.stateT = 0.35;
            const shards = k.shardCount || 0;
            for (let s2 = 0; s2 < shards; s2++) {
              spawnEnemyBullet(
                e.x, e.y,
                Math.atan2(dy, dx) + (s2 - (shards - 1) / 2) * 0.16,
                300, e.dmg * 0.5, e.color
              );
            }
          }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * k.dashSpeed * dt;
          e.y += Math.sin(e.dashAngle) * k.dashSpeed * dt;
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.cooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'keep_distance_shoot') {
        const spd = e.speed * (e.slowT > 0 ? (1 - (e.slowPct || 0)) : 1);
        if (dist < 220) {
          e.x -= ux * spd * dt;
          e.y -= uy * spd * dt;
        } else if (dist > k.range) {
          e.x += ux * spd * dt;
          e.y += uy * spd * dt;
        } else {
          e.x += (-uy) * spd * 0.5 * dt;
          e.y += ux * spd * 0.5 * dt;
        }
        e.fireT -= dt;
        if (e.fireT <= 0 && dist < k.range + 30) {
          e.fireT = k.fireInterval;
          const burst = k.burst || 1;
          const baseA = Math.atan2(dy, dx);
          for (let b2 = 0; b2 < burst; b2++) {
            spawnEnemyBullet(
              e.x, e.y,
              baseA + (b2 - (burst - 1) / 2) * (k.burstSpread || 0.06),
              k.bulletSpeed, e.dmg, e.color
            );
          }
        }
      } else if (e.behavior === 'splitter') {
        e.x += ux * e.speed * dt;
        e.y += uy * e.speed * dt;
        e.attackT -= dt;
        if (e.attackT <= 0 && dist < (k.spitRange || 150)) {
          e.attackT = k.spitInterval || 1.6;
          const baseA = Math.atan2(dy, dx);
          spawnEnemyBullet(e.x, e.y, baseA - 0.25, 190, e.dmg * 0.7, e.color);
          spawnEnemyBullet(e.x, e.y, baseA + 0.25, 190, e.dmg * 0.7, e.color);
        }
        if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, Math.atan2(dy, dx));
      } else if (e.behavior === 'buzzer') {
        const ex = e.extra;
        if (e.state === 'idle' || e.state === 'wait') {
          if (e.state === 'idle') { e.state = 'wait'; e.stateT = 0.4; }
          if (e.stateT <= 0) {
            ex.target = { x: utils.rand(120, world.room.w - 120), y: utils.rand(120, world.room.h - 120) };
            e.state = 'telegraph';
            e.stateT = 0.3;
          }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            const tx = ex.target.x - e.x, ty = ex.target.y - e.y;
            const l = Math.hypot(tx, ty) || 1;
            ex.dashDirX = tx / l;
            ex.dashDirY = ty / l;
            e.state = 'dash';
            e.stateT = k.dashT;
            const shots = k.dashShots || 0;
            const baseA = Math.atan2(dy, dx);
            for (let s2 = 0; s2 < shots; s2++) {
              spawnEnemyBullet(
                e.x, e.y,
                baseA + (s2 - (shots - 1) / 2) * 0.15,
                k.dashShotSpeed || 360, e.dmg * 0.5, e.color
              );
            }
          }
        } else if (e.state === 'dash') {
          e.x += ex.dashDirX * k.dashSpeed * dt;
          e.y += ex.dashDirY * k.dashSpeed * dt;
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, Math.atan2(dy, dx));
          if (Math.random() < dt * 30) {
            fx.spawn({
              kind: 'spark', x: e.x, y: e.y,
              vx: utils.rand(-20, 20), vy: utils.rand(-20, 20),
              life: 0.3, color: e.color, size: 2
            });
          }
          if (e.stateT <= 0) { e.state = 'wait'; e.stateT = k.waitT; }
        }
      } else if (e.behavior === 'elite') {
        if (e.state === 'idle') {
          if (dist > 200) {
            e.x += ux * e.speed * dt;
            e.y += uy * e.speed * dt;
          } else {
            e.state = 'telegraph';
            e.stateT = k.telegraphT;
          }
        } else if (e.state === 'telegraph') {
          if (e.stateT <= 0) {
            e.dashAngle = Math.atan2(dy, dx);
            e.state = 'dash';
            e.stateT = 0.25;
            for (let a2 = 0; a2 < Math.PI * 2; a2 += Math.PI / 3) {
              spawnEnemyBullet(e.x, e.y, a2, 240, e.dmg * 0.6, e.color);
            }
            audio.play('zap');
          }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.dashAngle) * 420 * dt;
          e.y += Math.sin(e.dashAngle) * 420 * dt;
          if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
          if (e.stateT <= 0) { e.state = 'recover'; e.stateT = k.dashCooldown; }
        } else if (e.state === 'recover') {
          if (e.stateT <= 0) e.state = 'idle';
        }
      } else if (e.behavior === 'boss') {
        const def = ENEMY_KINDS[e.kind];
        e.rotation += def.rotSpeed * dt * (e.phase >= 3 ? 2 : 1);
        const pct = e.hp / e.maxHp;
        if (pct <= 0.3 && e.phase < 3) {
          e.phase = 3;
          fx.burst(e.x, e.y, '#ff4d5e', 20);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        } else if (pct <= 0.6 && e.phase < 2) {
          e.phase = 2;
          fx.burst(e.x, e.y, '#ffd166', 16);
          fx.shake(6);
          audio.play('roar');
          fx.slowmo(0.4, 0.3);
        }
        e.x += ux * e.speed * dt;
        e.y += uy * e.speed * dt;
        e.burstCd -= dt;
        const interval = e.phase >= 3 ? 0.7 : e.phase === 2 ? 0.9 : 1.8;
        if (e.burstCd <= 0) {
          e.burstCd = interval;
          const count = e.phase >= 3 ? 24 : 12;
          const off = (e.phase >= 2 ? 15 : 0) * Math.PI / 180;
          for (let a2 = off; a2 < Math.PI * 2 + off; a2 += Math.PI * 2 / count) {
            spawnEnemyBullet(e.x, e.y, a2, 260, e.dmg, '#ff3d81');
          }
          if (e.phase === 1 && Math.random() < 0.3) {
            for (let f = -1; f <= 1; f++) {
              spawnEnemyBullet(e.x, e.y, Math.atan2(dy, dx) + f * 0.22, 300, e.dmg, '#ff3d81');
            }
          }
          audio.play('zap');
        }
        if (e.phase >= 2) {
          e.summonCd -= dt;
          const buzzers = world.enemies.filter(x => x.kind === 'buzzer').length;
          if (e.summonCd <= 0 && buzzers < 4) {
            e.summonCd = 10;
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
            world.enemies.push(spawnEnemy('buzzer', e.x + utils.rand(-80, 80), e.y + utils.rand(-80, 80), 1));
          }
        }
        if (e.phase >= 3) {
          e.dashCd -= dt;
          if (e.state === 'idle' && e.dashCd <= 0) {
            e.state = 'telegraph';
            e.stateT = 0.5;
          } else if (e.state === 'telegraph') {
            if (e.stateT <= 0) {
              e.dashAngle = Math.atan2(dy, dx);
              e.state = 'dash';
              e.stateT = 0.4;
            }
          } else if (e.state === 'dash') {
            e.x += Math.cos(e.dashAngle) * 520 * dt;
            e.y += Math.sin(e.dashAngle) * 520 * dt;
            if (dist < e.radius + p.radius + 4) damagePlayer(e.dmg, e.dashAngle);
            if (e.stateT <= 0) {
              e.state = 'recover';
              e.stateT = 1.0;
              e.dashCd = 2.5;
            }
          } else if (e.state === 'recover') {
            if (e.stateT <= 0) e.state = 'idle';
          }
        }
      }
    }

    // ===== fx（粒子/弹壳/曳光，对象池）=====
    const fx = {
      poolLimit: 1500,
      spawn(o) {
        if (world.particles.length >= fx.poolLimit) world.particles.shift();
        world.particles.push(Object.assign({ maxLife: o.life, rot: 0, vr: 0 }, o));
      },
      muzzle(x, y, angle, color) {
        for (let i = 0; i < 5; i++) {
          const a = angle + (Math.random() - 0.5) * 0.9;
          const sp = 130 + Math.random() * 200;
          fx.spawn({
            kind: 'muzzle', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.05 + Math.random() * 0.045,
            color, size: 3 + Math.random() * 4
          });
        }
      },
      casing(x, y, angle) {
        world.casings.push({
          x, y,
          vx: Math.cos(angle + Math.PI / 2) * 130 + utils.rand(-40, 40),
          vy: Math.sin(angle + Math.PI / 2) * 130 - 90,
          rot: Math.random() * Math.PI * 2,
          vr: utils.rand(-12, 12),
          life: 1.4
        });
      },
      smoke(x, y) {
        fx.spawn({
          kind: 'smoke', x: x + utils.rand(-3, 3), y: y + utils.rand(-3, 3),
          vx: utils.rand(-15, 15), vy: utils.rand(-15, 15),
          life: 0.35 + Math.random() * 0.2,
          color: '#8fa6b8', size: 4
        });
      },
      sparks(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 90 + Math.random() * 190;
          fx.spawn({
            kind: 'spark', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.18 + Math.random() * 0.15,
            color, size: 1.5 + Math.random() * 2
          });
        }
      },
      burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 60 + Math.random() * 220;
          fx.spawn({
            kind: 'burst', x, y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.5 + Math.random() * 0.4,
            color, size: 2.5 + Math.random() * 4,
            rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10
          });
        }
      },
      floater(x, y, text, kind) {
        world.floaters.push({
          x: x + utils.rand(-6, 6), y, text,
          kind: kind || 'normal', life: 0.7, maxLife: 0.7
        });
      },
      shake(power) {
        fx.shakePower = Math.min(12, Math.max(fx.shakePower || 0, power));
      },
      hitStop(ms) {
        fx.hitStopMs = Math.max(fx.hitStopMs || 0, ms);
      },
      slowmo(factor, sec) {
        fx.slowmoFactor = factor;
        fx.slowmoT = sec;
      }
    };
    fx.shakePower = 0;
    fx.hitStopMs = 0;
    fx.slowmoFactor = 1;
    fx.slowmoT = 0;

    // ===== 战斗结算 =====
    function damageEnemy(e, dmg, angle, opts) {
      if (!e || e.dead) return { died: false, crit: false };
      const o = opts || {};
      if (e.shield > 0) {
        e.shield -= dmg;
        e.shieldDelay = 3;
        e.flash = 0.08;
        fx.sparks(e.x, e.y, '#b06cff', 4);
        fx.floater(e.x, e.y - e.radius - 8, '盾', 'normal');
        audio.play('hit');
        if (e.shield <= 0) {
          e.shield = 0;
          fx.burst(e.x, e.y, '#b06cff', 10);
          audio.play('kill');
          e.state = 'recover';
          e.stateT = 0.8;
        }
        return { died: false, crit: false };
      }
      const crit = !!o.critChance && Math.random() < o.critChance;
      const final = crit ? dmg * (o.critMult || 2) : dmg;
      e.hp -= final;
      e.flash = 0.08;
      if (e.kind !== 'boss') {
        const kb = (18 + Math.min(20, dmg * 0.25)) * (e.kind === 'elite' ? 0.3 : 1);
        e.kbvx = Math.cos(angle) * kb;
        e.kbvy = Math.sin(angle) * kb;
      }
      fx.sparks(e.x, e.y, e.color, 5);
      fx.floater(e.x, e.y - e.radius - 8, String(Math.round(final)), crit ? 'crit' : 'normal');
      if (o.burnDps) { e.burnDps = o.burnDps; e.burnT = o.burnT; }
      if (o.slowPct) { e.slowPct = o.slowPct; e.slowT = o.slowT; }
      audio.play('hit');
      if (e.hp <= 0) {
        if (o.vamp) world.player.hp = Math.min(world.player.maxHp, world.player.hp + o.vamp);
        killEnemy(e);
        return { died: true, crit };
      }
      return { died: false, crit };
    }

    function killEnemy(e) {
      if (e.dead) return;
      e.dead = true;
      if (e.kind === 'boss') {
        fx.slowmo(0.3, 0.5);
        fx.hitStop(120);
        audio.play('roar');
        if (world.layer >= world.maxLayers) {
          for (let i = 0; i < 4; i++) {
            spawnPickup('part', e.x + utils.rand(-70, 70), e.y + utils.rand(-70, 70), partsEngine.rollPart());
          }
          spawnPickup('medkit', e.x, e.y + 60, 0);
          spawnPickup('medkit', e.x, e.y - 60, 0);
          setScreen('win');
        } else {
          world.transition = { active: true, t: 0, rx: 'next', ry: 0 };
        }
      }
      const idx = world.enemies.indexOf(e);
      if (idx >= 0) utils.swapRemove(world.enemies, idx);
      const def = ENEMY_KINDS[e.kind];
      if (e.behavior === 'splitter' && def.splitKind && (e.extra.gen || 0) < (def.maxGen || 1)) {
        for (let s = 0; s < (def.splitCount || 2); s++) {
          const mini = spawnEnemy(def.splitKind, e.x + utils.rand(-12, 12), e.y + utils.rand(-12, 12), 1);
          mini.extra.gen = (e.extra.gen || 0) + 1;
          mini.hp = mini.maxHp;
          world.enemies.push(mini);
        }
      }
      fx.burst(e.x, e.y, e.color, 8);
      fx.hitStop(60);
      audio.play('kill');
      world.stats.kills++;
      updateCombo();
      maybeDrop(e);
      world.dash.cd = 0;
      if (e.scale > 1) fx.slowmo(0.3, 0.25);
    }

    function damagePlayer(dmg, angle) {
      const p = world.player;
      if (p.invuln > 0) return;
      p.hp -= dmg;
      p.invuln = 0.4;
      p.vx += Math.cos(angle) * 300;
      p.vy += Math.sin(angle) * 300;
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > 800) {
        p.vx = (p.vx / spd) * 800;
        p.vy = (p.vy / spd) * 800;
      }
      fx.shake(4);
      fx.sparks(p.x, p.y, '#ff4d5e', 6);
      fx.floater(p.x, p.y - 20, '-' + dmg, 'normal');
      audio.play('hit');
      if (p.hp <= 0) {
        p.hp = 0;
        setScreen('dead');
      }
    }

    function maybeDrop(e) {
      if (e.scale > 1.5) {
        spawnPickup('part', e.x, e.y, partsEngine.rollPart());
        return;
      }
      const r = Math.random();
      if (r < 0.03) spawnPickup('part', e.x, e.y, partsEngine.rollPart());
      else if (r < 0.09 && world.player.hp < world.player.maxHp * 0.5) spawnPickup('medkit', e.x, e.y, 0);
      else if (r < 0.24) spawnPickup('coin', e.x, e.y, 3);
    }

    function updateCombo() {
      const now = world.time;
      if (now - world.stats.comboT < 0.5) world.stats.combo++;
      else world.stats.combo = 1;
      world.stats.comboT = now;
      if (world.stats.combo >= 3) audio.play('combo', world.stats.combo);
    }

    function setScreen(name) {
      state.screen = name;
      state.paused = name === 'paused';
    }

    function resetState() {
      world.player = {
        x: ROOM_W / 2, y: ROOM_H / 2, vx: 0, vy: 0,
        hp: 100, maxHp: 100, radius: 14, speed: 260,
        aimAngle: 0, invuln: 0, recoil: 0
      };
      world.guns = [buildGun('pistol_body', 'standard_ammo', 'none_mod'), buildGun('pistol_body', 'standard_ammo', 'none_mod')];
      world.activeGun = 0;
      world.enemies.length = 0;
      world.bullets.length = 0;
      world.particles.length = 0;
      world.pickups.length = 0;
      world.casings.length = 0;
      world.floaters.length = 0;
      world.tracers.length = 0;
      world.impactMarks.length = 0;
      world.chains.length = 0;
      world.room = { id: 0, type: 'start', x: 0, y: 0, w: ROOM_W, h: ROOM_H, cleared: false, doors: { n: false, e: false, s: false, w: false } };
      world.map = null;
      world.coins = 0;
      world.time = 0;
      world.stats = { kills: 0, combo: 0, comboT: -9, score: 0 };
      world.inventory.length = 0;
      world.shopOffers.length = 0;
      world.shopPrices.length = 0;
      world.shopPos = null;
      world.chest = null;
      world.chestPart = null;
      world.coinPile = null;
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: 0, clearedRooms: 0 };
      world.transition.active = false;
      world.hpDelay = 100;
      world.lowhpT = 0;
      world.dash = { cd: 0, active: false, t: 0, angle: 0, ghostT: 0 };
      world.dashGhosts.length = 0;
      world.layer = 1;
      world.maxLayers = 2;
      camera.x = ROOM_W / 2;
      camera.y = ROOM_H / 2;
      input.keys.clear();
      input.pressedSet.clear();
      input.mouse.down = false;
      input.wheelDelta = 0;
      ui.panel = 'none';
      ui.items = [];
      ui.title = '';
      fx.hitStopMs = 0;
      fx.shakePower = 0;
      fx.slowmoFactor = 1;
      fx.slowmoT = 0;
    }

    function beginRun() {
      resetState();
      startMap(Math.floor(Math.random() * 100000) + 1);
      setScreen('playing');
    }

    function restart() {
      resetState();
      setScreen('start');
    }

    // ---------- input ----------
    function onKeyDown(e) {
      const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyR', 'KeyE', 'KeyB', 'Digit1', 'Digit2', 'Escape', 'Enter', 'Tab'];
      if (GAME_KEYS.includes(e.code)) e.preventDefault();
      if (!e.repeat) { input.keys.add(e.code); input.pressedSet.add(e.code); }
    }
    function onKeyUp(e) { input.keys.delete(e.code); }
    function onMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;
    }
    function onMouseDown(e) {
      if (e.button !== 0) return;
      if (canvas.focus) canvas.focus();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      if (ui.panel !== 'none') {
        uiClick(mx, my);
        return;
      }
      if (state.screen !== 'playing') {
        for (const b of overlayButtons()) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            b.action();
            return;
          }
        }
        return;
      }
      input.mouse.down = true;
    }
    function onMouseUp(e) { if (e.button === 0) input.mouse.down = false; }
    function onWheel(e) {
      if (ui.panel === 'parts') {
        ui.scroll = utils.clamp((ui.scroll || 0) + (e.deltaY > 0 ? 30 : -30), 0, ui.maxScroll || 0);
        e.preventDefault();
        return;
      }
      input.wheelDelta += e.deltaY;
      e.preventDefault();
    }
    function onBlur() { input.keys.clear(); input.pressedSet.clear(); input.mouse.down = false; }
    function onResize() {
      const dpr = Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
      view.w = canvas.clientWidth || window.innerWidth || 960;
      view.h = canvas.clientHeight || window.innerHeight || 540;
      canvas.width = Math.round(view.w * dpr);
      canvas.height = Math.round(view.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ---------- update ----------
    function update(dt) {
      input.frameHandled = false;
      if (input.pressedSet.size) {
        if (input.pressedSet.has('Escape')) {
          if (ui.panel !== 'none') {
            closePanel();
          } else if (state.screen === 'playing') {
            setScreen('paused');
          } else if (state.screen === 'paused') {
            setScreen('playing');
          }
        }
        if (input.pressedSet.has('Enter') &&
            (state.screen === 'start' || state.screen === 'dead' || state.screen === 'win')) {
          beginRun();
        }
        if (input.pressedSet.has('KeyB')) {
          if (ui.panel === 'parts') closePanel();
          else openPanel('parts');
        }
        if (input.pressedSet.has('KeyE')) {
          if (ui.panel !== 'none') {
            closePanel();
          } else {
            const p = world.player;
            if (world.chest && !world.chest.opened &&
                utils.distance(p.x, p.y, world.chest.x, world.chest.y) < 100) {
              world.chestPart = partsEngine.rollPart();
              openPanel('chest');
            } else if (world.coinPile && !world.coinPile.collected &&
                utils.distance(p.x, p.y, world.coinPile.x, world.coinPile.y) < 90) {
              world.coins += world.coinPile.amount;
              world.coinPile.collected = true;
              fx.floater(p.x, p.y - 30, '+' + world.coinPile.amount + ' 金币', 'crit');
              audio.play('chest');
            } else if (world.shopPos && world.shopOffers.length &&
                utils.distance(p.x, p.y, world.shopPos.x, world.shopPos.y) < 120) {
              openPanel('shop');
            }
          }
        }
        if (input.pressedSet.has('Digit1')) world.activeGun = 0;
        if (input.pressedSet.has('Digit2')) world.activeGun = 1;
        input.pressedSet.clear();
      }
      if (world.transition.active) {
        world.transition.t += dt;
        if (world.transition.t >= 0.6) {
          world.transition.active = false;
          if (world.transition.rx === 'next') advanceLayer();
          else enterRoom(world.transition.rx, world.transition.ry);
        }
        return;
      }
      if (state.paused || state.screen === 'dead' || state.screen === 'win') return;
      if (fx.hitStopMs > 0) {
        fx.hitStopMs -= dt * 1000;
        return;
      }
      if (fx.slowmoT > 0) {
        fx.slowmoT -= dt;
        dt *= fx.slowmoFactor;
      } else if (input.keys.has('Space') && state.screen === 'playing' && !world.dash.active) {
        dt *= 0.35; // 按住空格进入慢动作瞄准
      }
      const p = world.player;
      const mx = input.mouse.x + camera.x - view.w / 2;
      const my = input.mouse.y + camera.y - view.h / 2;
      p.aimAngle = Math.atan2(my - p.y, mx - p.x);

      let dx = 0, dy = 0;
      if (input.keys.has('KeyW')) dy -= 1;
      if (input.keys.has('KeyS')) dy += 1;
      if (input.keys.has('KeyA')) dx -= 1;
      if (input.keys.has('KeyD')) dx += 1;
      let moveX = 0, moveY = 0;
      if (dx || dy) {
        const l = Math.hypot(dx, dy);
        moveX = dx / l;
        moveY = dy / l;
      }
      // 惯性滑动：加速到上限，松键后自然衰减
      const ACCEL = 1500;
      p.vx += moveX * ACCEL * dt;
      p.vy += moveY * ACCEL * dt;
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > p.speed) {
        p.vx = (p.vx / spd) * p.speed;
        p.vy = (p.vy / spd) * p.speed;
      }
      const damp = Math.exp(-5.5 * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);

      // 瞬身：空格+左键向准星方向短距离滑步
      const dash = world.dash;
      dash.cd = Math.max(0, dash.cd - dt);
      if (dash.active) {
        dash.t -= dt;
        p.x += Math.cos(dash.angle) * 1400 * dt;
        p.y += Math.sin(dash.angle) * 1400 * dt;
        for (let s = 0; s < 2; s++) {
          fx.spawn({
            kind: 'dash', x: p.x + utils.rand(-5, 5), y: p.y + utils.rand(-5, 5),
            vx: -Math.cos(dash.angle) * 240, vy: -Math.sin(dash.angle) * 240,
            life: 0.28, color: '#35e0ff', size: 7 + Math.random() * 6, angle: dash.angle
          });
        }
        dash.ghostT += dt;
        if (dash.ghostT > 0.02) {
          dash.ghostT = 0;
          world.dashGhosts.push({
            x: p.x, y: p.y, angle: p.aimAngle,
            life: 0.3, maxLife: 0.3, color: '#35e0ff'
          });
          if (world.dashGhosts.length > 12) world.dashGhosts.shift();
        }
        if (dash.t <= 0) dash.active = false;
      }
      if (input.mouse.down && !input.mouse.downPrev &&
          input.keys.has('Space') && dash.cd <= 0 && !dash.active && state.screen === 'playing') {
        const mxw = input.mouse.x + camera.x - view.w / 2;
        const myw = input.mouse.y + camera.y - view.h / 2;
        dash.angle = Math.atan2(myw - p.y, mxw - p.x);
        dash.active = true;
        dash.t = 0.13;
        dash.cd = 3;
        p.invuln = 0.25;
        audio.play('dash');
      }
      input.mouse.downPrev = input.mouse.down;
      p.x = utils.clamp(p.x, p.radius, world.room.w - p.radius);
      p.y = utils.clamp(p.y, p.radius, world.room.h - p.radius);
      const resP = resolveObstaclesFor(p.x, p.y, p.radius);
      p.x = resP.x;
      p.y = resP.y;

      updateGun(dt);
      updateBullets(dt);
      updateEnemies(dt);
      checkRoomProgress();
      checkDoors(dt);
      updateParticles(dt);
      updateCasings(dt);
      updateTracers(dt);
      updateFloaters(dt);
      updatePickups(dt);
      updateChains(dt);
      updateDashGhosts(dt);
      updateImpactMarks(dt);

      p.invuln -= dt;
      fx.shakePower *= Math.exp(-6 * dt);
      if (p.hp < world.hpDelay) world.hpDelay = Math.max(p.hp, world.hpDelay - 26 * dt);
      else world.hpDelay = p.hp;
      if (state.screen === 'playing' && p.hp > 0 && p.hp < p.maxHp * 0.3) {
        world.lowhpT -= dt;
        if (world.lowhpT <= 0) {
          world.lowhpT = 0.85;
          audio.play('lowhp');
        }
      }

      // 视角随准星走：目标点偏向鼠标方向 32%，并限制在房间可视范围内
      const mxw = input.mouse.x + camera.x - view.w / 2;
      const myw = input.mouse.y + camera.y - view.h / 2;
      const r = world.room;
      const halfW = view.w / 2, halfH = view.h / 2;
      const minX = r.w <= view.w ? r.w / 2 : halfW;
      const maxX = r.w <= view.w ? r.w / 2 : r.w - halfW;
      const minY = r.h <= view.h ? r.h / 2 : halfH;
      const maxY = r.h <= view.h ? r.h / 2 : r.h - halfH;
      const tx = utils.clamp(p.x + (mxw - p.x) * 0.32, minX, maxX);
      const ty = utils.clamp(p.y + (myw - p.y) * 0.32, minY, maxY);
      camera.x += (tx - camera.x) * Math.min(1, 8 * dt);
      camera.y += (ty - camera.y) * Math.min(1, 8 * dt);
      world.time += dt;
    }

    function fireOnce(g) {
      const p = world.player;
      const st = g.stats;
      const muzzleX = p.x + Math.cos(p.aimAngle) * 22;
      const muzzleY = p.y + Math.sin(p.aimAngle) * 22;
      const baseAngle = p.aimAngle + (Math.random() - 0.5) * 2 * st.spread;
      for (let i = 0; i < st.pellet; i++) {
        const a = baseAngle + (i - (st.pellet - 1) / 2) * 0.04;
        world.bullets.push({
          x: muzzleX, y: muzzleY,
          px: muzzleX, py: muzzleY,
          vx: Math.cos(a) * st.bulletSpeed,
          vy: Math.sin(a) * st.bulletSpeed,
          speed: st.bulletSpeed,
          damage: st.damage,
          pierce: st.pierce,
          friendly: true,
          life: 1.2,
          color: '#ffd166',
          size: 3,
          kind: 'standard',
          split: st.splitCount,
          boomR: st.explosionRadius,
          homing: st.homing,
          chain: st.chain,
          fx: {
            critChance: st.critChance, critMult: st.critMult,
            burnDps: st.burnDps, burnT: st.burnT,
            slowPct: st.slowPct, slowT: st.slowT,
            vamp: st.vamp
          }
        });
      }
      fx.muzzle(muzzleX, muzzleY, p.aimAngle, '#ffd166');
      fx.casing(p.x, p.y, p.aimAngle);
      fx.smoke(muzzleX, muzzleY);
      world.tracers.push({
        x0: muzzleX, y0: muzzleY,
        x1: muzzleX + Math.cos(p.aimAngle) * 46,
        y1: muzzleY + Math.sin(p.aimAngle) * 46,
        life: 0.09, color: '#ffd166'
      });
      p.recoil = Math.min(1, p.recoil + (GUN_RECOIL[g.parts.body.id] || 0.35));
      audio.play(GUN_SOUNDS[g.parts.body.id] || 'pistol');
    }

    function updateGun(dt) {
      const p = world.player;
      if (input.wheelDelta !== 0) {
        world.activeGun = (world.activeGun + (input.wheelDelta > 0 ? 1 : -1) + 2) % 2;
        input.wheelDelta = 0;
      }

      const g = gun();
      g.cooldown -= dt;
      if (g.reloading) {
        g.reloadT -= dt;
        if (g.reloadT <= 0) {
          g.reloading = false;
          g.mag = g.stats.magSize;
          audio.play('reload_done');
        }
      }
      if ((input.pressedSet.has('KeyR') || input.keys.has('KeyR')) && !g.reloading && g.mag < g.stats.magSize) {
        g.reloading = true;
        g.reloadT = g.stats.reloadTime;
      }
      if (input.mouse.down && !world.dash.active && !g.reloading && g.mag > 0 && g.cooldown <= 0) {
        g.cooldown = 1 / g.stats.fireRate;
        g.mag--;
        fireOnce(g);
      }
      p.recoil *= Math.pow(0.0001, dt);
    }

    function updateBullets(dt) {
      const r = world.room;
      const p = world.player;
      for (let i = world.bullets.length - 1; i >= 0; i--) {
        const b = world.bullets[i];
        if (b.friendly && b.homing) {
          let nearest = null, nd = 1e9;
          for (const e of world.enemies) {
            if (e.dead) continue;
            const d = Math.hypot(e.x - b.x, e.y - b.y);
            if (d < nd) { nd = d; nearest = e; }
          }
          if (nearest) {
            const cur = Math.atan2(b.vy, b.vx);
            const want = Math.atan2(nearest.y - b.y, nearest.x - b.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const turn = utils.clamp(diff, -4 * dt, 4 * dt);
            const sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(cur + turn) * sp;
            b.vy = Math.sin(cur + turn) * sp;
          }
        }
        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < r.x - 40 || b.x > r.w + 40 || b.y < r.y - 40 || b.y > r.h + 40) {
          utils.swapRemove(world.bullets, i);
          continue;
        }
        const obs = world.room.obstacles || [];
        let hitObs = false;
        for (const o of obs) {
          if (utils.circleRectHit(b.x, b.y, b.size, o)) {
            fx.sparks(b.x, b.y, '#8fa6b8', 4);
            world.impactMarks.push({ x: b.x, y: b.y, life: 2.5, color: b.color });
            hitObs = true;
            break;
          }
        }
        if (hitObs) {
          utils.swapRemove(world.bullets, i);
          continue;
        }
        if (b.friendly) {
          for (let j = 0; j < world.enemies.length; j++) {
            const e = world.enemies[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.size) {
              const hitAngle = Math.atan2(b.vy, b.vx);
              damageEnemy(e, b.damage, hitAngle, b.fx);
              if (b.boomR > 0) {
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  if (Math.hypot(e2.x - b.x, e2.y - b.y) <= b.boomR + e2.radius) {
                    damageEnemy(e2, b.damage * 0.8, Math.atan2(e2.y - b.y, e2.x - b.x), b.fx);
                  }
                }
                fx.burst(b.x, b.y, '#ff8f3d', 14);
                fx.shake(5);
                audio.play('boom');
              }
              if (b.chain > 0) {
                let best = null, bd = 90;
                for (const e2 of world.enemies) {
                  if (e2 === e || e2.dead) continue;
                  const d = Math.hypot(e2.x - b.x, e2.y - b.y);
                  if (d < bd) { bd = d; best = e2; }
                }
                if (best) {
                  damageEnemy(best, b.damage * 0.5, Math.atan2(best.y - b.y, best.x - b.x), b.fx);
                  world.chains.push({ x1: b.x, y1: b.y, x2: best.x, y2: best.y, life: 0.12 });
                  audio.play('zap');
                }
              }
              if (b.split > 0) {
                for (let s = 0; s < b.split; s++) {
                  const a = hitAngle + (s - (b.split - 1) / 2) * 0.3;
                  world.bullets.push({
                    x: b.x, y: b.y,
                    px: b.x, py: b.y,
                    vx: Math.cos(a) * b.speed * 0.9,
                    vy: Math.sin(a) * b.speed * 0.9,
                    speed: b.speed * 0.9,
                    damage: b.damage * 0.4,
                    pierce: 0,
                    friendly: true,
                    life: 0.55,
                    color: b.color,
                    size: 2.2,
                    kind: 'fragment',
                    split: 0, boomR: 0, homing: false, chain: 0,
                    fx: b.fx
                  });
                }
              }
              if (b.pierce > 0) {
                b.pierce--;
              } else {
                utils.swapRemove(world.bullets, i);
              }
              break;
            }
          }
        } else {
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.size) {
            damagePlayer(b.damage, Math.atan2(b.vy, b.vx));
            utils.swapRemove(world.bullets, i);
          }
        }
      }
    }

    function updateParticles(dt) {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const q = world.particles[i];
        q.life -= dt;
        if (q.life <= 0) { utils.swapRemove(world.particles, i); continue; }
        const damp = Math.exp(-3 * dt);
        q.vx *= damp;
        q.vy *= damp;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        if (q.kind === 'smoke') q.size += 30 * dt;
      }
    }

    function updateCasings(dt) {
      const r = world.room;
      for (let i = world.casings.length - 1; i >= 0; i--) {
        const c = world.casings[i];
        c.life -= dt;
        if (c.life <= 0) { utils.swapRemove(world.casings, i); continue; }
        c.vy += 620 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= Math.exp(-2 * dt);
        if (c.y > r.h - 4) {
          c.y = r.h - 4;
          c.vy *= -0.35;
          c.vx *= 0.7;
        }
        c.rot += c.vr * dt;
      }
    }

    function updateTracers(dt) {
      for (let i = world.tracers.length - 1; i >= 0; i--) {
        world.tracers[i].life -= dt;
        if (world.tracers[i].life <= 0) utils.swapRemove(world.tracers, i);
      }
    }

    function updateFloaters(dt) {
      for (let i = world.floaters.length - 1; i >= 0; i--) {
        const f = world.floaters[i];
        f.life -= dt;
        f.y -= 42 * dt;
        if (f.life <= 0) utils.swapRemove(world.floaters, i);
      }
    }

    function updatePickups(dt) {
      const p = world.player;
      for (let i = world.pickups.length - 1; i >= 0; i--) {
        const k = world.pickups[i];
        k.life -= dt;
        if (k.life <= 0) { utils.swapRemove(world.pickups, i); continue; }
        const d = Math.hypot(p.x - k.x, p.y - k.y);
        if (k.kind === 'coin' && d < 130) {
          k.vx += (p.x - k.x) / (d || 1) * 700 * dt;
          k.vy += (p.y - k.y) / (d || 1) * 700 * dt;
        }
        k.vx *= Math.exp(-3 * dt);
        k.vy *= Math.exp(-3 * dt);
        k.x += k.vx * dt;
        k.y += k.vy * dt;
        if (d < p.radius + 12) {
          if (k.kind === 'coin') {
            world.coins += k.value;
            audio.play('pickup');
          } else if (k.kind === 'medkit') {
            p.hp = Math.min(p.maxHp, p.hp + 25);
            fx.floater(p.x, p.y - 24, '+25', 'crit');
            audio.play('pickup');
          } else if (k.kind === 'part') {
            pushPart(k.part);
            fx.floater(p.x, p.y - 24, '获得 ' + k.part.name, 'normal');
            audio.play('pickup');
          }
          utils.swapRemove(world.pickups, i);
        }
      }
    }

    function updateChains(dt) {
      for (let i = world.chains.length - 1; i >= 0; i--) {
        world.chains[i].life -= dt;
        if (world.chains[i].life <= 0) utils.swapRemove(world.chains, i);
      }
    }

    function updateDashGhosts(dt) {
      for (let i = world.dashGhosts.length - 1; i >= 0; i--) {
        world.dashGhosts[i].life -= dt;
        if (world.dashGhosts[i].life <= 0) utils.swapRemove(world.dashGhosts, i);
      }
    }

    function updateImpactMarks(dt) {
      for (let i = world.impactMarks.length - 1; i >= 0; i--) {
        world.impactMarks[i].life -= dt;
        if (world.impactMarks[i].life <= 0) utils.swapRemove(world.impactMarks, i);
      }
    }

    // ===== 房间流程 =====
    function startMap(seed, layer) {
      world.layer = layer || 1;
      world.map = mapModule.generate(seed, world.layer);
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: world.map.rooms.length, clearedRooms: 0 };
      enterRoom(0, 0);
    }

    function advanceLayer() {
      world.layer++;
      world.map = mapModule.generate(Math.floor(Math.random() * 100000) + 1, world.layer);
      world.mapInfo = { roomPos: { x: 0, y: 0 }, totalRooms: world.map.rooms.length, clearedRooms: 0 };
      enterRoom(0, 0);
      world.player.hp = Math.min(world.player.maxHp, world.player.hp + 30);
      world.player.invuln = 1;
      fx.floater(world.player.x, world.player.y - 40, '进入第 ' + world.layer + ' 层', 'crit');
      audio.play('door');
    }

    function randSpawnPos() {
      for (let tries = 0; tries < 30; tries++) {
        const x = utils.rand(120, world.room.w - 120);
        const y = utils.rand(120, world.room.h - 120);
        const obs = world.room.obstacles || [];
        let ok = true;
        for (const o of obs) {
          if (utils.rectsOverlap(o.x - 40, o.y - 40, o.w + 80, o.h + 80, x - 20, y - 20, 40, 40)) { ok = false; break; }
        }
        if (ok) return { x, y };
      }
      return { x: utils.rand(120, world.room.w - 120), y: utils.rand(120, world.room.h - 120) };
    }

    function genObstacles(room) {
      const count = room.type === 'boss' ? 5 : room.type === 'elite' ? 3 : 2;
      const list = [];
      for (let i = 0; i < count; i++) {
        for (let tries = 0; tries < 24; tries++) {
          const w = utils.randInt(60, 130);
          const h = utils.randInt(40, 90);
          const x = utils.rand(140, ROOM_W - 140 - w);
          const y = utils.rand(140, ROOM_H - 140 - h);
          const rect = { x, y, w, h };
          const cx = ROOM_W / 2, cy = ROOM_H / 2;
          if (utils.rectsOverlap(rect.x, rect.y, rect.w, rect.h, cx - 100, cy - 100, 200, 200)) continue;
          if (room.doors.n && rect.y < 80) continue;
          if (room.doors.s && rect.y + rect.h > ROOM_H - 80) continue;
          if (room.doors.w && rect.x < 80) continue;
          if (room.doors.e && rect.x + rect.w > ROOM_W - 80) continue;
          if (list.some(o => utils.rectsOverlap(o.x - 30, o.y - 30, o.w + 60, o.h + 60, rect.x, rect.y, rect.w, rect.h))) continue;
          list.push(rect);
          break;
        }
      }
      return list;
    }

    function resolveObstaclesFor(x, y, r) {
      const obs = world.room.obstacles || [];
      for (const o of obs) {
        const res = utils.resolveCircleRect(x, y, r, o);
        x = res.x;
        y = res.y;
      }
      return { x, y };
    }

    function enterRoom(rx, ry) {
      const room = world.map.rooms.find(r => r.x === rx && r.y === ry);
      if (!room) return;
      room.visited = true;
      world.room = room;
      world.mapInfo.roomPos = { x: rx, y: ry };
      world.enemies.length = 0;
      world.bullets.length = 0;
      world.pickups.length = 0;
      world.chains.length = 0;
      world.casings.length = 0;
      world.tracers.length = 0;
      world.chest = null;
      world.chestPart = null;
      world.coinPile = null;
      world.shopOffers = [];
      world.shopPrices = [];
      world.shopPos = null;
      camera.x = ROOM_W / 2;
      camera.y = ROOM_H / 2;
      world.player.x = ROOM_W / 2;
      world.player.y = ROOM_H / 2;
      if (room.spawned || room.cleared) return;
      room.spawned = true;
      room.obstacles = genObstacles(room);
      if (room.type === 'combat') {
        const layerBonus = (world.layer - 1) * 2;
        const n = Math.min(18, (4 + Math.floor(room.depth * 0.7) + layerBonus) * 2);
        for (let i = 0; i < n; i++) {
          const rr = Math.random();
          const kind = rr < 0.4 ? 'chaser' : rr < 0.7 ? 'shooter' : rr < 0.9 ? 'splitter' : 'buzzer';
          const sc = 1 + room.depth * 0.12 + (world.layer - 1) * 0.2 + (Math.random() < 0.2 ? 1 : 0);
          const pos = randSpawnPos();
          world.enemies.push(spawnEnemy(kind, pos.x, pos.y, sc));
        }
      } else if (room.type === 'elite') {
        const pos = randSpawnPos();
        const es = 1 + (world.layer - 1) * 0.35;
        world.enemies.push(spawnEnemy('elite', pos.x, pos.y, es));
        world.enemies.push(spawnEnemy('shooter', pos.x - 240, pos.y, 1.3 + (world.layer - 1) * 0.3));
        world.enemies.push(spawnEnemy('shooter', pos.x + 240, pos.y, 1.3 + (world.layer - 1) * 0.3));
      } else if (room.type === 'boss') {
        world.enemies.push(spawnEnemy('boss', ROOM_W / 2, ROOM_H / 2, 1 + (world.layer - 1) * 0.4));
      } else if (room.type === 'treasure') {
        world.chest = { x: ROOM_W / 2, y: ROOM_H / 2, opened: false };
      } else if (room.type === 'coin') {
        world.coinPile = {
          x: ROOM_W / 2, y: ROOM_H / 2,
          amount: utils.randInt(1, Math.max(1, world.stats.kills)),
          collected: false
        };
      } else if (room.type === 'shop') {
        world.shopPos = { x: ROOM_W / 2 + 260, y: ROOM_H / 2 };
        world.shopOffers = [partsEngine.rollPart(), partsEngine.rollPart(), partsEngine.rollPart()];
        const PRICES = [10, 20, 40, 80, 150];
        world.shopPrices = world.shopOffers.map(o => PRICES[o.rarity] || 40);
      }
    }

    function checkRoomProgress() {
      const room = world.room;
      if (!room || room.cleared) return;
      const needsClear = room.type === 'combat' || room.type === 'elite' || room.type === 'boss';
      if (needsClear && world.enemies.length > 0) return;
      room.cleared = true;
      world.mapInfo.clearedRooms++;
      if (needsClear) {
        audio.play('door');
        fx.floater(world.player.x, world.player.y - 40, '门已开启', 'normal');
      }
    }

    function checkDoors(dt) {
      const p = world.player;
      const r = world.room;
      if (!r || !r.cleared) return;
      const zone = 70;
      let dir = null;
      if (r.doors.n && p.y < zone) dir = { dx: 0, dy: -1 };
      else if (r.doors.s && p.y > r.h - zone) dir = { dx: 0, dy: 1 };
      else if (r.doors.w && p.x < zone) dir = { dx: -1, dy: 0 };
      else if (r.doors.e && p.x > r.w - zone) dir = { dx: 1, dy: 0 };
      if (dir) {
        world.transition = { active: true, t: 0, rx: r.x + dir.dx, ry: r.y + dir.dy };
        audio.play('door');
      }
    }

    // ===== 面板 UI =====
    function openPanel(name) {
      ui.panel = name;
      ui.scroll = 0;
      state.paused = true;
      ui.title = name === 'parts' ? '部件背包（点击装备，旧件自动卸下回背包）' :
        name === 'shop' ? '武器商店' : '宝箱';
      buildPanelRows();
      audio.play('ui');
    }

    function closePanel() {
      ui.panel = 'none';
      ui.items = [];
      ui.loadout = [];
      ui.loadoutChips = [];
      state.paused = false;
      audio.play('ui');
    }

    function panelMetrics(rowCountOverride) {
      const panelW = 460;
      const header = 60;
      const loadoutH = ui.panel === 'parts' ? 124 : 0;
      const n = rowCountOverride !== undefined ? rowCountOverride : ui.items.length;
      const panelH = Math.min(
        header + loadoutH + n * 52 + 30,
        Math.max(120, view.h - 40)
      );
      return {
        panelW,
        panelH,
        px: view.w / 2 - panelW / 2,
        py: view.h / 2 - panelH / 2
      };
    }

    function buildPanelRows() {
      const rows = [];
      const rowCount = ui.panel === 'parts' ? world.inventory.length :
        ui.panel === 'shop' ? world.shopOffers.length :
        (world.chestPart ? 1 : 0);
      const { panelW, py } = panelMetrics(rowCount);
      const x0 = view.w / 2 - panelW / 2 + 16;
      if (ui.panel === 'parts') {
        const g = gun();
        const SLOT_NAMES = { body: '枪身', ammo: '弹药', mod: '配件' };
        ui.loadout = ['body', 'ammo', 'mod'].map(slot => ({
          slot, slotName: SLOT_NAMES[slot], part: g.parts[slot], defId: PART_DEFAULTS[slot]
        }));
        ui.loadoutChips = ui.loadout.map((entry, idx) => {
          const cw2 = 132, ch2 = 28;
          const cx2 = x0 + idx * (cw2 + 8);
          const cy2 = py + 92;
          return { x: cx2, y: cy2, w: cw2, h: ch2, slot: entry.slot };
        });
        let y = py + 128;
        for (const part of world.inventory) {
          const equipped = g.parts[part.slot];
          const denied = equipped && equipped.id !== 'none_mod' && equipped.id === part.id;
          rows.push({
            x: x0, y, w: panelW - 32, h: 44,
            part, price: null, action: 'equip',
            denied, slotName: SLOT_NAMES[part.slot]
          });
          y += 52;
        }
      } else if (ui.panel === 'shop') {
        let y = py + 96;
        for (let i = 0; i < world.shopOffers.length; i++) {
          rows.push({ x: x0, y, w: panelW - 32, h: 44, part: world.shopOffers[i], price: world.shopPrices[i], action: 'buy' });
          y += 52;
        }
      } else if (ui.panel === 'chest') {
        const part = world.chestPart;
        if (part) rows.push({ x: x0, y: py + 96, w: panelW - 32, h: 44, part, price: null, action: 'take' });
      }
      ui.items = rows;
      ui.maxScroll = Math.max(0, rowCount * 52 - (panelMetrics(rowCount).panelH - 158));
      ui.scroll = utils.clamp(ui.scroll || 0, 0, ui.maxScroll);
      for (const row of rows) row.y -= ui.scroll;
    }

    function uiClick(x, y) {
      for (const chip of ui.loadoutChips || []) {
        if (x >= chip.x && x <= chip.x + chip.w && y >= chip.y && y <= chip.y + chip.h) {
          unequipPart(chip.slot);
          buildPanelRows();
          return;
        }
      }
      for (const row of ui.items) {
        if (x >= row.x && x <= row.x + row.w && y >= row.y && y <= row.y + row.h) {
          if (row.action === 'equip') {
            if (row.denied) {
              audio.play('deny');
              return;
            }
            equipPart(row.part);
            buildPanelRows();
            if (!world.inventory.length) closePanel();
          } else if (row.action === 'buy') {
            if (world.coins >= row.price) {
              world.coins -= row.price;
              pushPart(row.part);
              const idx = world.shopOffers.indexOf(row.part);
              if (idx >= 0) { world.shopOffers.splice(idx, 1); world.shopPrices.splice(idx, 1); }
              audio.play('buy');
              buildPanelRows();
            } else {
              audio.play('deny');
            }
          } else if (row.action === 'take') {
            pushPart(row.part);
            world.coins += 3;
            world.chestPart = null;
            if (world.chest) world.chest.opened = true;
            audio.play('chest');
            closePanel();
          }
          return;
        }
      }
    }

    // ---------- render ----------
    function render(alpha) {
      ctx.clearRect(0, 0, view.w, view.h);
      ctx.fillStyle = '#0a0e16';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.save();
      const shx = (Math.random() * 2 - 1) * fx.shakePower;
      const shy = (Math.random() * 2 - 1) * fx.shakePower;
      const p = world.player;
      const kickX = -Math.cos(p.aimAngle) * p.recoil * 9;
      const kickY = -Math.sin(p.aimAngle) * p.recoil * 9;
      ctx.translate(view.w / 2 - camera.x + shx + kickX, view.h / 2 - camera.y + shy + kickY);
      drawRoom();
      drawScanline();
      drawDoors();
      drawObstacles();
      drawBullets();
      drawCasings();
      drawImpactMarks();
      drawParticles();
      drawTracers();
      drawChains();
      drawPickups();
      drawMarkers();
      drawEnemies();
      drawFloaters();
      drawDashGhosts();
      drawPlayer();
      ctx.restore();
      drawHUD();
      drawPanel();
      drawOverlay();
      drawLowHpVignette();
      if (state.screen === 'playing' && input.keys.has('Space') && !world.dash.active) {
        ctx.fillStyle = 'rgba(53, 224, 255, 0.06)';
        ctx.fillRect(0, 0, view.w, view.h);
      }
      if (world.transition.active) {
        ctx.fillStyle = 'rgba(4, 8, 14, ' + (world.transition.t / 0.6) + ')';
        ctx.fillRect(0, 0, view.w, view.h);
      }
    }

    function drawRoom() {
      const r = world.room;
      const ac = accent();
      ctx.fillStyle = 'rgba(14, 20, 32, 0.92)';
      ctx.fillRect(r.x, r.y, r.w, r.h);

      ctx.strokeStyle = ac;
      ctx.globalAlpha = 0.08;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = r.x; gx <= r.w; gx += 80) { ctx.moveTo(gx, r.y); ctx.lineTo(gx, r.h); }
      for (let gy = r.y; gy <= r.h; gy += 80) { ctx.moveTo(r.x, gy); ctx.lineTo(r.w, gy); }
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.shadowColor = ac;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = ac;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.shadowBlur = 0;

      // 四角装饰
      ctx.fillStyle = ac;
      ctx.globalAlpha = 0.55;
      const c = 14;
      ctx.fillRect(r.x, r.y, c, c); ctx.fillRect(r.w - c, r.y, c, c);
      ctx.fillRect(r.x, r.h - c, c, c); ctx.fillRect(r.w - c, r.h - c, c, c);
      ctx.globalAlpha = 1;
    }

    function drawBullets() {
      for (const b of world.bullets) {
        const t = b.trail || [];
        if (t.length > 1) {
          ctx.lineCap = 'round';
          for (let pass = 0; pass < 2; pass++) {
            const maxW = pass === 0 ? b.size * 2.6 : b.size * 1.1;
            const alphaMul = pass === 0 ? 0.22 : 0.5;
            for (let i = 0; i < t.length - 1; i++) {
              const f = (i + 1) / t.length;
              ctx.strokeStyle = b.color;
              ctx.globalAlpha = alphaMul * f;
              ctx.lineWidth = Math.max(0.5, maxW * f);
              ctx.beginPath();
              ctx.moveTo(t[i].x, t[i].y);
              ctx.lineTo(t[i + 1].x, t[i + 1].y);
              ctx.stroke();
            }
          }
          ctx.lineCap = 'butt';
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCasings() {
      for (const c of world.casings) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = utils.clamp(c.life / 0.4, 0, 1);
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(-3, -1.5, 6, 3);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      for (const q of world.particles) {
        const a = utils.clamp(q.life / q.maxLife, 0, 1);
        if (q.kind === 'muzzle') {
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'smoke') {
          ctx.globalAlpha = a * 0.16;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'spark') {
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'burst') {
          ctx.save();
          ctx.translate(q.x, q.y);
          ctx.rotate(q.rot);
          ctx.globalAlpha = a;
          ctx.fillStyle = q.color;
          ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size);
          ctx.restore();
          ctx.globalAlpha = 1;
        } else if (q.kind === 'dash') {
          const streak = Math.max(1, q.size * (1.4 - a * 0.8));
          ctx.globalAlpha = a * 0.55;
          ctx.strokeStyle = q.color;
          ctx.lineWidth = streak;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(q.x, q.y);
          ctx.lineTo(
            q.x - Math.cos(q.angle || 0) * streak * 2.6,
            q.y - Math.sin(q.angle || 0) * streak * 2.6
          );
          ctx.stroke();
          ctx.lineCap = 'butt';
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawEnemies() {
      for (const e of world.enemies) {
        const flash = e.flash > 0;
        ctx.save();
        if (e.kind === 'boss') {
          const phaseColor = e.phase >= 3 ? '#ff4d5e' : e.phase === 2 ? '#ffd166' : '#35e0ff';
          ctx.shadowColor = e.color;
          ctx.shadowBlur = 20;
          ctx.fillStyle = flash ? '#ffffff' : e.color;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          // 内层同心环
          ctx.strokeStyle = phaseColor;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * 0.62, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * 0.36, 0, Math.PI * 2);
          ctx.stroke();
          // 旋转外环 14 块
          ctx.fillStyle = phaseColor;
          const seg = Math.PI * 2 / Math.max(1, e.ringSegs);
          for (let i = 0; i < e.ringSegs; i++) {
            const a = e.rotation + i * seg;
            const rx = e.x + Math.cos(a) * e.radius;
            const ry = e.y + Math.sin(a) * e.radius;
            ctx.fillRect(rx - 4, ry - 4, 8, 8);
          }
          // 核心
          ctx.fillStyle = flash ? '#ffffff' : e.coreColor;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * 0.18, 0, Math.PI * 2);
          ctx.fill();
          // 血条
          const bw = 300, bh = 10;
          const by = e.y - e.radius - 34;
          ctx.fillStyle = 'rgba(0,0,0,0.65)';
          ctx.fillRect(e.x - bw / 2, by, bw, bh);
          ctx.fillStyle = '#ff3d81';
          ctx.fillRect(e.x - bw / 2, by, bw * utils.clamp(e.hp / e.maxHp, 0, 1), bh);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(e.x - bw / 2 + bw * 0.4, by - 3, 2, bh + 6);
          ctx.fillRect(e.x - bw / 2 + bw * 0.7, by - 3, 2, bh + 6);
          ctx.restore();
          continue;
        }
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = flash ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = flash ? '#ffffff' : e.coreColor;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        if (e.state === 'telegraph') {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(world.time * 30);
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        if (e.shield > 0) {
          ctx.strokeStyle = '#b06cff';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#b06cff';
          ctx.shadowBlur = 10;
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(world.time * 6);
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
        }
        if (e.hp < e.maxHp) {
          const bw = e.radius * 2, bh = 4;
          const bx = e.x - bw / 2, by = e.y - e.radius - 10;
          const frac = utils.clamp(e.hp / e.maxHp, 0, 1);
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = frac > 0.5 ? '#7ef29a' : frac > 0.25 ? '#ffd166' : '#ff4d5e';
          ctx.fillRect(bx, by, bw * frac, bh);
          if (e.maxShield > 0) {
            const sfrac = utils.clamp(e.shield / e.maxShield, 0, 1);
            ctx.fillStyle = 'rgba(176,108,255,0.8)';
            ctx.fillRect(bx, by - 6, bw * sfrac, 3);
          }
        }
        ctx.restore();
      }
    }

    function drawFloaters() {
      ctx.textAlign = 'center';
      for (const f of world.floaters) {
        const a = utils.clamp(f.life / f.maxLife, 0, 1);
        ctx.globalAlpha = a;
        if (f.kind === 'crit') {
          ctx.fillStyle = '#ffd166';
          ctx.font = 'bold 20px Consolas, monospace';
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px Consolas, monospace';
        }
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawDashGhosts() {
      for (const g of world.dashGhosts) {
        const a = utils.clamp(g.life / g.maxLife, 0, 1);
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.angle);
        ctx.globalAlpha = a * 0.4;
        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-10, 11);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, -11);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawTracers() {
      for (const t of world.tracers) {
        const a = utils.clamp(t.life / 0.09, 0, 1);
        ctx.globalAlpha = a;
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(t.x0, t.y0);
        ctx.lineTo(t.x1, t.y1);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x1, t.y1, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawChains() {
      for (const c of world.chains) {
        const a = utils.clamp(c.life / 0.12, 0, 1);
        ctx.globalAlpha = a;
        ctx.strokeStyle = '#35e0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c.x1, c.y1);
        const steps = 5;
